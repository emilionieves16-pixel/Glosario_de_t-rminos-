[30,71,72,73,81,87],"bib":"IEEE. (2017). *POSIX.1-2017: Standard for Information Technology — Portable Operating System Interface (POSIX)*. IEEE. — System Interfaces, §pthread_*.","annex":["b1","b5","a2"]},{"id":75,"n":75,"es":"Espacio de Direcciones Compartido","en":"Shared Address Space","slug":"espacio-de-direcciones-compartido","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Modelo en el que varios hilos (o procesos cooperantes) leen y escriben las mismas regiones de memoria virtual, lo que hace inevitable la sincronización explícita para mantener invariantes. En procesos distintos se logra con mmap MAP_SHARED o shmget.","rol":"Rendimiento y seguridad: evita copias y ofrece comunicación de baja latencia, pero introduce condiciones de carrera y requiere coherencia de caché.","cite":{"key":"ostep","cap":"Cap. 26","sec":"§26.1"},"rel":[71,76,77,78,80,268,272],"bib":"Arpaci-Dusseau, R. H., & Arpaci-Dusseau, A. C. (2018). *Operating Systems: Three Easy Pieces* (v1.00). Arpaci-Dusseau Books. — Cap. 26, §26.1.","annex":["b5","a1","a2"]},{"id":76,"n":76,"es":"Concurrencia","en":"Concurrency","slug":"concurrencia","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Propiedad de un sistema con múltiples flujos de ejecución que progresan en un periodo solapado, sea en un solo núcleo por intercalado o en varios por paralelismo. Su corrección exige sincronización, exclusión mutua y análisis de atomicidad.","rol":"Diseño del SO: sostiene la multiprogramación y la E/S asíncrona; su manejo incorrecto produce carreras, deadlocks y resultados no deterministas.","cite":{"key":"silb","cap":"Cap. 6","sec":"§6.1"},"rel":[72,73,75,77,78,79,85,89],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 6, §6.1.","annex":["a6","b5"]},{"id":77,"n":77,"es":"Paralelismo","en":"Parallelism","slug":"paralelismo","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Ejecución simultánea real de varios flujos en distintos núcleos o procesadores. Se distingue el paralelismo de datos (SIMD/GPU) del de tareas (hilos/multiproceso); exige coherencia de caché y sincronización para escalar.","rol":"Rendimiento: explota el hardware multinúcleo; su límite lo marca la ley de Amdahl y las secciones críticas no paralelizables.","cite":{"key":"silb","cap":"Cap. 4","sec":"§4.3"},"rel":[75,76,78,108],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 4, §4.3.","annex":["a1","b1","b4"]},{"id":78,"n":78,"es":"Sección Crítica","en":"Critical Section","slug":"seccion-critica","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Región de código que accede a un recurso compartido y debe ejecutarse con exclusión mutua para preservar invariantes. Las soluciones correctas cumplen: exclusión mutua, progreso y espera acotada (los tres requisitos de Peterson/Dijkstra).","rol":"Seguridad funcional: concentra los riesgos de carrera; el tamaño y la duración de la sección inciden directamente en escalabilidad.","cite":{"key":"silb","cap":"Cap. 6","sec":"§6.2"},"rel":[19,75,76,77,79,80,81,86,88],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 6, §6.2.","annex":["b5","a6"]},{"id":79,"n":79,"es":"Exclusión Mutua","en":"Mutual Exclusion","slug":"exclusion-mutua","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Requisito por el que solo un flujo ejecuta a la vez una sección crítica; se implementa con hardware (test-and-set, compare-and-swap, ldrex/strex) o con constructos del kernel (mutex, semáforo 1, futex).","rol":"Corrección: impide el entrelazado inválido de operaciones read-modify-write y evita pérdidas de actualización.","cite":{"key":"silb","cap":"Cap. 6","sec":"§6.2"},"rel":[76,78,80,81,86,87,88],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 6, §6.2.","annex":["b5","a2","a6"]},{"id":80,"n":80,"es":"Condición de Carrera (Race Condition)","en":"Race Condition","slug":"condicion-de-carrera-race-condition","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Anomalía en la que el resultado depende del orden o del instante de acceso concurrente a un recurso compartido. Ejemplo: dos hilos que incrementan contador con «load; add; store» pueden perder un incremento si no hay atomicidad.","rol":"Depuración y seguridad: muchas vulnerabilidades de tiempo de comprobación a tiempo de uso (TOCTOU) son carreras; se combaten con atomicidad y locks.","cite":{"key":"ostep","cap":"Cap. 26","sec":"§26.1"},"rel":[75,78,79,88,261],"bib":"Arpaci-Dusseau, R. H., & Arpaci-Dusseau, A. C. (2018). *Operating Systems: Three Easy Pieces* (v1.00). Arpaci-Dusseau Books. — Cap. 26, §26.1.","annex":["b5","a6","b1"]},{"id":81,"n":81,"es":"Cerrojo Mutex","en":"Mutex Lock","slug":"cerrojo-mutex","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Primitiva de bloqueo con semántica de propiedad: solo el hilo que tomó el mutex puede liberarlo. En Linux se implementa con futex, lo que permite espera eficiente en espacio de usuario y suspensión en el kernel solo bajo contención.","rol":"Exclusión mutua y rendimiento: protege secciones críticas cortas con bajo coste sin contención; el bloqueo mantenido induce esperas y posibles inversiones de prioridad.","cite":{"key":"kerrisk","cap":"Cap. 30","sec":"§30.1"},"rel":[74,78,79,82,86,87,88,99],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 30, §30.1.","annex":["a6","b1","b5"]},{"id":82,"n":82,"es":"Semáforo Binario","en":"Binary Semaphore","slug":"semaforo-binario","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Variable entera restringida a 0/1 manipulada atómicamente por wait (P) y signal (V); carece de propiedad, por lo que cualquier hilo puede liberarlo. Se usa para exclusión mutua entre procesos y para señalización de eventos.","rol":"Coordinación: sincroniza productores y consumidores y protege recursos entre procesos distintos, donde un mutex pthread no basta.","cite":{"key":"silb","cap":"Cap. 6","sec":"§6.6"},"rel":[57,81,83,84,85],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 6, §6.6.","annex":["a6","b5","a1"]},{"id":83,"n":83,"es":"Semáforo Contador (sem_t)","en":"Counting Semaphore","slug":"semaforo-contador-sem-t","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Semáforo POSIX (sem_t) con valor entero no negativo que representa unidades disponibles de un recurso; sem_wait lo decrementa (bloqueando en cero) y sem_post lo incrementa despertando a un esperante. Se crea con sem_init (hilos) o sem_open (procesos).","rol":"Arbitraje de recursos: controla el acceso a un número limitado de instancias (conexiones, buffers) sin sondeo.","cite":{"key":"kerrisk","cap":"Cap. 53","sec":"§53.1"},"rel":[82,84,85,98],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 53, §53.1.","annex":["b5","a1","a6"]},{"id":84,"n":84,"es":"Operación sem_wait","en":"sem_wait() / P operation","slug":"operacion-sem-wait","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Operación atómica que decrementa el semáforo si es mayor que cero o bloquea al llamante hasta que otro flujo realice sem_post; puede ser interrumpida por señal (EINTR) y en POSIX no garantiza despertar en orden FIFO estricto.","rol":"Sincronización: implementa la espera pasiva y evita el consumo de CPU en espera activa, base de productor-consumidor.","cite":{"key":"kerrisk","cap":"Cap. 53","sec":"§53.2"},"rel":[57,82,83,85,88],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 53, §53.2.","annex":["b5","a6","b1"]},{"id":85,"n":85,"es":"Operación sem_post","en":"sem_post() / V operation","slug":"operacion-sem-post","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Operación atómica que incrementa el semáforo y despierta a un proceso o hilo bloqueado en sem_wait; es asíncrona y segura frente a señales (async-signal-safe), lo que permite usarla desde manejadores.","rol":"Coordinación: libera unidades del recurso y desbloquea consumidores; su uso incorrecto (post de más) rompe la propiedad de exclusión mutua.","cite":{"key":"kerrisk","cap":"Cap. 53","sec":"§53.2"},"rel":[76,82,83,84],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 53, §53.2.","annex":["b5","a1","a6"]},{"id":86,"n":86,"es":"Monitor de Sincronización","en":"Monitor","slug":"monitor-de-sincronizacion","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Constructo de alto nivel que encapsula datos y procedimientos bajo exclusión mutua implícita, con variables de condición para espera. Introducido por Hoare (1974) y Brinch Hansen; lo soportan Java (synchronized) y los objetos protegidos de Ada.","rol":"Abstracción de concurrencia: reduce errores de programación al ocultar el locking manual y garantizar acceso serializado por construcción.","cite":{"key":"silb","cap":"Cap. 7","sec":"§7.3"},"rel":[78,79,81,87],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 7, §7.3.","annex":["a6","b5"]},{"id":87,"n":87,"es":"Variable de Condición","en":"Condition Variable","slug":"variable-de-condicion","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Objeto de sincronización (pthread_cond_t) que permite a un hilo esperar hasta que se cumpla un predicado, liberando el mutex de forma atómica durante la espera; se señala con signal o broadcast y debe reevaluarse el predicado en un bucle (spurious wakeups).","rol":"Coordinación: evita espera activa y permite patrones productor-consumidor correctos cuando el predicado no se puede expresar con un semáforo.","cite":{"key":"kerrisk","cap":"Cap. 30","sec":"§30.2"},"rel":[74,79,81,86,88],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 30, §30.2.","annex":["b5","a6","b1"]},{"id":88,"n":88,"es":"Spinlock (Espera Activa)","en":"Spinlock","slug":"spinlock-espera-activa","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Cerrojo que sondea atómicamente hasta adquirir el recurso, sin suspender el hilo. Adecuado solo para secciones críticas muy cortas y en contextos donde no se puede dormir (manejadores de interrupción, kernel no expropiativo); desperdicia CPU si la espera se prolonga.","rol":"Rendimiento y control: evita la latencia de bloqueo en SMP, pero exige desactivar interrupciones para no autobloquearse; su abuso degrada el rendimiento.","cite":{"key":"love","cap":"Cap. 10","sec":"§10.1"},"rel":[19,78,79,80,81,84,87,169],"bib":"Love, R. (2010). *Linux Kernel Development* (3.ª ed.). Addison-Wesley. — Cap. 10, §10.1.","annex":["a3","a6","b1"]},{"id":89,"n":89,"es":"Interbloqueo (Deadlock)","en":"Deadlock","slug":"interbloqueo-deadlock","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Situación en la que un conjunto de procesos se bloquea mutuamente esperando recursos que otros del conjunto retienen, de modo que ninguno puede avanzar. Se modela con el grafo de asignación de recursos y se aborda por prevención, evitación, detección o recuperación.","rol":"Arbitraje: el SO debe garantizar el progreso global; los deadlocks degradan o congelan el sistema y requieren políticas explícitas de manejo.","cite":{"key":"silb","cap":"Cap. 8","sec":"§8.1–8.8"},"rel":[3,76,90,91,92,93,94,95,96,97],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 8, §8.1–8.8.","annex":["a6","a1","a3"]},{"id":90,"n":90,"es":"Condiciones de Coffman","en":"Coffman Conditions","slug":"condiciones-de-coffman","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Cuatro condiciones necesarias y conjuntamente suficientes para el interbloqueo: exclusión mutua, retención y espera, no apropiación y espera circular. Basta negar una para prevenirlo, base de todas las estrategias de prevención.","rol":"Análisis: marco formal para diseñar políticas de asignación y auditar sistemas concurrentes frente a deadlocks.","cite":{"key":"coffman","cap":"Vol. 3","sec":"§2–3"},"rel":[89,91,92,93,95],"bib":"Coffman, E. G., Elphick, M. J., & Shoshani, A. (1971). System deadlocks. *ACM Computing Surveys, 3*(2), 67–78. — Vol. 3, §2–3.","annex":["a6","a2","b5"]},{"id":91,"n":91,"es":"Retención y Espera","en":"Hold and Wait","slug":"retencion-y-espera","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Condición de Coffman en la que un proceso retiene al menos un recurso mientras solicita otro adicional. Se previene exigiendo solicitud atómica de todos los recursos al inicio o liberando los retenidos antes de pedir más.","rol":"Control: la asignación total anticipada evita la condición, pero reduce la utilización y puede producir inanición.","cite":{"key":"silb","cap":"Cap. 8","sec":"§8.4"},"rel":[89,90,95],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 8, §8.4.","annex":["a6","a1","b1"]},{"id":92,"n":92,"es":"No Apropiación","en":"No Preemption","slug":"no-apropiacion","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Condición en la que un recurso solo puede liberarse voluntariamente por su titular. Se previene permitiendo la expropiación forzosa (poco viable para impresoras o archivos) o mediante protocolos de timeout y reversión.","rol":"Control: la apropiación es fácil en CPU y memoria (swap) y difícil en dispositivos; explica por qué la prevención total no es práctica.","cite":{"key":"silb","cap":"Cap. 8","sec":"§8.4"},"rel":[89,90,139],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 8, §8.4.","annex":["a6","a2","b2"]},{"id":93,"n":93,"es":"Espera Circular","en":"Circular Wait","slug":"espera-circular","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Condición en la que existe una cadena cerrada de procesos, cada uno esperando un recurso retenido por el siguiente. Se previene imponiendo un orden total de adquisición (numeración de recursos).","rol":"Prevención práctica: el ordenamiento global de cerrojos es la técnica más usada en código de kernel y aplicaciones concurrentes.","cite":{"key":"silb","cap":"Cap. 8","sec":"§8.4"},"rel":[89,90,94,95],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 8, §8.4.","annex":["a6","a1","b1"]},{"id":94,"n":94,"es":"Grafo de Asignación de Recursos","en":"Resource Allocation Graph","slug":"grafo-de-asignacion-de-recursos","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Grafo dirigido con procesos y recursos como nodos y aristas de solicitud/asignación que modela el estado de asignación. Un ciclo indica posible deadlock (deadlock seguro si los recursos son de instancia única); su análisis permite detección algorítmica.","rol":"Diagnóstico: herramienta de detección y de razonamiento sobre la seguridad de un estado de asignación.","cite":{"key":"silb","cap":"Cap. 8","sec":"§8.6"},"rel":[89,93,96,97],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 8, §8.6.","annex":["a6","a1","b1"]},{"id":95,"n":95,"es":"Prevención de Interbloqueos","en":"Deadlock Prevention","slug":"prevencion-de-interbloqueos","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Conjunto de técnicas que garantizan por diseño que al menos una condición de Coffman nunca ocurra: orden de recursos, asignación atómica, expropiación y solicitudes únicas. Son conservadoras y reducen la utilización de recursos.","rol":"Control preventivo: elimina estructuralmente la posibilidad de deadlock a cambio de restricciones en el uso de recursos.","cite":{"key":"silb","cap":"Cap. 8","sec":"§8.4"},"rel":[89,90,91,93,96,97],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 8, §8.4.","annex":["a6","b5"]},{"id":96,"n":96,"es":"Detección de Interbloqueos","en":"Deadlock Detection","slug":"deteccion-de-interbloqueos","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Enfoque que permite que el deadlock ocurra y lo identifica después mediante ciclos en el grafo de asignación o el algoritmo de detección por matrices (disponibles, asignación, solicitud). Al detectarlo se aplica recuperación: terminación de procesos o reasignación.","rol":"Rendimiento: solo se ejecuta periódicamente por su coste O(n²); su frecuencia equilibra detección temprana y sobrecarga.","cite":{"key":"silb","cap":"Cap. 8","sec":"§8.7"},"rel":[89,94,95,97],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 8, §8.7.","annex":["a6","a1","b1"]},{"id":97,"n":97,"es":"Algoritmo del Banquero","en":"Banker's Algorithm","slug":"algoritmo-del-banquero","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Algoritmo de evitación de deadlock (Dijkstra) que, ante una solicitud, simula la asignación y solo la concede si el estado resultante es seguro: existe al menos una secuencia en la que todos los procesos pueden terminar. Requiere conocer de antemano las necesidades máximas.","rol":"Control predictivo: mantiene el sistema en estados seguros; su aplicación práctica es limitada por el desconocimiento de la demanda máxima y su coste O(n²m).","cite":{"key":"silb","cap":"Cap. 8","sec":"§8.6"},"rel":[89,94,95,96],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 8, §8.6.","annex":["a6","a1","b1"]},{"id":98,"n":98,"es":"Inanición (Starvation)","en":"Starvation","slug":"inanicion-starvation","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Postergación indefinida de un proceso que, aunque no está bloqueado, nunca obtiene el recurso que necesita por políticas de asignación sesgadas (prioridades estáticas, LIFO en colas). Se corrige con envejecimiento (aging).","rol":"Equidad: el árbitro de recursos debe garantizar progreso acotado; la inanición suele coexistir con deadlock en sistemas mal diseñados.","cite":{"key":"silb","cap":"Cap. 6","sec":"§6.5"},"rel":[3,83,99,100,103,105,106,140],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 6, §6.5.","annex":["a6","a1","b1"]},{"id":99,"n":99,"es":"Inversión de Prioridades","en":"Priority Inversion","slug":"inversion-de-prioridades","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Fenómeno en el que una tarea de alta prioridad espera a un recurso retenido por una de baja prioridad, que a su vez es expropiada por una de prioridad media; la alta prioridad queda efectivamente postergada. Se resuelve con herencia de prioridad o techo de prioridad.","rol":"Control de tiempo real: en sistemas RT puede provocar incumplimientos de plazos; es causa documentada de fallos en misiones espaciales (Mars Pathfinder).","cite":{"key":"liu","cap":"Cap. 8","sec":"§8.3"},"rel":[81,98,296],"bib":"Liu, J. W. S. (2000). *Real-Time Systems*. Prentice Hall. — Cap. 8, §8.3.","annex":["b1"]},{"id":100,"n":100,"es":"Planificación de CPU","en":"CPU Scheduling","slug":"planificacion-de-cpu","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Función del SO que selecciona, entre los procesos listos, cuál ocupa la CPU y por cuánto tiempo, aplicando políticas (FCFS, SJF, RR, MLFQ, CFS) y objetivos de rendimiento, latencia y equidad. Se implementa en el despachador del kernel con base en prioridades y quanta.","rol":"Rendimiento y equidad: determina la utilización de CPU, los tiempos de retorno, espera y respuesta, y la calidad percibida del sistema.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.1–5.2"},"rel":[3,20,24,55,56,98,101,102,103,107,109,110,112,238],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.1–5.2.","annex":["a1","b1"]},{"id":101,"n":101,"es":"FCFS","en":"First-Come, First-Served","slug":"fcfs","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Algoritmo no expropiativo que atiende los procesos en orden de llegada a la cola de listos, como una cola FIFO. Es simple y libre de inanición, pero sufre el efecto convoy: un proceso largo al frente retrasa a todos los cortos.","rol":"Rendimiento: minimiza la sobrecarga de decisión, pero eleva el tiempo de espera promedio; se usa en sistemas por lotes sencillos.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.3"},"rel":[100,102,103,111,114],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.3.","annex":["a1","a6","b1"]},{"id":102,"n":102,"es":"Round Robin","en":"Round Robin (RR)","slug":"round-robin","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Algoritmo expropiativo que asigna a cada proceso un quantum fijo en orden circular; al agotarse, el proceso vuelve al final de la cola. Un quantum muy pequeño encarece las conmutaciones; uno muy grande degenera en FCFS.","rol":"Equidad y respuesta: ideal para tiempo compartido; garantiza que todos progresen y acota el tiempo de respuesta por proceso.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.3"},"rel":[25,26,100,101,104,105,113,114],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.3.","annex":["a1","b1"]},{"id":103,"n":103,"es":"SJF","en":"Shortest Job First","slug":"sjf","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Política no expropiativa que elige el proceso con menor tiempo de ráfaga (CPU burst) siguiente; es óptima en tiempo de espera promedio pero requiere conocer o estimar la duración y puede producir inanición de los procesos largos.","rol":"Rendimiento: minimiza la espera media; su viabilidad depende de la predicción (media exponencial) del comportamiento futuro.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.3"},"rel":[98,100,101,104,112,114],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.3.","annex":["a1","a6","b1"]},{"id":104,"n":104,"es":"SRTF","en":"Shortest Remaining Time First","slug":"srtf","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Variante expropiativa de SJF que escoge el proceso con menor tiempo restante de CPU, expropiando al actual si aparece uno más corto. Minimiza el tiempo de espera promedio a costa de más cambios de contexto y de inanición potencial.","rol":"Latencia: reduce el tiempo de retorno de trabajos cortos en sistemas interactivos con ráfagas heterogéneas.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.3"},"rel":[102,103,111],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.3.","annex":["a1","a6","b1"]},{"id":105,"n":105,"es":"Colas Multinivel","en":"Multilevel Queue","slug":"colas-multinivel","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Estructura de planificación con varias colas separadas por clase de proceso (sistema, interactivo, lote), cada una con su algoritmo (RR para interactivos, FCFS para lote) y prioridad fija entre colas; sin retroalimentación, una clase puede sufrir inanición.","rol":"Rendimiento: permite políticas diferenciadas por tipo de carga, reflejando el diseño del SO por clases de servicio.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.3"},"rel":[98,102,106],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.3.","annex":["a1","a6","b1"]},{"id":106,"n":106,"es":"MLFQ","en":"Multilevel Feedback Queue","slug":"mlfq","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Planificador adaptativo con varias colas de prioridad: un proceso nuevo entra en la más alta y desciende si consume su quantum sin bloquearse; las colas inferiores tienen quanta mayores. Requiere reglas de ascenso periódico (aging) para evitar inanición y favorece ráfagas cortas e interactivas.","rol":"Rendimiento y adaptación: aprende el comportamiento del proceso sin información previa; es la base conceptual del CFS y de los planificadores modernos.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.3"},"rel":[26,98,105,107,113],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.3.","annex":["a1","a6","b1"]},{"id":107,"n":107,"es":"CFS (Completely Fair Scheduler)","en":"Completely Fair Scheduler","slug":"cfs-completely-fair-scheduler","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Planificador de Linux (2.6.23–6.5) que modela un procesador ideal repartiendo tiempo proporcional al peso (nice) de cada tarea, usando un árbol rojo-negro ordenado por vruntime. Selecciona siempre la tarea de menor vruntime y aplica granularidad mínima y periodos de latencia configurables.","rol":"Equidad y rendimiento: O(log n) por decisión, sin heurísticas de interactividad; base de la planificación por defecto de servidores y escritorios.","cite":{"key":"love","cap":"Cap. 4","sec":"§4.6"},"rel":[100,106,108,110],"bib":"Love, R. (2010). *Linux Kernel Development* (3.ª ed.). Addison-Wesley. — Cap. 4, §4.6.","annex":["a1","b1"]},{"id":108,"n":108,"es":"Afinidad de CPU","en":"CPU Affinity","slug":"afinidad-de-cpu","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Preferencia del planificador por mantener un hilo en el mismo núcleo para conservar la caché caliente y evitar migraciones costosas. Puede ser blanda (sugerencia) o dura (sched_setaffinity/taskset) y convive con el balanceo de carga entre núcleos.","rol":"Rendimiento: reduce fallos de caché y accesos remotos a memoria en arquitecturas NUMA; es esencial en cargas HPC y de baja latencia.","cite":{"key":"love","cap":"Cap. 4","sec":"§4.7"},"rel":[66,67,77,107,109,110,183],"bib":"Love, R. (2010). *Linux Kernel Development* (3.ª ed.). Addison-Wesley. — Cap. 4, §4.7.","annex":["a2","b1","b2"]},{"id":109,"n":109,"es":"P-cores y E-cores","en":"Performance and Efficiency Cores","slug":"p-cores-y-e-cores","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Arquitectura heterogénea (Intel Alder Lake en adelante, ARM big.LITTLE) que combina núcleos de alto rendimiento con núcleos de bajo consumo. El SO debe clasificar la carga y migrarla según la demanda, coordinando el planificador con el hardware (Intel Thread Director, EAS).","rol":"Rendimiento energético: el planificador decide qué tarea merece un núcleo rápido; una mala clasificación produce latencia o consumo excesivo.","cite":{"key":"kernel","cap":"admin-guide","sec":"§cpu-freq"},"rel":[100,108,256],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §cpu-freq.","annex":["b1"]},{"id":110,"n":110,"es":"Rendimiento (Throughput)","en":"Throughput","slug":"rendimiento-throughput","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Número de procesos o trabajos completados por unidad de tiempo. Es una métrica agregada que se maximiza reduciendo la sobrecarga y aumentando la utilización de CPU, en tensión con la latencia y el tiempo de respuesta.","rol":"Métrica de arbitraje: guía políticas de planificación y de E/S; un throughput alto con mala latencia indica políticas orientadas a lote.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.2"},"rel":[67,100,107,108,111,112,113,163,238,248],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.2.","annex":["a1","b1"]},{"id":111,"n":111,"es":"Tiempo de Retorno","en":"Turnaround Time","slug":"tiempo-de-retorno","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Intervalo entre el envío de un proceso y su finalización; incluye esperas en cola, tiempo de CPU, E/S y sobrecarga. Es la métrica principal en sistemas por lotes y se calcula como finalización − llegada.","rol":"Métrica: orienta la elección entre SJF, FCFS y planificadores de lote; su promedio se optimiza con SJF.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.2"},"rel":[101,104,110,112,113,114],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.2.","annex":["a1","b1"]},{"id":112,"n":112,"es":"Tiempo de Espera","en":"Waiting Time","slug":"tiempo-de-espera","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Tiempo total que un proceso permanece en la cola de listos sin ejecutar; se obtiene restando al tiempo de retorno el tiempo de CPU y de E/S efectivos. Depende por completo de la política de planificación.","rol":"Métrica de equidad: mide el coste del arbitraje; su reducción es el objetivo declarado de SJF y SRTF.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.2"},"rel":[100,103,110,111,114],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.2.","annex":["a1","b1"]},{"id":113,"n":113,"es":"Tiempo de Respuesta","en":"Response Time","slug":"tiempo-de-respuesta","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Intervalo entre la llegada de una solicitud y la primera salida o reacción del sistema; métrica dominante en sistemas interactivos y de tiempo real blando. Se controla con quanta pequeños, prioridades y reducción de la sobrecarga.","rol":"Métrica de experiencia de usuario: explica por qué RR y MLFQ priorizan ráfagas cortas frente al rendimiento bruto.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.2"},"rel":[25,26,102,106,110,111,248,249,299],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.2.","annex":["b1"]},{"id":114,"n":114,"es":"Diagrama de Gantt","en":"Gantt Chart","slug":"diagrama-de-gantt","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Representación temporal en la que el eje X es el tiempo y cada barra indica el intervalo en que un proceso ocupó la CPU, permitiendo calcular esperas, retornos y tiempos de respuesta de una traza de planificación.","rol":"Análisis: herramienta de verificación y comparación de algoritmos de planificación sobre cargas sintéticas.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.3"},"rel":[101,102,103,111,112],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.3.","annex":["a1","b1"]},{"id":115,"n":115,"es":"Memoria Física","en":"Physical Memory","slug":"memoria-fisica","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Recursos de almacenamiento reales de la RAM, direccionados por la CPU a través del bus de memoria o, con memoria virtual activa, mediante el mapeo de la MMU. Se organiza en marcos de tamaño fijo administrados por el page allocator (buddy system).","rol":"Control: el SO debe asignar y recuperar marcos, gestionar zonas (DMA, highmem) y mantener el mapeo coherente con las tablas de páginas.","cite":{"key":"bovet","cap":"Cap. 8","sec":"§8.1"},"rel":[116,118,120,122,139],"bib":"Bovet, D. P., & Cesati, M. (2005). *Understanding the Linux Kernel* (3.ª ed.). O'Reilly. — Cap. 8, §8.1.","annex":["a2","c1","b2"]},{"id":116,"n":116,"es":"Memoria Virtual","en":"Virtual Memory","slug":"memoria-virtual","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Técnica que otorga a cada proceso un espacio de direcciones virtuales contiguo e independiente, traducido por hardware a memoria física y respaldado por disco o swap. Permite ejecutar programas mayores que la RAM, aislar procesos e implementar copy-on-write y mmap.","rol":"Abstracción y protección: desacopla la dirección lógica del almacenamiento real; habilita protección por página, compartición y sobreasignación controlada.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.1"},"rel":[115,117,118,120,139],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.1.","annex":["a2","c1","a1"]},{"id":117,"n":117,"es":"Espacio de Direcciones Lógico","en":"Logical Address Space","slug":"espacio-de-direcciones-logico","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Rango de direcciones que un proceso puede generar, definido por su arquitectura (p. ej., 47 bits en x86-64 de usuario) e independiente de la ubicación física. Se compone de segmentos (texto, datos, heap, pila) y regiones mapeadas (VMA en Linux).","rol":"Abstracción: es la vista que el programador y el compilador asumen; el kernel mantiene la correspondencia con marcos físicos mediante tablas de páginas.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.1"},"rel":[27,116,118,119,120,123,166],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.1.","annex":["a2","a1","b1"]},{"id":118,"n":118,"es":"MMU (Memory Management Unit)","en":"Memory Management Unit","slug":"mmu-memory-management-unit","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Unidad de hardware, integrada en la CPU, que traduce direcciones virtuales a físicas consultando las tablas de páginas, aplica permisos (R/W/X, U/S, NX) y genera fallos de página. En x86-64 usa CR3 como base de las tablas y un TLB como caché de traducciones.","rol":"Control y seguridad: hace cumplir el aislamiento entre procesos y las políticas de acceso sin intervención del software en el camino caliente.","cite":{"key":"patt","cap":"Cap. 5","sec":"§5.7"},"rel":[48,49,115,116,117,119,120,123,129,132],"bib":"Patterson, D. A., & Hennessy, J. L. (2014). *Computer Organization and Design: The Hardware/Software Interface* (5.ª ed.). Morgan Kaufmann. — Cap. 5, §5.7.","annex":["a2","c1","a1"]},{"id":119,"n":119,"es":"Registro Base y Límite","en":"Base and Limit Registers","slug":"registro-base-y-limite","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Mecanismo temprano de protección de memoria: la MMU compara cada dirección con un registro base (inicio del segmento) y un límite (tamaño), generando una trampa si se excede. Variante del esquema de reubicación dinámica previo a la paginación.","rol":"Seguridad: impide que un proceso acceda fuera de su partición, sentando el concepto de espacio de direcciones protegido.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.2"},"rel":[117,118,137,165],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.2.","annex":["a1","a2","b1"]},{"id":120,"n":120,"es":"Paginación","en":"Paging","slug":"paginacion","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Esquema de gestión de memoria que divide el espacio virtual en páginas de tamaño fijo (4 KiB típicamente) y la memoria física en marcos del mismo tamaño, eliminando la fragmentación externa. La traducción usa tablas de páginas multinivel y TLB.","rol":"Control y rendimiento: permite asignación no contigua, compartición de páginas y swap; introduce fragmentación interna y coste de traducción.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.3"},"rel":[115,116,117,118,121,122,123,129,134,135,136,137,138],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.3.","annex":["a2","c1","b2"]},{"id":121,"n":121,"es":"Página Virtual","en":"Virtual Page","slug":"pagina-virtual","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Unidad fija del espacio de direcciones virtual (habitualmente 4 KiB; 2 MiB y 1 GiB con huge pages) identificada por el VPN (virtual page number). Cada página se asocia a un marco mediante una PTE o reside en swap si no está presente.","rol":"Abstracción: permite que el SO mueva, comparta, proteja o comprima páginas de forma transparente al programa.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.3"},"rel":[120,122,124,152],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.3.","annex":["a2","c1","b2"]},{"id":122,"n":122,"es":"Marco de Página (Page Frame)","en":"Page Frame","slug":"marco-de-pagina-page-frame","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Bloque de memoria física del mismo tamaño que una página virtual, identificado por su PFN (page frame number) y descrito por una estructura page (Linux). Es la unidad real de asignación del page allocator.","rol":"Control: el kernel administra marcos libres y ocupados, listas de reemplazo y mapeos directos para acceder a ellos en modo kernel.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.3"},"rel":[115,120,121,123],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.3.","annex":["a2","a3","b2"]},{"id":123,"n":123,"es":"Tabla de Páginas","en":"Page Table","slug":"tabla-de-paginas","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Estructura de datos por proceso que contiene las PTEs que asocian páginas virtuales con marcos físicos y sus permisos. En x86-64 es jerárquica de cuatro o cinco niveles; su recorrido (page walk) es costoso y se acelera con el TLB.","rol":"Control: materializa el mapeo y la protección; su base se carga en CR3 en cada cambio de espacio de direcciones.","cite":{"key":"patt","cap":"Cap. 5","sec":"§5.7"},"rel":[117,118,120,122,124,128,129,149,150],"bib":"Patterson, D. A., & Hennessy, J. L. (2014). *Computer Organization and Design: The Hardware/Software Interface* (5.ª ed.). Morgan Kaufmann. — Cap. 5, §5.7.","annex":["a2","c1","a1"]},{"id":124,"n":124,"es":"PTE (Page Table Entry)","en":"Page Table Entry","slug":"pte-page-table-entry","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Entrada de la tabla de páginas que contiene el número de marco físico y bits de control: presente, lectura/escritura, usuario/supervisor, ejecutable (NX), accedida, sucia, caché y CoW. Su tamaño en x86-64 es de 8 bytes.","rol":"Control: es el punto donde el SO aplica permisos y estados de página; su corrupción permite escalada de privilegios.","cite":{"key":"intel","cap":"Cap. 4","sec":"§4.5"},"rel":[121,123,125,126,127,157],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 4, §4.5.","annex":["a2","a1","a3"]},{"id":125,"n":125,"es":"Bit de Presencia (Present Bit)","en":"Present Bit","slug":"bit-de-presencia-present-bit","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Bit de la PTE que indica si la página está en memoria física; si es 0, cualquier acceso genera un fallo de página que el kernel resuelve cargándola desde swap o desde el archivo, o emitiendo SIGSEGV si es inválida.","rol":"Control: es el interruptor de la memoria virtual bajo demanda; distingue páginas válidas ausentes de direcciones ilegales.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.4"},"rel":[124,132,133,139],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.4.","annex":["a2","c1","b2"]},{"id":126,"n":126,"es":"Dirty Bit","en":"Dirty / Modified Bit","slug":"dirty-bit","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Bit de la PTE que el hardware activa cuando se escribe en la página; indica que su contenido difiere del respaldo en disco. El SO lo usa para decidir si debe escribirla antes de reemplazarla.","rol":"Rendimiento de E/S: evita escrituras innecesarias en la sustitución y en msync; es clave en sistemas de archivos journaling y CoW.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.4"},"rel":[124,127,139,146,198],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.4.","annex":["a2","b3","c1"]},{"id":127,"n":127,"es":"Referenced Bit","en":"Referenced / Accessed Bit","slug":"referenced-bit","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Bit que el hardware activa al leer o escribir una página, utilizado por los algoritmos de reemplazo (Reloj, LRU aproximado) y por el mecanismo de envejecimiento. El kernel lo lee y limpia periódicamente.","rol":"Rendimiento: aproxima la localidad de acceso sin coste de instrumentación, habilitando políticas de reemplazo eficientes.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.4"},"rel":[124,126,141,145,146],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.4.","annex":["a2","c1"]},{"id":128,"n":128,"es":"Tabla de Páginas Multinivel","en":"Multilevel Page Table","slug":"tabla-de-paginas-multinivel","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Estructura jerárquica que divide el número de página virtual en índices para varios niveles (PML4 → PDPT → PD → PT en x86-64), permitiendo que las regiones no mapeadas no consuman tablas. Reduce la memoria necesaria a costa de más accesos por traducción.","rol":"Rendimiento: equilibra espacio y latencia; el page walk de cuatro niveles se cachea en el TLB y se puede acelerar con huge pages.","cite":{"key":"intel","cap":"Cap. 4","sec":"§4.5"},"rel":[123,129,130,149,150,151,152],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 4, §4.5.","annex":["a2","b2","c1"]},{"id":129,"n":129,"es":"TLB (Translation Lookaside Buffer)","en":"Translation Lookaside Buffer","slug":"tlb-translation-lookaside-buffer","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Caché asociativa de traducciones virtual→física, con decenas a miles de entradas (L1 TLB y L2 TLB). Se indexa por VPN y etiqueta ASID/PCID; su acierto evita el page walk, y se invalida con INVLPG o al cambiar CR3.","rol":"Rendimiento: la localidad de las traducciones determina el coste de la memoria virtual; sus fallos dominan cargas con muchos accesos aleatorios.","cite":{"key":"patt","cap":"Cap. 5","sec":"§5.7"},"rel":[66,118,120,123,128,130,131,152,222],"bib":"Patterson, D. A., & Hennessy, J. L. (2014). *Computer Organization and Design: The Hardware/Software Interface* (5.ª ed.). Morgan Kaufmann. — Cap. 5, §5.7.","annex":["a2","c1","b2"]},{"id":130,"n":130,"es":"TLB Hit","en":"TLB Hit","slug":"tlb-hit","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Situación en la que la traducción solicitada se encuentra en el TLB, por lo que la MMU obtiene el marco físico en uno o pocos ciclos, sin recorrer la tabla de páginas. Es el caso común gracias a la localidad espacial y temporal.","rol":"Rendimiento: una tasa de acierto alta (típicamente >99 %) es condición para que la memoria virtual sea eficiente.","cite":{"key":"patt","cap":"Cap. 5","sec":"§5.7"},"rel":[128,129,131],"bib":"Patterson, D. A., & Hennessy, J. L. (2014). *Computer Organization and Design: The Hardware/Software Interface* (5.ª ed.). Morgan Kaufmann. — Cap. 5, §5.7.","annex":["a2","a6","b2"]},{"id":131,"n":131,"es":"TLB Miss","en":"TLB Miss","slug":"tlb-miss","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Fallo de traducción que obliga a la MMU a recorrer la tabla de páginas (page walk) y, si el mapeo es válido, a insertar la entrada en el TLB. Si la página no está presente, el fallo se convierte en page fault atendido por el SO.","rol":"Rendimiento: los TLB misses pueden costar decenas de ciclos; se reducen con localidad, huge pages y PCID para evitar invalidaciones globales.","cite":{"key":"patt","cap":"Cap. 5","sec":"§5.7"},"rel":[129,130,132,152],"bib":"Patterson, D. A., & Hennessy, J. L. (2014). *Computer Organization and Design: The Hardware/Software Interface* (5.ª ed.). Morgan Kaufmann. — Cap. 5, §5.7.","annex":["a2","b2","c1"]},{"id":132,"n":132,"es":"Fallo de Página (Page Fault)","en":"Page Fault","slug":"fallo-de-pagina-page-fault","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Excepción generada por la MMU cuando se accede a una página no presente o con permisos insuficientes. El kernel determina si es menor (cargar desde caché o página cero), mayor (leer de disco), de protección (SIGSEGV) o de CoW (copiar la página).","rol":"Control: es el mecanismo central de la memoria virtual bajo demanda; su coste y frecuencia determinan el rendimiento y el thrashing.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.4"},"rel":[13,118,125,131,133,139,140],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.4.","annex":["a2","c1","b2"]},{"id":133,"n":133,"es":"Rutina de Fallo de Página","en":"Page Fault Handler","slug":"rutina-de-fallo-de-pagina","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Rutina del kernel que atiende el page fault: valida la dirección contra las regiones del proceso (VMA), localiza la página en swap, archivo o página cero, asigna un marco, actualiza la PTE, invalida el TLB si procede y reanuda la instrucción causante.","rol":"Control: traduce políticas de memoria en acciones concretas; su eficiencia afecta a la latencia y a la escalabilidad (mmap_lock).","cite":{"key":"bovet","cap":"Cap. 9","sec":"§9.4"},"rel":[125,132,139,165],"bib":"Bovet, D. P., & Cesati, M. (2005). *Understanding the Linux Kernel* (3.ª ed.). O'Reilly. — Cap. 9, §9.4.","annex":["a2","c1","a1"]},{"id":134,"n":134,"es":"Fragmentación Interna","en":"Internal Fragmentation","slug":"fragmentacion-interna","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Desperdicio de espacio dentro de un bloque asignado porque el solicitante no usa todo su tamaño; en paginación, la última página de un segmento suele desperdiciar memoria hasta completar el marco.","rol":"Rendimiento: crece con el tamaño de página; las huge pages la agravan, mientras que páginas pequeñas la reducen pero multiplican las tablas.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.2"},"rel":[120,135,136,152],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.2.","annex":["a2","b2","c1"]},{"id":135,"n":135,"es":"Fragmentación Externa","en":"External Fragmentation","slug":"fragmentacion-externa","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Existencia de suficiente memoria libre total pero no contigua para satisfacer una solicitud, típica de la asignación por segmentos variables. Se mitiga con compactación, paginación o asignadores que agrupan bloques (buddy system).","rol":"Rendimiento: degrada la utilización de memoria y obliga a compactar o a negar asignaciones aunque haya espacio agregado.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.2"},"rel":[120,134,136,137],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.2.","annex":["a2","b2","c1"]},{"id":136,"n":136,"es":"Compactación","en":"Compaction","slug":"compactacion","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Técnica que reubica bloques ocupados para consolidar el espacio libre en un único hueco contiguo, viable solo con reubicación dinámica y traducción de direcciones. Es costosa (requiere mover memoria y actualizar mapeos) y por ello incompatible con paginación pura.","rol":"Rendimiento: reduce la fragmentación externa a cambio de pausas y consumo de CPU; se usa en asignadores de heap y en recolectores de basura.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.2"},"rel":[120,134,135,137],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.2.","annex":["a2","b2","c1"]},{"id":137,"n":137,"es":"Segmentación","en":"Segmentation","slug":"segmentacion","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Esquema que divide el espacio de direcciones en segmentos lógicos de tamaño variable (código, datos, pila) direccionados por par (segmento, desplazamiento), con base, límite y permisos por segmento. Facilita la protección y la compartición lógica, pero sufre fragmentación externa.","rol":"Protección: ofrece granularidad semántica de permisos; x86 conserva segmentación plana en 64 bits por compatibilidad.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.2"},"rel":[119,120,135,136,138],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.2.","annex":["a2","b3","b4"]},{"id":138,"n":138,"es":"Segmentación Paginada","en":"Paged Segmentation","slug":"segmentacion-paginada","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Combinación en la que los segmentos se dividen internamente en páginas, uniendo la protección lógica de la segmentación con la ausencia de fragmentación externa de la paginación. Es el modelo de Multics y del x86 en modo protegido.","rol":"Diseño híbrido: maximiza flexibilidad de protección con gestión física uniforme, al coste de tablas de páginas por segmento.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.2"},"rel":[27,120,137],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.2.","annex":["a2","a3","c1"]},{"id":139,"n":139,"es":"Swap","en":"Swap Space","slug":"swap","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Área de almacenamiento (partición o archivo) donde el kernel descarga páginas anónimas o privadas no usadas, liberando marcos. Se activa bajo presión (kswapd, watermarks) y su latencia es órdenes de magnitud mayor que la RAM; variantes: zram, zswap.","rol":"Control de memoria: evita el OOM al ampliar la memoria efectiva, pero un uso excesivo provoca thrashing y degrada la latencia.","cite":{"key":"bovet","cap":"Cap. 17","sec":"§17.1"},"rel":[92,115,116,125,126,132,133,140,141,153,156,239,272,288],"bib":"Bovet, D. P., & Cesati, M. (2005). *Understanding the Linux Kernel* (3.ª ed.). O'Reilly. — Cap. 17, §17.1.","annex":["b2","c1","a2"]},{"id":140,"n":140,"es":"Hiperpaginado (Thrashing)","en":"Thrashing","slug":"hiperpaginado-thrashing","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Estado patológico en el que el sistema dedica más tiempo a paginar que a ejecutar, porque la suma de working sets supera la memoria disponible. La CPU cae en desuso y el sistema se degrada en espiral; se corrige reduciendo el grado de multiprogramación o usando control de working set.","rol":"Rendimiento: es el fallo de política de memoria más costoso; su detección se basa en la tasa de fallos de página y el uso de swap.","cite":{"key":"ostep","cap":"Cap. 22","sec":"§22.6"},"rel":[98,132,139,141,163],"bib":"Arpaci-Dusseau, R. H., & Arpaci-Dusseau, A. C. (2018). *Operating Systems: Three Easy Pieces* (v1.00). Arpaci-Dusseau Books. — Cap. 22, §22.6.","annex":["b2","c1","a1"]},{"id":141,"n":141,"es":"Working Set","en":"Working Set","slug":"working-set","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Conjunto de páginas que un proceso referencia activamente en una ventana de tiempo Δ; aproxima su localidad y define la memoria mínima para evitar thrashing. El modelo (Denning, 1968) fundamenta el grado de multiprogramación y las políticas de resident set.","rol":"Rendimiento: el SO ajusta el número de procesos residentes comparando la suma de working sets con la memoria física disponible.","cite":{"key":"denning","cap":"Vol. 11","sec":"§2–4"},"rel":[127,139,140,142,145],"bib":"Denning, P. J. (1968). The working set model for program behavior. *Communications of the ACM, 11*(5), 323–333. — Vol. 11, §2–4.","annex":["c1","a1","a2"]},{"id":142,"n":142,"es":"Reemplazo Óptimo (OPT)","en":"Optimal Replacement (OPT/MIN)","slug":"reemplazo-optimo-opt","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Algoritmo teórico que expulsa la página que no se usará durante más tiempo en el futuro; produce el mínimo de fallos posible y sirve como cota de referencia (no implementable sin conocer el futuro).","rol":"Evaluación: patrón contra el que se mide la eficacia de FIFO, LRU, Reloj y LFU en benchmarks de memoria.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.4"},"rel":[141,143,144,145,147,148],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.4.","annex":["a2","b2","c1"]},{"id":143,"n":143,"es":"Reemplazo FIFO","en":"FIFO Page Replacement","slug":"reemplazo-fifo","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Algoritmo que expulsa la página más antigua en memoria según el orden de carga, mediante una cola. Simple y barato, pero ignora la frecuencia de uso y puede sufrir la anomalía de Belady.","rol":"Rendimiento: su baja eficacia en cargas con bucles lo desplazó en la práctica; se usa como base didáctica y en estructuras internas.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.4"},"rel":[142,144,145,146],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.4.","annex":["c1","a1","a2"]},{"id":144,"n":144,"es":"Anomalía de Belady","en":"Belady's Anomaly","slug":"anomalia-de-belady","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Fenómeno por el cual aumentar el número de marcos disponibles incrementa el número de fallos de página con FIFO (y otros algoritmos no basados en pila). Demuestra que la intuición «más memoria, menos fallos» no es universal.","rol":"Análisis: motivó la adopción de algoritmos de pila como LRU y OPT, y el estudio formal de la inclusión de conjuntos residentes.","cite":{"key":"belady","cap":"Vol. 12","sec":"§2–3"},"rel":[142,143,145,147],"bib":"Belady, L. A., Nelson, R. A., & Shedler, G. S. (1969). An anomaly in space-time characteristics of certain programs running in a paging machine. *Communications of the ACM, 12*(6), 349–353. — Vol. 12, §2–3.","annex":["a2","b2","c1"]},{"id":145,"n":145,"es":"LRU","en":"Least Recently Used","slug":"lru","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Política que expulsa la página menos recientemente referenciada, aproximando el comportamiento futuro al pasado con la propiedad de pila. Su implementación exacta exige marcas de tiempo o listas actualizadas en cada acceso, por lo que en la práctica se aproxima con Reloj y bits de referencia.","rol":"Rendimiento: excelente localidad temporal, sin anomalía de Belady; su coste se amortigua con hardware (bits accedidos).","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.4"},"rel":[127,141,142,143,144,146,147,148],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.4.","annex":["c1","a2"]},{"id":146,"n":146,"es":"Algoritmo del Reloj","en":"Clock / Second-Chance Algorithm","slug":"algoritmo-del-reloj","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Aproximación de LRU que recorre circularmente las páginas con un puntero y un bit de referencia: si el bit es 1 se limpia y se da una segunda oportunidad; si es 0, se expulsa. Coste O(1) amortizado y fácil de implementar en hardware.","rol":"Rendimiento: equilibrio práctico entre precisión y coste; variantes mejoradas (enhanced clock) consideran también el dirty bit.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.4"},"rel":[126,127,143,145],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.4.","annex":["c1","a2"]},{"id":147,"n":147,"es":"LFU","en":"Least Frequently Used","slug":"lfu","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Política que expulsa la página con menor contador de referencias, asumiendo que lo usado muchas veces se usará otra vez. Un contador por página registra accesos; sufre el problema del «histórico obsoleto»: páginas que fueron populares permanecen pese a no usarse.","rol":"Rendimiento: adecuada en patrones estables, deficiente ante cambios de fase de la carga; variante con envejecimiento de contadores.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.4"},"rel":[142,144,145,148],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.4.","annex":["a2","c1"]},{"id":148,"n":148,"es":"MFU","en":"Most Frequently Used","slug":"mfu","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Política que expulsa la página con mayor frecuencia de uso, basada en la hipótesis de que las páginas muy usadas ya han cumplido su ciclo local. Contraintuitiva y rara vez óptima; se discute como contraste didáctico frente a LFU.","rol":"Análisis: ilustra que la heurística de frecuencia sola no basta; los algoritmos modernos combinan recencia y frecuencia.","cite":{"key":"silb","cap":"Cap. 9","sec":"§9.4"},"rel":[142,145,147],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 9, §9.4.","annex":["a2","c1"]},{"id":149,"n":149,"es":"Direccionamiento x86_64","en":"x86-64 Addressing","slug":"direccionamiento-x86-64","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Modelo de 64 bits con direcciones virtuales canónicas de 48 bits (o 57 con PML5), cuatro niveles de tablas de páginas, páginas de 4 KiB/2 MiB/1 GiB, registros de 64 bits y segmentación plana. El espacio se divide en mitad inferior (usuario) y superior (kernel).","rol":"Control de memoria: define los límites y el coste de traducción de todo el software de la plataforma; el kernel configura PML4 y CR3 en cada cambio de espacio.","cite":{"key":"intel","cap":"Cap. 3–4","sec":"§4.5"},"rel":[123,128,150,151,152],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 3–4, §4.5.","annex":["a2","b2","b4"]},{"id":150,"n":150,"es":"PML4","en":"Page Map Level 4","slug":"pml4","mod":3,"modName":"Planificación, memoria virtual y sustitución de páginas","def_":"Cuarto nivel de la jerarquía de tablas de páginas en x86-64, con 512 entradas de 8 bytes que cubren 512 GiB cada una y 256 TiB en total. Su dirección física se carga en CR3 al cambiar de proceso.","rol":"Control: es la raíz del mapa de memoria de cada proceso; cambiar CR3 conmuta el espacio de direcciones.","cite":{"key":"intel","cap":"Cap. 4","sec":"§4.5"},"rel":[123,128,149,151],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 4, §4.5.","annex":["a2","a1","b1"]},{"id":151,"n":151,"es":"PML5","en":"Page Map Level 5","slug":"pml5","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Extensión de Intel que añade un quinto nivel (57 bits de dirección virtual, 128 PiB) manteniendo compatibilidad: PML5 en CR3 activa el modo extendido solo cuando el proceso lo requiere.","rol":"Escalabilidad: amplía la memoria direccionable de procesos gigantes con coste adicional de page walk cuando se activa.","cite":{"key":"intel","cap":"Cap. 4","sec":"§4.5"},"rel":[128,149,150],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 4, §4.5.","annex":["a1","a2","a3"]},{"id":152,"n":152,"es":"Huge Pages","en":"Huge Pages / THP","slug":"huge-pages","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Páginas de gran tamaño (2 MiB o 1 GiB en x86-64) que reducen el número de niveles de traducción, la presión sobre el TLB y el número de PTEs. Linux ofrece hugetlbfs explícito y Transparent Huge Pages automáticas (con madvise/always/never).","rol":"Rendimiento: mejoran cargas con grandes huellas de memoria y TLB misses, pero pueden aumentar la fragmentación interna y la latencia de compactación.","cite":{"key":"kernel","cap":"admin-guide","sec":"§vm/hugetlbpage"},"rel":[121,128,129,131,134,149],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §vm/hugetlbpage.","annex":["a2","c1","b2"]},{"id":153,"n":153,"es":"zRAM","en":"zRAM","slug":"zram","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Módulo que crea dispositivos de bloque comprimidos en RAM usados como swap (o como /tmp): las páginas se comprimen con LZ4/ZSTD y se almacenan en memoria, evitando E/S a disco a cambio de CPU.","rol":"Rendimiento: reduce la latencia de swap en sistemas con poca RAM (Android, netbooks) y disminuye el desgaste de almacenamiento flash.","cite":{"key":"kernel","cap":"admin-guide","sec":"§block/zram"},"rel":[139,154,155,156],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §block/zram.","annex":["a2","b2","c1"]},{"id":154,"n":154,"es":"LZ4","en":"LZ4 Compression","slug":"lz4","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Algoritmo de compresión sin pérdidas orientado a velocidad, con descompresión de varios GB/s y ratio moderado. Es el predeterminado de zRAM y se usa en initramfs y en zswap por su bajo coste de CPU.","rol":"Rendimiento: maximiza el throughput de memoria comprimida en detrimento del ratio; el balance es crítico en sistemas con CPU limitada.","cite":{"key":"kernel","cap":"admin-guide","sec":"§zram"},"rel":[153,155,156],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §zram.","annex":["a2","b2","c1"]},{"id":155,"n":155,"es":"ZSTD","en":"Zstandard","slug":"zstd","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Algoritmo de compresión de Facebook (2016) con niveles ajustables: ratios cercanos a gzip/deflate a velocidades mucho mayores y buen rendimiento en descompresión. Usado en zswap, Btrfs, systemd-coredump y contenedores de imagen.","rol":"Rendimiento: permite elegir el compromiso entre CPU y espacio; en zswap suele superar a lzo por ratio con coste similar.","cite":{"key":"kernel","cap":"admin-guide","sec":"§zswap"},"rel":[153,154,156,206],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §zswap.","annex":["a2","a4","b2"]},{"id":156,"n":156,"es":"zswap","en":"zswap","slug":"zswap","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Caché comprimida de swap en RAM que intercepta las páginas a escribir: las comprime y, si el pool se llena, las expulsa al dispositivo de swap real. Reduce la E/S de swap a costa de CPU.","rol":"Rendimiento: amortigua la latencia de swap sin cambiar la semántica; zswap + zram es una configuración común en Linux moderno.","cite":{"key":"kernel","cap":"admin-guide","sec":"§vm/zswap"},"rel":[139,153,154,155],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §vm/zswap.","annex":["a2","b2","c1"]},{"id":157,"n":157,"es":"Bit NX","en":"No-Execute Bit (NX/XD)","slug":"bit-nx","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Bit de la PTE (y de los descriptores de segmento) que marca páginas no ejecutables, impidiendo que datos, pila o heap se usen como código. Requiere EFER.NXE en x86-64 y se complementa con W^X y control de flujo.","rol":"Seguridad: neutraliza gran parte de los exploits de desbordamiento que inyectan shellcode en la pila o el heap.","cite":{"key":"intel","cap":"Cap. 4","sec":"§4.6"},"rel":[124,158,263,264],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 4, §4.6.","annex":["a2","b1","b2"]},{"id":158,"n":158,"es":"ASLR","en":"Address Space Layout Randomization","slug":"aslr","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Técnica que aleatoriza en cada ejecución la base del ejecutable, bibliotecas, heap, pila y (con PIE) el propio código, dificultando la predicción de direcciones en exploits de ROP. Se controla con /proc/sys/kernel/randomize_va_space y se potencia con PIE/RELRO.","rol":"Seguridad: eleva la entropía necesaria para un ataque exitoso; su eficacia depende de la entropía efectiva y de la ausencia de filtraciones de direcciones.","cite":{"key":"csapp","cap":"Cap. 3","sec":"§3.10"},"rel":[61,157,263],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 3, §3.10.","annex":["a2","b3"]},{"id":159,"n":159,"es":"Memory Leak","en":"Memory Leak","slug":"memory-leak","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Fuga de memoria producida cuando un proceso asigna memoria y pierde todas las referencias sin liberarla, incrementando su RSS de forma monotónica hasta provocar OOM o swap. Se detecta con Valgrind, ASan, heaptrack o métricas de /proc/[pid]/status.","rol":"Rendimiento: reduce la memoria disponible y eventualmente activa el OOM killer; en servicios de larga vida es un fallo crítico.","cite":{"key":"csapp","cap":"Cap. 9","sec":"§9.9"},"rel":[65,160,161,162,166,239],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 9, §9.9.","annex":["b2","a1","a2"]},{"id":160,"n":160,"es":"Descriptor Leak","en":"File Descriptor Leak","slug":"descriptor-leak","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Fuga de descriptores de archivo, sockets o pipes que no se cierran; agota el límite RLIMIT_NOFILE y produce errores EMFILE («too many open files») que degradan o detienen el servicio. Se diagnostica con /proc/[pid]/fd y lsof.","rol":"Control de recursos: los descriptores son un recurso finito arbitrado por el kernel; su fuga es una de las causas más comunes de caídas en producción.","cite":{"key":"kerrisk","cap":"Cap. 5","sec":"§5.4"},"rel":[59,159,186,274],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 5, §5.4.","annex":["b2","b1","b3"]},{"id":161,"n":161,"es":"Valgrind","en":"Valgrind","slug":"valgrind","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Marco de instrumentación dinámica que ejecuta binarios en una máquina virtual (memcheck) detectando lecturas de memoria no inicializada, accesos fuera de rango, fugas y errores de heap. Herramientas asociadas: cachegrind, callgrind, helgrind, massif.","rol":"Depuración y rendimiento: revela errores invisibles en pruebas funcionales y perfila cachés, a costa de una desaceleración de 10–50×.","cite":{"key":"csapp","cap":"Cap. 9","sec":"§9.11"},"rel":[159,162,163],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 9, §9.11.","annex":["b2","a2","a4"]},{"id":162,"n":162,"es":"pmap","en":"pmap","slug":"pmap","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Utilidad de procps que muestra el mapa de memoria de un proceso: regiones con permisos, RSS, PSS y tamaño, agrupadas por mapeo (heap, pila, bibliotecas, anónimas). La opción -X ofrece detalles del kernel. Equivalente a leer /proc/[pid]/maps y smaps.","rol":"Diagnóstico: permite localizar fugas y mapeos anómalos sin depurador, y verificar el uso real (PSS) en sistemas con memoria compartida.","cite":{"key":"man7","cap":"Sección 1","sec":"pmap(1)"},"rel":[159,161,163,165,274],"bib":"Kerrisk, M. (Ed.). (2024). *Linux man-pages project* [Manual del programador]. kernel.org. — Sección 1, pmap(1).","annex":["b2","a1","a2"]},{"id":163,"n":163,"es":"vmstat","en":"vmstat","slug":"vmstat","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Herramienta que reporta cada intervalo el estado del sistema: procesos en ejecución y bloqueados, uso de swap, fallos de página, interrupciones, cambios de contexto y uso de CPU (us, sy, id, wa, st).","rol":"Monitorización: primera línea de diagnóstico de presión de memoria, thrashing y sobrecarga de conmutación.","cite":{"key":"bench","cap":"Cap. 6","sec":"§6.4"},"rel":[66,110,140,161,162,274,289],"bib":"Gregg, B. (2013). *Systems Performance: Enterprise and the Cloud*. Prentice Hall. — Cap. 6, §6.4.","annex":["b2","a1","a2"]},{"id":164,"n":164,"es":"brk() / sbrk()","en":"brk() / sbrk()","slug":"brk-sbrk","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Llamadas que ajustan el límite superior del segmento de datos (program break), base del heap tradicional. brk fija la dirección final; sbrk la desplaza en un delta y devuelve la anterior. Solo permiten crecimiento contiguo.","rol":"Gestión de memoria: malloc los usa para extensiones pequeñas; su fragmentación y falta de flexibilidad motivaron mmap para asignaciones grandes.","cite":{"key":"kerrisk","cap":"Cap. 7","sec":"§7.1"},"rel":[65,165,166],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 7, §7.1.","annex":["b2","a2","a5"]},{"id":165,"n":165,"es":"mmap()","en":"mmap()","slug":"mmap","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Llamada que mapea un archivo, dispositivo o región anónima en el espacio de direcciones del proceso, con permisos y flags (MAP_SHARED, MAP_PRIVATE, MAP_ANONYMOUS, MAP_POPULATE). Es la base de la carga de ejecutables, bibliotecas compartidas y memoria compartida.","rol":"Rendimiento: evita copias y permite E/S mapeada en memoria (page cache); MAP_SHARED habilita IPC de baja latencia.","cite":{"key":"kerrisk","cap":"Cap. 49","sec":"§49.1–49.4"},"rel":[52,65,119,133,162,164,166,268,273],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 49, §49.1–49.4.","annex":["b2","a1","a2"]},{"id":166,"n":166,"es":"munmap()","en":"munmap()","slug":"munmap","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Llamada que elimina un mapeo creado con mmap, liberando el rango de direcciones virtuales; si el mapeo era compartido y modificado, la página sucia se sincroniza según la política. No libera memoria de otros mapeos ni afecta al archivo en sí.","rol":"Gestión de recursos: cierra el ciclo de vida de los mapeos; su omisión mantiene regiones reservadas y puede agotar el espacio de direcciones.","cite":{"key":"kerrisk","cap":"Cap. 49","sec":"§49.5"},"rel":[117,159,164,165],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 49, §49.5.","annex":["a2","b2","b3"]},{"id":167,"n":167,"es":"Arquitectura de E/S","en":"I/O Architecture","slug":"arquitectura-de-e-s","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Organización en capas del subsistema de entrada/salida: hardware (dispositivo y controlador), drivers, capa común del kernel (VFS, buffer cache, planificador de E/S) y bibliotecas de usuario. Cada capa traduce una interfaz abstracta en operaciones concretas sobre el dispositivo.","rol":"Abstracción y control: separa políticas de mecanismos y permite drivers uniformes para hardware heterogéneo.","cite":{"key":"stall","cap":"Cap. 11","sec":"§11.1"},"rel":[168,169,170,171,174,186],"bib":"Stallings, W. (2018). *Operating Systems: Internals and Design Principles* (9.ª ed.). Pearson. — Cap. 11, §11.1.","annex":[]},{"id":168,"n":168,"es":"Device Driver","en":"Device Driver","slug":"device-driver","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Módulo de código que conoce el protocolo de un dispositivo y traduce las peticiones genéricas del kernel (read, write, ioctl) en accesos a registros, DMA e interrupciones. Opera en modo kernel (o en espacio de usuario con UIO/FUSE) y registra un conjunto de operaciones en la estructura del bus.","rol":"Control de hardware: aísla la complejidad del dispositivo y ofrece una interfaz uniforme al resto del sistema.","cite":{"key":"ldd","cap":"Cap. 1–2","sec":"§1.2–2.4"},"rel":[5,31,167,169,170,171,172,173],"bib":"Corbet, J., Rubini, A., & Kroah-Hartman, G. (2005). *Linux Device Drivers* (3.ª ed.). O'Reilly. — Cap. 1–2, §1.2–2.4.","annex":["a3"]},{"id":169,"n":169,"es":"Controlador de Hardware","en":"Hardware Controller","slug":"controlador-de-hardware","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Circuito (HBA, controladora SATA/NVMe, GPU, NIC) que gestiona un dispositivo, expone registros de control y estado, y señaliza eventos mediante interrupciones o colas. El driver programa sus registros y comparte búferes mediante DMA.","rol":"Control: es el punto físico donde el SO escribe comandos; su modelo (MMIO, DMA, colas) determina el diseño del driver y el rendimiento.","cite":{"key":"ldd","cap":"Cap. 9","sec":"§9.1–9.3"},"rel":[88,167,168,170,171,172,173,182],"bib":"Corbet, J., Rubini, A., & Kroah-Hartman, G. (2005). *Linux Device Drivers* (3.ª ed.). O'Reilly. — Cap. 9, §9.1–9.3.","annex":["a1","a3","b1"]},{"id":170,"n":170,"es":"Polling","en":"Polling / Programmed I/O","slug":"polling","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Técnica en la que la CPU consulta repetidamente el bit de estado del dispositivo hasta que completa la operación. Simple, pero desperdicia ciclos; puede ser eficiente con esperas muy cortas o en modo híbrido (busy-wait acotado) de controladores de red de baja latencia.","rol":"Rendimiento: elimina el coste de interrupciones a cambio de consumo de CPU; su elección depende de la latencia esperada.","cite":{"key":"stall","cap":"Cap. 11","sec":"§11.2"},"rel":[12,167,168,169,171,172],"bib":"Stallings, W. (2018). *Operating Systems: Internals and Design Principles* (9.ª ed.). Pearson. — Cap. 11, §11.2.","annex":["a1","a3"]},{"id":171,"n":171,"es":"E/S por Interrupciones","en":"Interrupt-Driven I/O","slug":"e-s-por-interrupciones","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Modelo en el que el dispositivo notifica a la CPU mediante una interrupción cuando completa o requiere atención, permitiendo que el procesador ejecute otro trabajo mientras espera. Reduce el sondeo y mejora la utilización, a costa del coste de atención (decenas a cientos de ciclos) y de la gestión de concurrencia en el manejador.","rol":"Rendimiento: base del diseño de E/S moderno, complementado con DMA para transferencias grandes.","cite":{"key":"stall","cap":"Cap. 11","sec":"§11.2"},"rel":[12,14,57,167,168,169,170,172],"bib":"Stallings, W. (2018). *Operating Systems: Internals and Design Principles* (9.ª ed.). Pearson. — Cap. 11, §11.2.","annex":["a3","b5"]},{"id":172,"n":172,"es":"DMA","en":"Direct Memory Access","slug":"dma","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Técnica que permite a un controlador transferir datos entre el dispositivo y la memoria sin intervención de la CPU, que solo programa dirección, longitud y dirección de transferencia, y recibe una interrupción al finalizar. Requiere memoria físicamente contigua o IOMMU para mapear búferes.","rol":"Rendimiento: libera a la CPU de copiar datos y habilita anchos de banda altos; la IOMMU añade aislamiento y protección.","cite":{"key":"ldd","cap":"Cap. 15","sec":"§15.1"},"rel":[168,169,170,171,173,174],"bib":"Corbet, J., Rubini, A., & Kroah-Hartman, G. (2005). *Linux Device Drivers* (3.ª ed.). O'Reilly. — Cap. 15, §15.1.","annex":["a2","a3","b2"]},{"id":173,"n":173,"es":"MMIO","en":"Memory-Mapped I/O","slug":"mmio","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Técnica de acceso a registros de dispositivo mapeándolos en el espacio de direcciones físico/virtual; el driver los lee y escribe con instrucciones normales de memoria (con barreras y atributos no cacheables). Alternativa a los puertos de E/S (PMIO) con espacio limitado en x86.","rol":"Control: simplifica el acceso del driver y permite usar load/store genéricos; exige ordenamiento y coherencia explícitos.","cite":{"key":"ldd","cap":"Cap. 9","sec":"§9.2"},"rel":[168,169,172,174],"bib":"Corbet, J., Rubini, A., & Kroah-Hartman, G. (2005). *Linux Device Drivers* (3.ª ed.). O'Reilly. — Cap. 9, §9.2.","annex":["a2","b2","c1"]},{"id":174,"n":174,"es":"I/O Buffering","en":"I/O Buffering","slug":"i-o-buffering","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Uso de memoria intermedia para desacoplar velocidades entre productor y consumidor de E/S, absorbiendo ráfagas y reduciendo el número de operaciones. Puede residir en el kernel (buffer cache, page cache), en el dispositivo o en bibliotecas (stdio).","rol":"Rendimiento: amortigua la diferencia de velocidades y permite E/S agrupada, a costa de latencia y de memoria adicional.","cite":{"key":"stall","cap":"Cap. 11","sec":"§11.4"},"rel":[23,167,172,173,184],"bib":"Stallings, W. (2018). *Operating Systems: Internals and Design Principles* (9.ª ed.). Pearson. — Cap. 11, §11.4.","annex":["a2","a3","b2"]},{"id":175,"n":175,"es":"Almacenamiento Persistente","en":"Persistent Storage","slug":"almacenamiento-persistente","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Medios y subsistemas que conservan los datos tras el apagado: HDD, SSD, NVMe, cintas y almacenamiento en red. El SO los abstrae mediante dispositivos de bloque y sistemas de archivos, añadiendo cachés, planificación de E/S y garantías de durabilidad.","rol":"Control: el SO debe mantener la integridad (journaling, CoW, barreras de escritura) y ofrecer un compromiso explícito entre durabilidad y rendimiento.","cite":{"key":"silb","cap":"Cap. 11","sec":"§11.1"},"rel":[176,181,184,198,199],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 11, §11.1.","annex":["a1","b1","b3"]},{"id":176,"n":176,"es":"HDD","en":"Hard Disk Drive","slug":"hdd","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Dispositivo electromecánico con platos giratorios y cabezales móviles; el acceso implica posicionamiento del cabezal (seek), espera a que el sector llegue bajo él (latencia rotacional) y transferencia. Su latencia está dominada por la mecánica.","rol":"Rendimiento: el planificador de E/S (SCAN, C-SCAN) reordena peticiones para minimizar el movimiento del cabezal y mejorar el throughput.","cite":{"key":"silb","cap":"Cap. 11","sec":"§11.1"},"rel":[175,177,178,179,180,181],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 11, §11.1.","annex":[]},{"id":177,"n":177,"es":"Seek Time","en":"Seek Time","slug":"seek-time","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Tiempo que tarda el cabezal en desplazarse hasta la pista solicitada; en HDD típicos es de 3 a 10 ms y crece con la distancia entre pistas. Es el componente dominante de la latencia en accesos aleatorios.","rol":"Métrica: guía los algoritmos de planificación de disco y j
