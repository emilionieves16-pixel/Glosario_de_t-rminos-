uestra que Wayland puede sostener flujos de trabajo productivos con bajo overhead y scripting.","cite":{"key":"wayland","cap":"Cap. 6","sec":"§6.2"},"rel":[280,281,283],"bib":"Ser, S. (2021). *The Wayland Protocol*. wayland.freedesktop.org. — Cap. 6, §6.2.","annex":[]},{"id":283,"n":283,"es":"Cage","en":"Cage","slug":"cage","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Compositor Wayland de kiosco que ejecuta una única aplicación a pantalla completa, sin gestor de ventanas ni escritorio; pensado para terminales de información, señalización digital y pruebas de aplicaciones.","rol":"Uso práctico: mínima superficie y arranque determinista para despliegues de un solo propósito.","cite":{"key":"wayland","cap":"Cap. 6","sec":"§6.3"},"rel":[280,281,282],"bib":"Ser, S. (2021). *The Wayland Protocol*. wayland.freedesktop.org. — Cap. 6, §6.3.","annex":["b1"]},{"id":284,"n":284,"es":"Mesa DRI","en":"Mesa DRI","slug":"mesa-dri","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Implementación libre de OpenGL/Vulkan (Mesa) que utiliza el Direct Rendering Infrastructure para que los clientes hablen directamente con la GPU a través del driver, con el gestor (X o compositor) coordinando la presentación.","rol":"Rendimiento: elimina copias por el servidor gráfico y habilita aceleración 3D; su correcta integración con DRM/KMS es crítica.","cite":{"key":"wayland","cap":"Cap. 7","sec":"§7.1"},"rel":[278,279,285,286],"bib":"Ser, S. (2021). *The Wayland Protocol*. wayland.freedesktop.org. — Cap. 7, §7.1.","annex":["a3"]},{"id":285,"n":285,"es":"DRM/KMS","en":"Direct Rendering Manager / Kernel Mode Setting","slug":"drm-kms","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Subsistema del kernel que gestiona la GPU: objetos de memoria (GEM), contextos de ejecución, planos, CRTC, conectores y modos de pantalla. KMS permite al kernel configurar la resolución sin parpadeos y facilita el arranque gráfico temprano.","rol":"Control de hardware: arbitra el acceso a la GPU entre procesos con descriptores (/dev/dri/card0) y aplica permisos por nodo.","cite":{"key":"ldd","cap":"Cap. 19","sec":"§19.2"},"rel":[278,280,284,286,287],"bib":"Corbet, J., Rubini, A., & Kroah-Hartman, G. (2005). *Linux Device Drivers* (3.ª ed.). O'Reilly. — Cap. 19, §19.2.","annex":["a1","a2","a3"]},{"id":286,"n":286,"es":"/dev/dri/renderD128","en":"renderD128 node","slug":"dev-dri-renderd128","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Nodo de dispositivo DRM dedicado al renderizado sin privilegios de modo de pantalla (render node), sobre el que se ejecutan contextos OpenGL/Vulkan y se reparten trabajos de cómputo. Permite a procesos no privilegiados usar la GPU sin controlar la salida.","rol":"Seguridad y rendimiento: separa render de modo (card0), posibilitando contenedores con acceso GPU limitado y colas de trabajo por contexto.","cite":{"key":"ldd","cap":"Cap. 19","sec":"§19.3"},"rel":[225,230,275,284,285],"bib":"Corbet, J., Rubini, A., & Kroah-Hartman, G. (2005). *Linux Device Drivers* (3.ª ed.). O'Reilly. — Cap. 19, §19.3.","annex":["a1","a3","a4"]},{"id":287,"n":287,"es":"ALSA","en":"Advanced Linux Sound Architecture","slug":"alsa","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Subsistema de audio del kernel que expone dispositivos PCM, mezcladores y controles mediante /dev/snd/*, con una biblioteca de usuario (alsa-lib) y servidores de sonido (PulseAudio, PipeWire) que gestionan múltiples clientes y mezcla.","rol":"Control de hardware: abstrae tarjetas y DACs; los servidores de usuario añaden mezcla, latencia configurable y enrutamiento.","cite":{"key":"ldd","cap":"Cap. 18","sec":"§18.1"},"rel":[277,278,285],"bib":"Corbet, J., Rubini, A., & Kroah-Hartman, G. (2005). *Linux Device Drivers* (3.ª ed.). O'Reilly. — Cap. 18, §18.1.","annex":[]},{"id":288,"n":288,"es":"lmkd","en":"Low Memory Killer Daemon","slug":"lmkd","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Demonio de Android que supervisa la presión de memoria mediante PSI y mata procesos en segundo plano según su oom_score_adj para mantener memoria libre y la fluidez del primer plano; sustituye al LMK del kernel.","rol":"Rendimiento y experiencia: preserva la aplicación visible a costa de reciclar otras; su política define la multitarea efectiva del dispositivo.","cite":{"key":"levin","cap":"Vol. 1","sec":"Cap. 6"},"rel":[139,289,291,300],"bib":"Levin, J. (2015). *Android Internals: A Confectioner's Cookbook* (Vol. 1). Technologies. — Vol. 1, Cap. 6.","annex":["a1","a2","b1"]},{"id":289,"n":289,"es":"Métricas PSI","en":"Pressure Stall Information","slug":"metricas-psi","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Mecanismo del kernel Linux (4.20+) que expone en /proc/pressure/{cpu,memory,io} el porcentaje de tiempo en que las tareas están detenidas por falta de un recurso (some/full avg10/60/300). Permite detectar contención real en lugar de estimarla.","rol":"Rendimiento: base de políticas de OOM modernas (systemd-oomd, lmkd), de la detección de cuellos de botella y del control de admisión.","cite":{"key":"kernel","cap":"admin-guide","sec":"§psi"},"rel":[163,237,248,288,300],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §psi.","annex":["b2","b3"]},{"id":290,"n":290,"es":"Waydroid","en":"Waydroid","slug":"waydroid","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Entorno que ejecuta Android (basado en LineageOS/AOSP) en contenedores LXC sobre GNU/Linux usando el kernel del anfitrión, con namespaces, binderfs y un compositor Wayland para integrar las aplicaciones Android en el escritorio.","rol":"Uso práctico: demuestra el aislamiento por contenedores aplicado a Android; depende de binderfs, ashmem/memfd y del subsistema gráfico.","cite":{"key":"kernel","cap":"filesystems","sec":"§binderfs"},"rel":[270,271,280,291,292],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — filesystems, §binderfs.","annex":["a4","b4"]},{"id":291,"n":291,"es":"AOSP","en":"Android Open Source Project","slug":"aosp","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Proyecto de código abierto de Google que publica el sistema Android: kernel Linux (GKI), HAL, bibliotecas nativas (bionic, Binder), ART, framework de Java y aplicaciones del sistema. Cada fabricante lo adapta con sus propias capas.","rol":"Base de plataforma: define la arquitectura en capas de Android y sus interfaces estables (HAL, AIDL) que permiten actualizar el framework sin tocar el kernel.","cite":{"key":"android","cap":"platform","sec":"§Architecture"},"rel":[47,288,290,292,300],"bib":"Android Open Source Project. (2024). *Android platform documentation*. source.android.com. — platform, §Architecture.","annex":[]},{"id":292,"n":292,"es":"Android-x86","en":"Android-x86","slug":"android-x86","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Port de Android a la arquitectura x86/x86-64 para PC, con soporte de arranque UEFI/BIOS, kernels adaptados y controladores gráficos para hardware de escritorio; proyecto comunitario que facilitó probar Android fuera de ARM.","rol":"Uso práctico: demuestra la portabilidad de Android y las dificultades de soportar hardware heterogéneo sin un ecosistema de drivers certificados.","cite":{"key":"android","cap":"porting","sec":"§x86"},"rel":[38,290,291],"bib":"Android Open Source Project. (2024). *Android platform documentation*. source.android.com. — porting, §x86.","annex":[]},{"id":293,"n":293,"es":"WSL2","en":"Windows Subsystem for Linux 2","slug":"wsl2","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Entorno de Microsoft que ejecuta un kernel Linux real en una máquina virtual ligera (Hyper-V, con utilidad de VM) sobre Windows, con integración de sistema de archivos (9p/virtiofs), red NAT y soporte de systemd; WSL1 traducía syscalls en un subsistema.","rol":"Integración: ofrece compatibilidad Linux casi nativa en Windows; el cruce de sistemas de archivos entre ambos mundos es el principal coste de rendimiento.","cite":{"key":"wsl","cap":"Vol. 1","sec":"§1–2"},"rel":[210,215,224,294],"bib":"Microsoft. (2023). *Comparing WSL 1 and WSL 2* [Documentación técnica]. Microsoft Learn. — Vol. 1, §1–2.","annex":["a3","a4","b3"]},{"id":294,"n":294,"es":"XNU","en":"XNU Kernel","slug":"xnu","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Kernel de macOS e iOS que combina Mach (micronúcleo con IPC de puertos y tareas) y BSD (procesos, VFS, red, permisos POSIX) sobre I/O Kit para drivers, con extensiones de seguridad (SIP, sandbox, KEXT restringidos).","rol":"Arquitectura híbrida: muestra cómo un diseño de micronúcleo puede integrar un UNIX completo y drivers orientados a objetos en un solo espacio.","cite":{"key":"xnu","cap":"Cap. 2","sec":"§2.1–2.3"},"rel":[31,33,255,293,295],"bib":"Singh, A. (2006). *Mac OS X Internals: A Systems Approach*. Addison-Wesley. — Cap. 2, §2.1–2.3.","annex":["a1","a3","b1"]},{"id":295,"n":295,"es":"RTOS","en":"Real-Time Operating System","slug":"rtos","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Sistema operativo diseñado para cumplir plazos temporales: planificación determinista (prioridades fijas, RM/EDF), latencias acotadas de interrupción y cambio de contexto, y ausencia de paginación o de operaciones no acotadas en el camino crítico.","rol":"Control de tiempo: garantiza que la respuesta ocurra antes de un instante límite, prioridad sobre throughput; su validación exige análisis de tiempos de peor caso.","cite":{"key":"liu","cap":"Cap. 1–2","sec":"§1.1–2.3"},"rel":[294,296,297,298,299],"bib":"Liu, J. W. S. (2000). *Real-Time Systems*. Prentice Hall. — Cap. 1–2, §1.1–2.3.","annex":["a1","a2","a3"]},{"id":296,"n":296,"es":"Determinismo Temporal","en":"Temporal Determinism","slug":"determinismo-temporal","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Propiedad de un sistema cuyo comportamiento temporal está acotado y es predecible: el peor tiempo de respuesta (WCET) es conocido y verificable. Se opone al mejor esfuerzo de los SO de propósito general, donde la latencia es estadística.","rol":"Métrica de tiempo real: permite certificar sistemas críticos; exige análisis estático de código, control de caché y de interrupciones.","cite":{"key":"liu","cap":"Cap. 2","sec":"§2.1–2.2"},"rel":[35,99,295,297,298,299],"bib":"Liu, J. W. S. (2000). *Real-Time Systems*. Prentice Hall. — Cap. 2, §2.1–2.2.","annex":["a3"]},{"id":297,"n":297,"es":"FreeRTOS","en":"FreeRTOS","slug":"freertos","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"RTOS de código abierto para microcontroladores, con planificador de prioridades fijas expropiativo, colas, semáforos, mutex con herencia de prioridad y temporizadores software. Su pequeño footprint y su portabilidad lo hacen estándar en sistemas embebidos.","rol":"Control: gestiona tareas y plazos con memoria estática o dinámica; su configuración (configMAX_PRIORITIES, tick rate) define el determinismo.","cite":{"key":"barry","cap":"Cap. 1–3","sec":"§1.1–3.4"},"rel":[295,296,298,299],"bib":"Barry, R. (2016). *Mastering the FreeRTOS Real Time Kernel*. Real Time Engineers Ltd. — Cap. 1–3, §1.1–3.4.","annex":["a1","a2","a6"]},{"id":298,"n":298,"es":"Hard Real-Time","en":"Hard Real-Time","slug":"hard-real-time","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Clase de sistemas en la que incumplir un plazo provoca un fallo catastrófico o inaceptable; las garantías deben demostrarse analíticamente antes de la ejecución (aviación, frenos, marcapasos). No admiten degradación probabilística.","rol":"Diseño: exige WCET acotado, recursos reservados y ausencia de bloqueos indefinidos; se apoya en RTOS certificados y particionamiento temporal.","cite":{"key":"liu","cap":"Cap. 1","sec":"§1.2"},"rel":[295,296,297,299],"bib":"Liu, J. W. S. (2000). *Real-Time Systems*. Prentice Hall. — Cap. 1, §1.2.","annex":[]},{"id":299,"n":299,"es":"Soft Real-Time","en":"Soft Real-Time","slug":"soft-real-time","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Clase en la que el incumplimiento de un plazo degrada la calidad de servicio pero no es catastrófico; se toleran incumplimientos estadísticos y se busca minimizar su probabilidad (multimedia, interfaces interactivas).","rol":"Diseño: usa prioridades, reservas de CPU y presupuestos; su validación es probabilística y orientada a percentiles.","cite":{"key":"liu","cap":"Cap. 1","sec":"§1.3"},"rel":[113,295,296,297,298],"bib":"Liu, J. W. S. (2000). *Real-Time Systems*. Prentice Hall. — Cap. 1, §1.3.","annex":["b1"]},{"id":300,"n":300,"es":"Wakelocks","en":"Wakelocks","slug":"wakelocks","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Mecanismo de Android (y de kernels parcheados) que permite a un proceso retener un bloqueo que impide entrar en suspensión, o mantener la pantalla encendida; desde Linux 3.5 se integra con el framework de calidad de suspensión (PM QoS / wakeup sources).","rol":"Control de energía: arbitra el consumo entre aplicaciones que necesitan el sistema activo; los wakelocks mal gestionados causan consumo excesivo (battery drain).","cite":{"key":"levin","cap":"Vol. 1","sec":"Cap. 6"},"rel":[288,289,291],"bib":"Levin, J. (2015). *Android Internals: A Confectioner's Cookbook* (Vol. 1). Technologies. — Vol. 1, Cap. 6.","annex":["a1","b1"]}],"modules":[{"id":1,"name":"Fundamentos, arquitectura del kernel y arranque","count":50},{"id":2,"name":"Procesos, hilos, concurrencia y planificación","count":50},{"id":3,"name":"Planificación, memoria virtual y sustitución de páginas","count":50},{"id":4,"name":"Direccionamiento, E/S y sistemas de archivos","count":50},{"id":5,"name":"Almacenamiento, virtualización y contenedores","count":50},{"id":6,"name":"Seguridad, IPC y sistemas especializados","count":50}],"bib": <script>/* ================================================================
   Glosario Interactivo de Sistemas Operativos — motor de navegación
   ================================================================ */
(function () {
  const D = window.GLOSARIO;
  const T = D.terms, BY_ID = new Map(T.map(t => [t.id, t])), BY_SLUG = new Map(T.map(t => [t.slug, t]));
  const app = document.getElementById('app');
  const qInput = document.getElementById('q');
  const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const MODCOL = id => `var(--m${id})`;
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  const letterOf = t => { const c = norm(t.es)[0]; return /[A-Z]/.test(c) ? c : '#'; };
  const initials = t => norm(t.es);

  /* ---------- índice de búsqueda ---------- */
  T.forEach(t => {
    t._s = norm(`${t.id} ${t.es} ${t.en} ${t.def_} ${t.rol}`).toLowerCase();
    t._h = { es: norm(t.es), en: norm(t.en) };
    t._l = letterOf(t);
  });
  const usedLetters = new Set(T.map(t => t._l));

  /* ---------- utilidades de render ---------- */
  function hl(text, q) {
    let out = esc(text);
    if (!q || q.length < 2) return out;
    const nq = norm(q).toLowerCase();
    const idx = norm(text).toLowerCase().indexOf(nq);
    if (idx < 0) return out;
    const before = esc(text.slice(0, idx)), mid = esc(text.slice(idx, idx + nq.length)), after = esc(text.slice(idx + nq.length));
    return before + '<mark>' + mid + '</mark>' + after;
  }
  const termLink = (id, withId = true) => {
    const t = BY_ID.get(id); if (!t) return '';
    return `<a class="tlink" href="#/term/${t.id}" title="${esc(t.en)}"><b>${String(t.id).padStart(2, '0')}</b>${esc(t.es)}</a>`;
  };
  function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1900);
  }

  /* ---------- vistas ---------- */
  function viewHome() {
    const mods = D.modules.map(m => `
      <article class="mod" style="--m:${MODCOL(m.id)}" onclick="location.hash='#/modulo/${m.id}'">
        <div class="num">Módulo ${m.id}</div><div class="cnt">${m.count} términos</div>
        <h4>${esc(m.name)}</h4>
        <p>${esc(moduleSample(m.id))}</p>
      </article>`).join('');
    app.innerHTML = `
      <section class="hero">
        <span class="kicker">● 2026-2 · Ingeniería en Informática</span>
        <h2>Glosario interactivo de <em>Sistemas Operativos</em></h2>
        <p class="lead">300 conceptos desarrollados con definición formal, rol operativo dentro del SO, cita bibliográfica en APA 7 y
        vinculación directa a los anexos ilustrativos y prácticos. Navegación hipertextual por índice alfabético, índice modular
        y mapa de relaciones.</p>
        <div class="stats">
          <div class="stat"><b>300</b><span>Términos</span></div>
          <div class="stat"><b>6</b><span>Módulos</span></div>
          <div class="stat"><b>64</b><span>Fuentes APA</span></div>
          <div class="stat"><b>12</b><span>Anexos A·B·C</span></div>
        </div>
      </section>
      <div class="sec"><h3>Índice modular</h3><div class="rule"></div><span class="hint">6 módulos · 50 términos cada uno</span></div>
      <div class="mods">${mods}</div>
      <div class="sec"><h3>Cómo navegar</h3><div class="rule"></div></div>
      <div class="mods">
        <article class="mod" style="--m:var(--acc)" onclick="location.hash='#/indice'"><div class="num">Índice A–Z</div>
          <h4>Alfabético e interactivo</h4><p>Filtre por letra o módulo, busque en definiciones y abra cualquier término en un clic.</p></article>
        <article class="mod" style="--m:var(--acc2)" onclick="location.hash='#/anexo/a1'"><div class="num">Anexos</div>
          <h4>Diagramas, trazas y código</h4><p>A. Diagramas y flujogramas · B. Trazas reales de GNU/Linux y código C · C. Mapa de relaciones.</p></article>
        <article class="mod" style="--m:var(--m5)" onclick="location.hash='#/bib'"><div class="num">Fuentes</div>
          <h4>Bibliografía APA 7</h4><p>Cada término cita autor, obra, capítulo y sección; 64 referencias verificables.</p></article>
      </div>
      <div class="sec"><h3>Atajos</h3><div class="rule"></div></div>
      <div class="row" style="color:var(--tx3);font-size:13px;margin-bottom:40px">
        <span class="chip mono">/</span> buscar · <span class="chip mono">j</span><span class="chip mono">k</span> término siguiente/anterior ·
        <span class="chip mono">Esc</span> volver al índice · <span class="chip mono">←</span><span class="chip mono">→</span> navegar entre términos
      </div>`;
  }
  const SAMPLES = {
    1: 'SO como árbitro y máquina extendida; anillos, syscalls y arranque UEFI/GRUB.',
    2: 'PCB, estados, fork/exec/wait, hilos, mutex, deadlock y planificación.',
    3: 'FCFS a CFS, paginación, TLB, page fault, swap, thrashing y reemplazo.',
    4: 'x86-64, zRAM, mmap, E/S, DMA, inodos, journaling y sistemas de archivos.',
    5: 'ext4/ZFS/Btrfs, hipervisores, KVM, contenedores, namespaces y cgroups.',
    6: 'Inmutabilidad, SELinux, seccomp, IPC, Wayland, Android, WSL2 y RTOS.'
  };
  const moduleSample = id => SAMPLES[id] || '';

  function viewIndex(params) {
    const q = (params.q || '').trim();
    let mod = params.mod ? +params.mod : 0;
    let letra = params.letra || '';
    const chips = D.modules.map(m => `<span class="chip ${mod === m.id ? 'on' : ''}" data-mod="${m.id}"
        style="${mod === m.id ? `background:${MODCOL(m.id)};border-color:${MODCOL(m.id)};color:#07101f` : ''}">M${m.id} · ${m.count}</span>`).join('');
    const letters = ['', ...ALPHA, '#'].map(L => {
      const lbl = L === '' ? 'Todo' : L;
      const has = L === '' ? true : usedLetters.has(L);
      return `<span class="chip ${letra === L ? 'on' : ''} ${has ? 'has' : 'off'}" data-letra="${L}">${lbl}</span>`;
    }).join('');
    let list = T.filter(t => (!mod || t.mod === mod) && (!letra || t._l === letra) && (!q || t._s.includes(norm(q).toLowerCase())));
    if (q) {
      list = list.slice().sort((a, b) => {
        const qa = a._h.es === norm(q) ? 0 : a._h.es.startsWith(norm(q)) ? 1 : 2;
        const qb = b._h.es === norm(q) ? 0 : b._h.es.startsWith(norm(q)) ? 1 : 2;
        return qa - qb || a.id - b.id;
      });
    }
    const cards = list.map(t => `
      <article class="tcard" style="--m:${MODCOL(t.mod)}" onclick="location.hash='#/term/${t.id}'">
        <div class="h"><span class="id">${String(t.id).padStart(3, '0')}</span>
          <span class="es">${hl(t.es, q)}</span><span class="en">${hl(t.en, q)}</span>
          <span class="tag">M${t.mod} · ${t._l}</span></div>
        <div class="prev">${hl(t.def_, q)}</div>
      </article>`).join('');
    app.innerHTML = `
      <div class="sec" style="margin-top:34px"><h3>Índice A–Z</h3><div class="rule"></div>
        <span class="hint">${list.length} de 300 términos</span></div>
      <div class="filters">
        <div class="row"><strong style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)">Módulo</strong>${chips}
          <span class="count" id="cnt">${list.length}/300</span></div>
        <div class="row"><strong style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)">Letra</strong>
          <div class="letters">${letters}</div></div>
        ${q ? `<div class="row"><span class="chip on" data-clear="1">Búsqueda: “${esc(q)}” ✕</span></div>` : ''}
      </div>
      <div class="list">${cards || '<p style="color:var(--tx3)">Sin resultados. Pruebe otra letra, módulo o término.</p>'}</div>`;

    app.querySelectorAll('[data-mod]').forEach(el => el.onclick = () => {
      const v = +el.dataset.mod; go(params, { mod: v === mod ? '' : v, letra });
    });
    app.querySelectorAll('[data-letra]').forEach(el => el.onclick = () => go(params, { mod, letra: el.dataset.letra }));
    const cl = app.querySelector('[data-clear]'); if (cl) cl.onclick = () => go(params, { q: '' });
  }
  function go(base, patch) {
    const p = Object.assign({}, base, patch);
    const qs = Object.keys(p).filter(k => p[k] !== '' && p[k] !== undefined && p[k] !== 0)
      .map(k => `${k}=${encodeURIComponent(p[k])}`).join('&');
    location.hash = '#/indice' + (qs ? '?' + qs : '');
  }

  function viewTerm(id) {
    const t = BY_ID.get(id); if (!t) return viewNotFound();
    const rels = t.rel.map(r => termLink(r, false)).join('') || '<span style="color:var(--tx3)">—</span>';
    const annex = (t.annex || []).map(k => {
      const a = D.annex[k];
      return `<a class="tlink" href="#/anexo/${k}"><b>${esc(a.archivo)}</b>${esc(a.titulo)}</a>`;
    }).join('') || '';
    app.innerHTML = `
      <div class="detail">
        <div class="dhead" style="--m:${MODCOL(t.mod)}">
          <div class="meta">
            <span class="pill">Término ${String(t.id).padStart(3, '0')} / 300</span>
            <span class="pill m">Módulo ${t.mod}</span>
            <span class="pill">${esc(t.modName)}</span>
          </div>
          <h2>${esc(t.es)}</h2>
          <p class="en">${esc(t.en)}</p>
        </div>
        <div class="blocks">
          <div class="block def"><h4><span class="n">1</span>Definición formal</h4><p>${esc(t.def_)}</p></div>
          <div class="block"><h4><span class="n">2</span>Rol operativo / utilidad</h4><p>${esc(t.rol)}</p></div>
          <div class="block cite"><h4><span class="n">3</span>Cita bibliográfica (APA 7)</h4><p>${t.bib.replace(/\*(.+?)\*/g, "<em>$1</em>")}</p></div>

          ${annex ? `<div class="block"><h4><span class="n">5</span>Anexos vinculados</h4><div class="tags">${annex}</div></div>` : ''}
        </div>
        <div class="actions">
          <a class="btn primary" href="#/indice">↩ Volver al índice</a>
          <a class="btn" href="#/modulo/${t.mod}">Ver módulo ${t.mod}</a>
          <button class="btn" id="copy">⧉ Copiar cita APA</button>
        </div>
        <div class="navbtns">
          <button class="btn" id="prev">← ${t.id > 1 ? esc(BY_ID.get(t.id - 1).es) : 'Inicio'}</button>

    document.getElementById('copy').onclick = () => {
      const txt = `${t.es} (${t.en}). ${t.bib.replace(/\*/g, '')}`;
      navigator.clipboard && navigator.clipboard.writeText(txt).then(() => toast('Cita copiada al portapapeles'), () => toast('No se pudo copiar'));
    };
    document.getElementById('prev').onclick = () => location.hash = t.id > 1 ? `#/term/${t.id - 1}` : '#/indice';
    document.getElementById('next').onclick = () => location.hash = t.id < 300 ? `#/term/${t.id + 1}` : '#/anexo/a1';

  function viewModule(mid) {
    const m = D.modules.find(x => x.id === mid); if (!m) return viewNotFound();
    const list = T.filter(t => t.mod === mid);
    app.innerHTML = `
      <div class="sec" style="margin-top:34px"><h3>Módulo ${m.id} · ${esc(m.name)}</h3><div class="rule"></div>
        <span class="hint">${m.count} términos</span></div>

      <div class="list">${list.map(t => `

      <div class="actions"><a class="btn primary" href="#/indice">↩ Índice alfabético</a>

  }
  const MDESC = {
    1: 'Del concepto de sistema operativo a los anillos de protección, la arquitectura del núcleo y la cadena de arranque (BIOS/UEFI, bootloader, init).',
    2: 'El proceso como unidad de recursos: PCB, estados, imagen de memoria, fork/exec/wait, hilos, sincronización y condiciones de interbloqueo.',
    3: 'Asignación de CPU y memoria: algoritmos de planificación y métricas, MMU, tablas multinivel, TLB, page fault, swap, working set y thrashing.',
    4: 'Direccionamiento de 64 bits, compresión de memoria, herramientas de diagnóstico, arquitectura de E/S y sistemas de archivos con journaling y CoW.',
    5: 'Almacenamiento en bloque, sistemas de archivos avanzados, virtualización asistida por hardware, hipervisores y contenedores sobre kernel compartido.',
    6: 'Sistemas inmutables y benchmarking, seguridad (DAC/MAC, SELinux, AppArmor, seccomp), IPC, subsistema gráfico, Android, WSL2, XNU y tiempo real.'
  };
  const moduleDesc = id => MDESC[id] || '';

  function viewAnnex(key) {
    key = key || 'a1';
    const a = D.annex[key]; if (!a) return viewNotFound();

      <div class="sec" style="margin-top:34px"><h3>Anexos ilustrativos y prácticos</h3><div class="rule"></div>

  function viewPrint() {

            <span class="es">${esc(t.es)}</span><span class="en">${esc(t.en)}</span>
            <span class="tag">M${t.mod}</span></div>
          <p><b>Definición formal.</b> ${esc(t.def_)}</p>

    app.innerHTML = `<div class="printdoc">
      <div class="pcover">
        <span class="kicker">● 2026-2 · Ingeniería en Informática</span>
        <h1>Glosario de Términos de Sistemas Operativos</h1>
        <p class="sub">300 conceptos · 6 módulos · definición formal, rol operativo y cita bibliográfica APA 7</p>
        <p class="sub">Anexos A (diagramas), B (trazas y código) y C (mapa de relaciones)</p>
        <div class="pmeta">
          <div><b>300</b>Términos desarrollados</div><div><b>6 × 50</b>Módulos balanceados</div>
          <div><b>64</b>Fuentes citadas en APA 7</div><div><b>12</b>Anexos vinculados</div>
        </div>
      </div>
      <h3 style="font-family:var(--serif);font-size:20px;margin:18px 0 8px">Índice alfabético</h3>
      <div class="pidx">${lettersIdx}</div>
      ${mods}
      <div style="page-break-before:always"></div>
      <h2 style="font-family:var(--serif);font-size:26px;margin:26px 0 6px">Anexos ilustrativos y prácticos</h2>
      ${annexes}
      <h2 style="font-family:var(--serif);font-size:24px;margin:26px 0 10px;page-break-before:always">Bibliografía (APA 7)</h2>
      ${Object.keys(D.bib).map(k => `<p style="font-size:12px;color:var(--tx2);margin:0 0 8px">${D.bib[k].replace(/\*(.+?)\*/g, "<em>$1</em>")}</p>`).join('')}
    </div>`;
    window.scrollTo({ top: 0 });
  }

  function viewBib() {
    const keys = Object.keys(D.bib);
    const items = keys.map((k, i) => {
      const n = T.filter(t => t.cite.key === k).length;
      return `<div class="bibitem"><b>${D.bib[k].replace(/\*(.+?)\*/g, '<em>$1</em>')}</b>
        <span><span class="n">${n}</span> término(s) citan esta fuente</span></div>`;
    }).join('');
    app.innerHTML = `
      <div class="sec" style="margin-top:34px"><h3>Bibliografía y fuentes obligatorias</h3><div class="rule"></div>
        <span class="hint">${keys.length} referencias · APA 7.ª edición</span></div>
      <p style="color:var(--tx2);max-width:820px;margin:-6px 0 20px">Todas las definiciones se respaldan con autor, obra, capítulo y
      sección. Se privilegian fuentes primarias y textos de referencia de amplia circulación académica; las citas de manuales y
      especificaciones (Intel SDM, UEFI, NVMe, IEEE POSIX) se presentan como fuentes técnicas primarias.</p>
      <div class="biblist">${items}</div>`;
  }
  function viewNotFound() {
    app.innerHTML = `<div class="detail"><h2 style="font-family:var(--serif)">Recurso no encontrado</h2>
      <p style="color:var(--tx2)">El enlace no corresponde a ningún término, módulo o anexo de este glosario.</p>
      <div class="actions"><a class="btn primary" href="#/indice">Ir al índice A–Z</a></div></div>`;
  }

  /* ---------- router ---------- */
  function route() {
    const h = location.hash.replace(/^#\/?/, '');
    const [path, qs] = h.split('?');
    const params = {};
    (qs || '').split('&').filter(Boolean).forEach(kv => { const [k, v] = kv.split('='); params[k] = decodeURIComponent(v || ''); });
    const seg = path.split('/').filter(Boolean);
    document.querySelectorAll('nav.tabs a').forEach(a => a.classList.remove('on'));
    const on = sel => { const el = document.querySelector(`nav.tabs a[data-nav="${sel}"]`); if (el) el.classList.add('on'); };
    if (seg[0] === 'term') { qInput.value = ''; on('indice'); return viewTerm(+seg[1]); }
    if (seg[0] === 'modulo') { on('indice'); return viewModule(+seg[1]); }
    if (seg[0] === 'indice') { qInput.value = params.q || ''; on('indice'); return viewIndex(params); }
    if (seg[0] === 'anexo') { on('anexos'); return viewAnnex(seg[1]); }
    if (seg[0] === 'anexos') { on('anexos'); return viewAnnex('a1'); }
    if (seg[0] === 'bib') { on('bib'); return viewBib(); }
    if (seg[0] === 'print') { on('print'); return viewPrint(); }
    on('inicio'); viewHome();
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('DOMContentLoaded', route);
  if (document.readyState !== 'loading') route();

  /* ---------- búsqueda global ---------- */
  qInput.addEventListener('input', () => {
    const v = qInput.value.trim();
    if (v.length === 0) return;
    clearTimeout(qInput._t);
    qInput._t = setTimeout(() => { location.hash = '#/indice?q=' + encodeURIComponent(v); }, 260);
  });
  qInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { location.hash = '#/indice?q=' + encodeURIComponent(qInput.value.trim()); }
    if (e.key === 'Escape') { qInput.value = ''; location.hash = '#/indice'; qInput.blur(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
    if (e.key === '/') { e.preventDefault(); qInput.focus(); qInput.select(); }
    if (e.key === 'Escape') location.hash = '#/indice';
    const m = location.hash.match(/^#\/term\/(\d+)/);
    if (m) {
      const id = +m[1];
      if (e.key === 'j' && id < 300) location.hash = `#/term/${id + 1}`;
      if (e.key === 'k' && id > 1) location.hash = `#/term/${id - 1}`;
      if (e.key === 'ArrowRight' && id < 300) location.hash = `#/term/${id + 1}`;
      if (e.key === 'ArrowLeft' && id > 1) location.hash = `#/term/${id - 1}`;
    }
  });

  /* ---------- tema ---------- */
  const themeBtn = document.getElementById('theme');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* iframe sin origen: se ignora */ } }
  };
  const savedTheme = store.get('glosario-theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  themeBtn.onclick = () => {
    const cur = document.documentElement.dataset.theme === 'light' ? '' : 'light';
    if (cur) document.documentElement.dataset.theme = cur; else delete document.documentElement.dataset.theme;
    store.set('glosario-theme', cur);
  };

  /* ---------- Anexo C: grafo de fuerzas ---------- */
  function initGraph() {
    const cv = document.getElementById('graph'); if (!cv) return;
    const ctx = cv.getContext('2d');
    const core = D.annex.c1.terms.slice();
    const set = new Set(core);
    core.forEach(id => BY_ID.get(id).rel.forEach(r => set.add(r)));
    const nodes = [...set].slice(0, 62).map(id => {
      const t = BY_ID.get(id);
      return { id, t, x: 0, y: 0, vx: 0, vy: 0, r: 4.5 + Math.min(7, t.rel.length * 0.55), show: core.includes(id) };
    });
    const idx = new Map(nodes.map(n => [n.id, n]));
    const links = [];
    nodes.forEach(n => n.t.rel.forEach(r => { if (idx.has(r) && n.id < r) links.push([n, idx.get(r)]); }));
    const W = () => cv.clientWidth, H = () => cv.clientHeight;
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      cv.width = W() * dpr; cv.height = H() * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    nodes.forEach((n, i) => {
      const a = (i / nodes.length) * Math.PI * 2 + (i % 3) * 0.13;
      const rad = Math.min(W(), H()) * (0.24 + (i % 4) * 0.05);
      n.x = W() / 2 + Math.cos(a) * rad;
      n.y = H() / 2 + Math.sin(a) * rad;
    });
    let hover = null, drag = null;
    const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const mcol = id => css(`--m${id}`);
    const short = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
    function step() {
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || 1;
          if (d2 < 60000) {
            const f = 3000 / d2, d = Math.sqrt(d2);
            const fx = dx / d * f, fy = dy / d * f;
            a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
          }
        }
      }
      links.forEach(([a, b]) => {
        let dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
        const f = (d - 118) * 0.0055;
        const fx = dx / d * f, fy = dy / d * f;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
      });
      const cx = W() / 2, cy = H() / 2;
      nodes.forEach(n => {
        n.vx += (cx - n.x) * 0.0016; n.vy += (cy - n.y) * 0.0024;
        n.vx *= 0.84; n.vy *= 0.84;
        if (n !== drag) { n.x += n.vx; n.y += n.vy; }
        n.x = Math.max(n.r + 54, Math.min(W() - n.r - 54, n.x));
        n.y = Math.max(n.r + 16, Math.min(H() - n.r - 16, n.y));
      });
    }
    function draw() {
      ctx.clearRect(0, 0, W(), H());
      links.forEach(([a, b]) => {
        const active = hover && (hover === a || hover === b);
        ctx.strokeStyle = active ? 'rgba(255,194,71,.9)' : 'rgba(140,170,220,.16)';
        ctx.lineWidth = active ? 1.6 : 1;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      });
      nodes.forEach(n => {
        const c = mcol(n.t.mod) || '#888';
        const isH = hover === n;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + (isH ? 3.5 : 0), 0, 7);
        ctx.fillStyle = c; ctx.globalAlpha = isH ? 1 : .9; ctx.fill(); ctx.globalAlpha = 1;
        if (isH) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.stroke(); }
      });
      /* etiquetas con evitación de colisiones: primero los nodos con más conexiones */
      const boxes = [];
      const order = nodes.slice().sort((a, b) => (b === hover) - (a === hover) || b.t.rel.length - a.t.rel.length);
      order.forEach(n => {
        const isH = hover === n;
        if (!isH && !(n.show && n.t.rel.length >= 4)) return;
        const txt = short(n.t.es, isH ? 32 : 20);
        ctx.font = (isH ? '600 12px' : '10.5px') + ' ui-sans-serif,system-ui,sans-serif';
        const w = ctx.measureText(txt).width;
        const bx = n.x - w / 2, by = n.y - n.r - 15, bw = w, bh = 13;
        if (!isH && boxes.some(o => bx < o.x + o.w && bx + bw > o.x && by < o.y + o.h && by + bh > o.y)) return;
        boxes.push({ x: bx, y: by, w: bw, h: bh });
        ctx.textAlign = 'center';
        ctx.fillStyle = isH ? css('--tx') : css('--tx3');
        ctx.fillText(txt, n.x, n.y - n.r - 5);
      });
    }
    for (let i = 0; i < 260; i++) step();   /* precalentado: el grafo aparece ya estabilizado */
    function loop() { if (!document.body.contains(cv)) return; step(); draw(); requestAnimationFrame(loop); }
    loop();
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    cv.onmousemove = e => {
      const p = pos(e);
      if (drag) { drag.x = p.x; drag.y = p.y; drag.vx = drag.vy = 0; }
      hover = drag || nodes.find(n => Math.hypot(n.x - p.x, n.y - p.y) < n.r + 7) || null;
      cv.style.cursor = hover ? 'pointer' : 'grab';
    };
    cv.onmousedown = e => { const p = pos(e); drag = nodes.find(n => Math.hypot(n.x - p.x, n.y - p.y) < n.r + 7) || null; if (drag) cv.style.cursor = 'grabbing'; };
    window.addEventListener('mouseup', () => { drag = null; });
    cv.onclick = e => {
      const p = pos(e);
      const n = hover || nodes.find(v => Math.hypot(v.x - p.x, v.y - p.y) < v.r + 10);
      if (n) location.hash = '#/term/' + n.id;
    };
    window.addEventListener('resize', resize);
  }
})();
