<style>/* ============ Glosario Interactivo de Sistemas Operativos · 2026-2 ============ */
:root{
  --bg:#070b16; --bg2:#0b1122; --panel:#101a30; --panel2:#0d1526;
  --line:rgba(148,178,255,.14); --line2:rgba(148,178,255,.26);
  --tx:#e8eefc; --tx2:#a9b8d6; --tx3:#7d8bab;
  --acc:#ffc247; --acc2:#5eead4;
  --m1:#7dd3fc; --m2:#a78bfa; --m3:#34d399; --m4:#fbbf24; --m5:#f472b6; --m6:#22d3ee;
  --radius:16px; --maxw:1180px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
}
[data-theme="light"]{
  --bg:#f6f7fb; --bg2:#eef1f8; --panel:#ffffff; --panel2:#f7f9fe;
  --line:rgba(16,32,64,.12); --line2:rgba(16,32,64,.22);
  --tx:#101a30; --tx2:#41506e; --tx3:#6b7a99;
  --acc:#a86b00; --acc2:#0d7a6b;
  --m1:#0b6fa4; --m2:#5b3fbf; --m3:#0b7a55; --m4:#9a6400; --m5:#a5246a; --m6:#0b6d80;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.6;
  background:
    radial-gradient(1100px 600px at 12% -10%,rgba(94,234,212,.10),transparent 60%),
    radial-gradient(900px 500px at 92% 0%,rgba(255,194,71,.09),transparent 55%),
    linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));
  background-attachment:fixed; min-height:100vh;
}
a{color:inherit;text-decoration:none}
::selection{background:rgba(255,194,71,.35)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
.mono{font-family:var(--mono)}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:18px;padding:12px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(255,194,71,.22),rgba(94,234,212,.18));
  border:1px solid var(--line2);box-shadow:0 0 30px rgba(255,194,71,.12) inset}
.logo svg{width:22px;height:22px}
.brand h1{font-size:15px;margin:0;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--tx3);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;padding:11px 40px 11px 40px;border-radius:12px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--tx);font-size:14px;outline:none;transition:.18s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,194,71,.14)}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx3);width:16px;height:16px}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);
  font-size:11px;color:var(--tx3);border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--tx2);display:grid;place-items:center;cursor:pointer;transition:.18s;flex:0 0 auto}
.iconbtn:hover{color:var(--tx);border-color:var(--acc);transform:translateY(-1px)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--tx2);white-space:nowrap;
  border:1px solid transparent;transition:.16s;cursor:pointer}
nav.tabs a:hover{color:var(--tx);background:var(--panel)}
nav.tabs a.on{color:#101a30;background:linear-gradient(180deg,#ffd479,var(--acc));font-weight:650;border-color:transparent}
[data-theme="light"] nav.tabs a.on{color:#fff}

/* ---------- Hero ---------- */
.hero{padding:46px 0 26px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--acc2);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;margin-bottom:16px}
.hero h2{font-family:var(--serif);font-size:clamp(30px,4.4vw,52px);line-height:1.08;margin:0 0 14px;font-weight:600;letter-spacing:-.5px}
.hero h2 em{font-style:normal;color:var(--acc)}
.hero p.lead{color:var(--tx2);max-width:760px;font-size:17px;margin:0 0 26px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:820px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--mono);font-size:24px;color:var(--acc);letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}

/* ---------- Section titles ---------- */
.sec{margin:44px 0 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sec h3{font-family:var(--serif);font-size:26px;margin:0;font-weight:600}
.sec .hint{color:var(--tx3);font-size:13px}
.rule{height:1px;background:linear-gradient(90deg,var(--line2),transparent);flex:1;min-width:40px}

/* ---------- Module cards ---------- */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.mod{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:var(--radius);padding:18px;cursor:pointer;transition:.2s;overflow:hidden}
.mod:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--m)}
.mod:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.mod .num{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--m);text-transform:uppercase}
.mod h4{margin:8px 0 6px;font-size:16.5px;line-height:1.3}
.mod p{margin:0;color:var(--tx3);font-size:13px}
.mod .cnt{position:absolute;top:16px;right:18px;font-family:var(--mono);font-size:12px;color:var(--tx3)}

/* ---------- Filters ---------- */
.filters{position:sticky;top:104px;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px;margin:22px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:9px}
.chip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);
  background:var(--panel2);cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{color:var(--tx);border-color:var(--acc)}
.chip.on{background:var(--acc);color:#101a30;border-color:var(--acc);font-weight:650}
[data-theme="light"] .chip.on{color:#fff}
.letters{display:flex;flex-wrap:wrap;gap:4px}
.letters .chip{padding:4px 9px;font-family:var(--mono);font-size:12px;min-width:30px;text-align:center}
.letters .chip.off{opacity:.28;pointer-events:none}
.letters .chip.has{border-color:var(--line2)}
.count{color:var(--tx3);font-size:12.5px;margin-left:auto;font-family:var(--mono)}

/* ---------- Term cards ---------- */
.list{display:grid;gap:10px;margin:8px 0 60px}
.tcard{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:14px;padding:15px 17px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.tcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--m);opacity:.9}
.tcard:hover{border-color:var(--line2);transform:translateX(3px);background:var(--panel)}
.tcard .h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tcard .id{font-family:var(--mono);font-size:11.5px;color:var(--tx3);min-width:30px}
.tcard .es{font-weight:650;font-size:15.5px}
.tcard .en{color:var(--tx3);font-size:12.5px;font-style:italic}
.tcard .tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--m);letter-spacing:.1em}
.tcard .prev{color:var(--tx2);font-size:13px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
mark{background:rgba(255,194,71,.28);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- Term detail ---------- */
.detail{margin:26px 0 70px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dhead{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line2);
  border-radius:20px;padding:26px 28px;position:relative;overflow:hidden}
.dhead:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,var(--m),transparent 70%);opacity:.16}
.dhead .meta{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;
  border-radius:999px;border:1px solid var(--line2);color:var(--tx3)}
.pill.m{color:var(--m);border-color:color-mix(in srgb,var(--m) 45%,transparent)}
.dhead h2{font-family:var(--serif);font-size:clamp(26px,3.6vw,40px);margin:0 0 4px;line-height:1.12;letter-spacing:-.4px}
.dhead .en{color:var(--acc);font-size:15px;font-style:italic;margin-bottom:0}
.blocks{display:grid;gap:14px;margin-top:16px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;position:relative}
.block h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);
  display:flex;align-items:center;gap:9px}
.block h4 .n{font-family:var(--mono);color:var(--tx3);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;font-size:10px}
.block p{margin:0;font-size:15.5px;line-height:1.72}
.block.def p{font-family:var(--serif);font-size:17px;line-height:1.68;color:var(--tx)}
.block.cite p{font-size:13.5px;color:var(--tx2);letter-spacing:.1px}
.block.cite em{color:var(--tx)}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tlink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--line2);color:var(--tx2);background:var(--panel2);cursor:pointer;transition:.15s}
.tlink:hover{border-color:var(--acc);color:var(--tx);transform:translateY(-1px)}
.tlink b{font-family:var(--mono);font-size:10.5px;color:var(--tx3);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;font-size:13px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--tx);cursor:pointer;transition:.16s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,#ffd479,var(--acc));color:#101a30;border-color:transparent;font-weight:650}
[data-theme="light"] .btn.primary{color:#fff}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.navbtns .btn{flex:1;justify-content:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--panel);
  border:1px solid var(--acc);color:var(--tx);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;
  pointer-events:none;transition:.25s;z-index:200;box-shadow:0 20px 50px -20px #000}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Anexos ---------- */
.annex-nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 26px}
.annex-nav .chip.on{background:var(--acc2);color:#08221f}
.annex{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:22px}
.annex h3{font-family:var(--serif);font-size:24px;margin:0 0 6px}
.annex .sub{color:var(--tx3);font-size:13.5px;margin:0 0 18px}
.annex h5{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:22px 0 10px}
.figure{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:auto}
.figure svg{display:block;width:100%;height:auto;min-width:520px}
figcaption{color:var(--tx3);font-size:12.5px;margin-top:10px;padding-left:2px}
pre{background:#050a14;border:1px solid var(--line2);border-radius:12px;padding:16px;overflow:auto;
  font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#c8d6f2;margin:0 0 14px;position:relative}
[data-theme="light"] pre{background:#0f1729;color:#d6e2fb}
pre .c{color:#5b7397}pre .p{color:#5eead4}pre .o{color:#ffc247}pre .e{color:#f472b6}pre .k{color:#a78bfa}
pre .fname{position:absolute;top:0;right:0;font-size:10.5px;letter-spacing:.1em;color:var(--tx3);
  background:var(--panel2);border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);
  padding:3px 9px;border-radius:0 12px 0 10px}
.code-note{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--acc) 8%,transparent);
  border-left:3px solid var(--acc);border-radius:0 10px 10px 0;padding:11px 14px;font-size:13.5px;color:var(--tx2);margin:0 0 14px}
.graphwrap{position:relative;background:radial-gradient(circle at 50% 40%,rgba(94,234,212,.07),transparent 60%),var(--panel2);
  border:1px solid var(--line);border-radius:16px;overflow:hidden}
#graph{display:block;width:100%;height:560px;cursor:grab}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* ---------- Bibliografía ---------- */
.biblist{display:grid;gap:10px;margin-bottom:60px}
.bibitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;
  font-size:13.5px;color:var(--tx2);display:grid;gap:3px}
.bibitem b{color:var(--tx);font-weight:600}
.bibitem .n{font-family:var(--mono);font-size:11px;color:var(--acc)}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--tx3);font-size:12.5px}
footer .row{justify-content:space-between}

/* ---------- Responsive ---------- */
@media(max-width:820px){
  .brand small{display:none}
  .search{max-width:none}
  .filters{top:96px}
  .dhead{padding:20px}
  .block{padding:16px}
  .figure svg{min-width:420px}
}
@media(max-width:560px){
  .hero{padding:28px 0 10px}
  .brand{display:none}
  .topbar{gap:10px}
  .search{flex:1}
  .search input{padding-left:36px;font-size:12.5px}
  .search input::placeholder{font-size:12.5px}
  .search kbd{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  #graph{height:420px}
}


/* ---------- Versión imprimible / PDF ---------- */
.printdoc{max-width:900px;margin:0 auto}
.pcover{padding:40px 0 26px;border-bottom:2px solid var(--line2);margin-bottom:24px}
.pcover h1{font-family:var(--serif);font-size:38px;margin:0 0 8px;letter-spacing:-.5px}
.pcover .sub{color:var(--tx2);font-size:14.5px;margin:0 0 4px}
.pmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:18px}
.pmeta div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--tx2)}
.pmeta b{display:block;color:var(--tx);font-size:13px}
.pidx{columns:3;column-gap:22px;font-size:12px;color:var(--tx2);margin:10px 0 26px}
.pidx a{display:block;padding:2px 0;border-bottom:1px dotted var(--line);break-inside:avoid}
.pmod{page-break-before:always;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.pmod h3{font-family:var(--serif);font-size:22px;margin:0}
.pterm{break-inside:avoid;page-break-inside:avoid;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin:0 0 10px;background:var(--panel)}
.pterm .ph{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pterm .ph .id{font-family:var(--mono);font-size:11px;color:var(--tx3)}
.pterm .ph .es{font-weight:650;font-size:14px}
.pterm .ph .en{font-size:11.5px;color:var(--tx3);font-style:italic}
.pterm .ph .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--m)}
.pterm p{margin:0 0 5px;font-size:12px;line-height:1.55;color:var(--tx2)}
.pterm p b{color:var(--tx)}
.pterm .cite{font-size:11px;color:var(--tx3)}
@media print{
  :root{
    --bg:#fff;--bg2:#fff;--panel:#fff;--panel2:#f5f7fc;
    --line:#d3dbea;--line2:#b9c4da;
    --tx:#101c33;--tx2:#33415c;--tx3:#5a6a88;
    --acc:#8a5a00;--acc2:#0a6b5e;
    --m1:#0b6fa4;--m2:#5b3fbf;--m3:#0a7a55;--m4:#8a5a00;--m5:#a5246a;--m6:#0b6d80;
  }
  body{background:#fff !important;color:#101c33}
  header.top,nav.tabs,footer,.actions,.navbtns,.filters,.toast,.graphwrap{display:none!important}
  .printdoc{max-width:none}
  .pterm, .figure, pre{break-inside:avoid;page-break-inside:avoid}
  pre{background:#f4f6fb !important;color:#12203a !important;border-color:#c9d3e6}
  .pcover{padding-top:0}
}
</style>
</head>

<template id="tpl-a1">
  <div class="annex">
    <h3>A.1 · Diagrama de transición de estados del proceso</h3>
    <p class="sub">Cinco estados clásicos del modelo de procesos (Silberschatz et al., 2018, §3.2). Cada arista representa un evento del
    núcleo: admisión, despacho, expropiación, espera y terminación.</p>

<template id="tpl-b1">
  <div class="annex">
    <h3>B.1 · Trazas de terminal: procesos, hilos y señales</h3>
    <p class="sub">Comandos ejecutados en GNU/Linux (kernel 6.x, procps-ng 4.x). La salida se muestra abreviada; los comentarios
    explican qué demuestra cada invocación.</p>
    <h5>Jerarquía, estados y zombis</h5>
    <pre><span class="fname">bash</span><span class="p">$</span> ps -eo pid,ppid,stat,pri,ni,comm --sort=pid | head -6
    PID    PPID STAT PRI  NI COMMAND
      1       0 Ss    19   0 systemd
    412       1 Ss    19   0 systemd-journal
    903     412 S     19   0 sshd
   1450       1 Ss    19   0 cron
   2210    1449 Ss    19   0 bash
<span class="c"># STAT: R=ejecutando  S=dormido  D=espera no interrumpible  Z=zombi  T=detenido</span>

<span class="p">$</span> ./forkdemo &amp;
[1] 3214
<span class="p">$</span> pstree -p 2210
bash(2210)─┬─forkdemo(3214)─┬─forkdemo(3215)
           │                └─forkdemo(3216)

<span class="p">$</span> grep -E '^(Name|State|PPid|Threads)' /proc/3215/status
Name:   forkdemo
State:  S (sleeping)
PPid:   3214
Threads:        1

<span class="c"># El padre termina sin wait(): el hijo queda como zombi</span>
<span class="p">$</span> ps -o pid,ppid,stat,comm -p $(pgrep -P 3214)
    PID    PPID STAT COMMAND
   3311    3214 Z    forkdemo
<span class="p">$</span> kill -TERM 3311      <span class="c"># sin efecto: el proceso ya terminó</span>
<span class="p">$</span> cat /proc/3311/wchan
zombie

<span class="p">$</span> cat /proc/3214/task/*/comm   <span class="c"># un directorio por hilo (TID)</span>
forkdemo
forkdemo
forkdemo

<span class="p">$</span> top -H -p 3214             <span class="c"># -H muestra una línea por hilo</span>
<span class="p">$</span> kill -SIGSTOP 3214; sleep 1; ps -o stat= -p 3214
T
<span class="p">$</span> kill -SIGCONT 3214</pre>
    <div class="code-note"><span>▸</span><span><b>Qué demuestra:</b> el estado del proceso es un campo del PCB consultable en
    <span class="mono">/proc/[pid]/status</span>; el zombi conserva el PCB porque el padre no ha ejecutado <span class="mono">waitpid()</span>

   3455  10  30  TS compilacion

    <h5>Namespaces</h5>

<template id="tpl-b5">
  <div class="annex">
    <h3>B.5 · Código C de ejemplo: fork, pthreads, mutex y semáforos</h3>
    <p class="sub">Tres programas mínimos y compilables que ejercitan las primitivas descritas en el Módulo 2. Compilación:
    <span class="mono">gcc -O2 -Wall -pthread archivo.c -o programa</span>.</p>
    <h5>1 · fork() + waitpid(): creación y recolección</h5>
    <pre><span class="fname">fork_demo.c</span>#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
#include &lt;unistd.h&gt;
#include &lt;sys/wait.h&gt;

int main(void) {
    pid_t pid = fork();                 <span class="c">/* duplica el proceso */</span>
    if (pid &lt; 0) { perror("fork"); return 1; }

    if (pid == 0) {                     <span class="c">/* hijo: fork() devuelve 0 */</span>
        printf("hijo  PID=%d  PPID=%d\n", getpid(), getppid());
        _exit(42);                      <span class="c">/* _exit: no vacía búferes */</span>
    }

    int status;                         <span class="c">/* padre: fork() devuelve el PID */</span>
    if (waitpid(pid, &amp;status, 0) == -1) { perror("waitpid"); return 1; }
    if (WIFEXITED(status))
        printf("padre: hijo %d terminó con %d\n", pid, WEXITSTATUS(status));
    return 0;
}
<span class="c">/* Salida esperada:
   hijo  PID=3215  PPID=3214
   padre: hijo 3215 terminó con 42        */</span></pre>
    <h5>2 · pthreads con mutex: exclusión mutua</h5>
    <pre><span class="fname">mutex_demo.c</span>#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;

#define N 4
#define ITER 1000000
long contador = 0;                      <span class="c">/* recurso compartido */</span>
pthread_mutex_t m = PTHREAD_MUTEX_INITIALIZER;

void *trabajo(void *arg) {
    for (long i = 0; i &lt; ITER; i++) {
        pthread_mutex_lock(&amp;m);         <span class="c">/* sección crítica */</span>
        contador++;
        pthread_mutex_unlock(&amp;m);
    }
    return NULL;
}

int main(void) {
    pthread_t h[N];
    for (int i = 0; i &lt; N; i++) pthread_create(&amp;h[i], NULL, trabajo, NULL);
    for (int i = 0; i &lt; N; i++) pthread_join(h[i], NULL);
    printf("contador = %ld (esperado %d)\n", contador, N * ITER);
    pthread_mutex_destroy(&amp;m);
    return 0;
}
<span class="c">/* Sin el mutex el resultado es menor que 4000000: condición de carrera
   (load–add–store no atómico, término 80). Con -fsanitize=thread se
   detecta el data race en tiempo de ejecución.            */</span></pre>
    <h5>3 · Semáforo contador: productor–consumidor acotado</h5>
    <pre><span class="fname">semaforo_demo.c</span>#include &lt;stdio.h&gt;
#include &lt;pthread.h&gt;
#include &lt;semaphore.h&gt;

#define CAP 8
int buffer[CAP], in = 0, out = 0;
sem_t hay_datos;        <span class="c">/* cuenta elementos disponibles */</span>
sem_t hay_huecos;       <span class="c">/* cuenta huecos libres       */</span>
pthread_mutex_t m = PTHREAD_MUTEX_INITIALIZER;

void *productor(void *arg) {
    for (int i = 1; i &lt;= 20; i++) {
        sem_wait(&amp;hay_huecos);          <span class="c">/* P: reserva un hueco */</span>
        pthread_mutex_lock(&amp;m);
        buffer[in] = i; in = (in + 1) % CAP;
        pthread_mutex_unlock(&amp;m);
        sem_post(&amp;hay_datos);           <span class="c">/* V: publica el dato */</span>
    }
    return NULL;
}

void *consumidor(void *arg) {
    for (int i = 1; i &lt;= 20; i++) {
        sem_wait(&amp;hay_datos);           <span class="c">/* bloquea si está vacío */</span>
        pthread_mutex_lock(&amp;m);
        int v = buffer[out]; out = (out + 1) % CAP;
        pthread_mutex_unlock(&amp;m);
        sem_post(&amp;hay_huecos);
        printf("consumido: %d\n", v);
    }
    return NULL;
}

int main(void) {
    sem_init(&amp;hay_datos, 0, 0);
    sem_init(&amp;hay_huecos, 0, CAP);
    pthread_t p, c;
    pthread_create(&amp;p, NULL, productor, NULL);
    pthread_create(&amp;c, NULL, consumidor, NULL);
    pthread_join(p, NULL); pthread_join(c, NULL);
    sem_destroy(&amp;hay_datos); sem_destroy(&amp;hay_huecos);
    return 0;
}</pre>
    <div class="code-note"><span>▸</span><span><b>Verificación sugerida:</b> compile el segundo ejemplo sin
    <span class="mono">pthread_mutex_lock</span> y con <span class="mono">-fsanitize=thread</span>; luego ejecute
    <span class="mono">strace -c -f ./programa</span> para observar el peso de <span class="mono">futex</span> en el total de syscalls.</span></div>
  </div>
</template>

    <h5>Cadena de razonamiento: del acceso a memoria al thrashing</h5>
    <p style="color:var(--tx2);font-size:14.5px;margin:0 0 10px">
      Un acceso a una variable genera una <b>dirección virtual</b> que la <b>MMU</b> traduce consultando el <b>TLB</b>. Si la
      traducción no está cacheada se recorre la <b>tabla de páginas</b>; si la <b>PTE</b> tiene el <b>bit de presencia</b> en cero se
      produce un <b>page fault</b>, que la rutina del kernel resuelve trayendo la página desde <b>swap</b> o desde el archivo. Un
      exceso de fallos reduce el <b>working set</b> efectivo y, cuando la suma de working sets supera la RAM, el sistema entra en
      <b>thrashing</b>: la CPU espera E/S de paginación en lugar de ejecutar. Las políticas de <b>reemplazo</b> (LRU, Reloj) y el
      control del grado de multiprogramación son la respuesta del SO a esa cadena.
    </p>

on autoridad total; cualquier fallo en este modo compromete la integridad del sistema completo (kernel panic).","cite":{"key":"intel","cap":"Cap. 2","sec":"§2.2"},"rel":[6,8,9,11,14,15,16,49],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 2, §2.2.","annex":["a3","a1","a2"]},{"id":8,"n":8,"es":"Anillos de Protección","en":"Protection Rings","slug":"anillos-de-proteccion","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Jerarquía de cuatro niveles (Ring 0 a Ring 3) de la arquitectura x86 que restringe las instrucciones y segmentos utilizables según el nivel de privilegio actual (CPL) y el descriptor destino (DPL). Ring 0 aloja el kernel; Ring 3, las aplicaciones; los anillos 1 y 2 se usan poco (drivers en algunos diseños).","rol":"Seguridad: materializa el principio de menor privilegio en hardware, impidiendo saltos de código de menor a mayor privilegio sin una puerta controlada.","cite":{"key":"intel","cap":"Cap. 5","sec":"§5.5–5.7"},"rel":[6,7,9,10,16,27],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 5, §5.5–5.7.","annex":["a3","b1","b2"]},{"id":9,"n":9,"es":"Ring 0","en":"Ring 0 / Kernel Level","slug":"ring-0","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Anillo más privilegiado de la arquitectura x86 donde reside el kernel y sus módulos cargables. Otorga acceso total al hardware y a las estructuras críticas del sistema; una referencia inválida en este nivel (por ejemplo, desreferenciar NULL) provoca un fallo fatal en lugar de una señal recuperable.","rol":"Control: es el contexto de ejecución de planificadores, manejadores de interrupciones y controladores de dispositivo; su código debe ser auditable y mínimo.","cite":{"key":"intel","cap":"Cap. 5","sec":"§5.5"},"rel":[2,7,8,263],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 5, §5.5.","annex":["a3","b1"]},{"id":10,"n":10,"es":"Ring 3","en":"Ring 3 / User Level","slug":"ring-3","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Anillo de menor privilegio, destinado al código de usuario. Todo acceso a un recurso protegido genera una excepción de protección general que el kernel traduce en una señal (SIGSEGV) o en una llamada al sistema válida; es la base del aislamiento entre procesos.","rol":"Seguridad: confina los fallos de las aplicaciones a su propio proceso y obliga a pasar por la interfaz auditada del kernel.","cite":{"key":"intel","cap":"Cap. 5","sec":"§5.5"},"rel":[6,8,11,51,264],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 5, §5.5.","annex":["a3","a1","b1"]},{"id":11,"n":11,"es":"Syscall (Llamada al Sistema)","en":"System Call","slug":"syscall-llamada-al-sistema","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Interfaz controlada entre el espacio de usuario y el kernel: una instrucción especial (syscall/sysenter en x86-64, svc en ARM64) que cambia de modo y salta a un punto de entrada verificado, con el número de llamada en un registro y los argumentos validados antes de tocar estructuras internas.","rol":"Mecanismo de control: única puerta legítima para solicitar servicios protegidos; su tabla (sys_call_table) define la superficie de ataque del kernel y se filtra con seccomp.","cite":{"key":"kerrisk","cap":"Cap. 3","sec":"§3.1–3.3"},"rel":[6,7,10,13,15,50,262,276],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 3, §3.1–3.3.","annex":["a3","b3"]},{"id":12,"n":12,"es":"Interrupción por Hardware","en":"Hardware Interrupt","slug":"interrupcion-por-hardware","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Señal asíncrona enviada por un dispositivo o el temporizador a la CPU a través del controlador de interrupciones (APIC/IOAPIC), que suspende la ejecución actual, guarda el contexto mínimo y ejecuta un manejador registrado en la IDT. No está asociada a ninguna instrucción concreta del flujo interrumpido.","rol":"Control de hardware: permite que los dispositivos notifiquen eventos sin sondeo constante, mejorando el rendimiento y reduciendo la latencia de atención.","cite":{"key":"bovet","cap":"Cap. 4","sec":"§4.2"},"rel":[13,14,20,170,171],"bib":"Bovet, D. P., & Cesati, M. (2005). *Understanding the Linux Kernel* (3.ª ed.). O'Reilly. — Cap. 4, §4.2.","annex":["a3","b1"]},{"id":13,"n":13,"es":"Interrupción por Software (Trap)","en":"Software Interrupt / Trap","slug":"interrupcion-por-software-trap","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Excepción generada deliberadamente por una instrucción (int n, syscall, int3) o por el procesador ante un evento síncrono (división por cero, fallo de página). Se denomina trap cuando es intencional y reanudable; fault cuando la instrucción causante debe reintentarse; abort cuando no es recuperable.","rol":"Control de flujo: implementa llamadas al sistema, puntos de ruptura de depuración y transferencia controlada al kernel ante condiciones excepcionales.","cite":{"key":"bovet","cap":"Cap. 4","sec":"§4.2"},"rel":[11,12,14,132],"bib":"Bovet, D. P., & Cesati, M. (2005). *Understanding the Linux Kernel* (3.ª ed.). O'Reilly. — Cap. 4, §4.2.","annex":["a3","a2","c1"]},{"id":14,"n":14,"es":"Vector de Interrupciones (IDT)","en":"Interrupt Descriptor Table","slug":"vector-de-interrupciones-idt","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Tabla del sistema con hasta 256 descriptores que asocian cada vector de interrupción o excepción con la dirección de su manejador, el selector de segmento de código y el nivel de privilegio exigido (DPL). El registro IDTR apunta a su base y límite; su corrupción es un vector clásico de ataque al kernel.","rol":"Control: enruta cada evento de hardware o software a la rutina correcta; la CPU consulta la IDT en cada interrupción, por lo que debe estar siempre válida.","cite":{"key":"intel","cap":"Cap. 6","sec":"§6.10"},"rel":[7,12,13,15,171],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 6, §6.10.","annex":["a2","a3","a5"]},{"id":15,"n":15,"es":"Cambio de Modo","en":"Mode Switch / Privilege Transition","slug":"cambio-de-modo","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Transición controlada entre Ring 3 y Ring 0 (y viceversa) que implica cargar selectores de segmento, conmutar a la pila del kernel (TSS), guardar registros y validar privilegios. Es un punto crítico de seguridad y su coste (decenas a cientos de nanosegundos) motiva optimizaciones como vDSO o vsyscall.","rol":"Rendimiento y seguridad: cada syscall cruza esta frontera; reducir su coste mejora el rendimiento sin relajar la protección.","cite":{"key":"intel","cap":"Cap. 5","sec":"§5.8"},"rel":[6,7,11,14,16,66],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 5, §5.8.","annex":["a3"]},{"id":16,"n":16,"es":"Instrucción Privilegiada","en":"Privileged Instruction","slug":"instruccion-privilegiada","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Instrucción que solo puede ejecutarse en CPL 0 (hlt, lgdt, lidt, mov cr3, invlpg, cli/sti, iret). Su ejecución en modo usuario genera una excepción de protección general (#GP); constituyen la frontera física que hace cumplir el modelo de protección del procesador.","rol":"Seguridad: garantiza que el software de usuario no pueda desactivar interrupciones, alterar tablas del sistema ni acceder a memoria física.","cite":{"key":"intel","cap":"Cap. 5","sec":"§5.6"},"rel":[6,7,8,15],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 5, §5.6.","annex":["a3","a2","b2"]},{"id":17,"n":17,"es":"Contador de Programa (PC)","en":"Program Counter","slug":"contador-de-programa-pc","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Registro (RIP/EIP, o PC en ARM) que contiene la dirección de la próxima instrucción a ejecutar. Al cambiar de contexto se guarda en el PCB para reanudar el proceso en el punto exacto; junto con el SP define el estado de ejecución de un hilo.","rol":"Control de ejecución: determina el flujo de instrucciones y participa en el direccionamiento virtual, por lo que debe preservarse en cada conmutación.","cite":{"key":"patt","cap":"Cap. 4","sec":"§4.1–4.3"},"rel":[18,19,53,66],"bib":"Patterson, D. A., & Hennessy, J. L. (2014). *Computer Organization and Design: The Hardware/Software Interface* (5.ª ed.). Morgan Kaufmann. — Cap. 4, §4.1–4.3.","annex":["a1","a2","b1"]},{"id":18,"n":18,"es":"Puntero de Pila (SP)","en":"Stack Pointer","slug":"puntero-de-pila-sp","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Registro (RSP/ESP) que apunta al tope de la pila de llamadas, donde se almacenan parámetros, direcciones de retorno y variables locales. Cada hilo mantiene su propia pila de kernel y de usuario; su manipulación incorrecta produce desbordamientos y es la base de exploits clásicos.","rol":"Control y seguridad: delimita el uso de la pila por hilo; el hardware lo actualiza en push/pop y call/ret, y el kernel lo conmuta al cambiar de contexto.","cite":{"key":"patt","cap":"Cap. 2","sec":"§2.8"},"rel":[17,19,64,263],"bib":"Patterson, D. A., & Hennessy, J. L. (2014). *Computer Organization and Design: The Hardware/Software Interface* (5.ª ed.). Morgan Kaufmann. — Cap. 2, §2.8.","annex":["a2","a5","b1"]},{"id":19,"n":19,"es":"Registro de Estado (Flags)","en":"Flags Register / RFLAGS","slug":"registro-de-estado-flags","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Registro EFLAGS/RFLAGS que contiene banderas aritméticas (ZF, CF, OF, SF) y de control del sistema (IF, DF, IOPL, AC). Se guarda y restaura en cada cambio de contexto; IF habilita interrupciones y su manipulación afecta la atomicidad y el determinismo de la ejecución.","rol":"Control: comunica el resultado de operaciones y permite al kernel habilitar o enmascarar interrupciones en secciones críticas.","cite":{"key":"patt","cap":"Cap. 2","sec":"§2.6"},"rel":[17,18,78,88],"bib":"Patterson, D. A., & Hennessy, J. L. (2014). *Computer Organization and Design: The Hardware/Software Interface* (5.ª ed.). Morgan Kaufmann. — Cap. 2, §2.6.","annex":["a1","a3"]},{"id":20,"n":20,"es":"Timer Interrupt","en":"Timer / Clock Interrupt","slug":"timer-interrupt","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Interrupción periódica generada por el temporizador (PIT, APIC Timer, HPET) que devuelve el control al kernel para contabilizar tiempo de CPU, decrementar el quantum, actualizar relojes y activar temporizadores. Es el latido que hace posible la expropiación (preemption) en sistemas de tiempo compartido.","rol":"Rendimiento y equidad: garantiza que ningún proceso monopolice la CPU y sostiene el modelo de tiempo compartido y las métricas de planificación.","cite":{"key":"bovet","cap":"Cap. 6","sec":"§6.1–6.2"},"rel":[12,25,26,100],"bib":"Bovet, D. P., & Cesati, M. (2005). *Understanding the Linux Kernel* (3.ª ed.). O'Reilly. — Cap. 6, §6.1–6.2.","annex":["a1","a3","b1"]},{"id":21,"n":21,"es":"Procesamiento por Lotes (Batch)","en":"Batch Processing","slug":"procesamiento-por-lotes-batch","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Primera generación de SO (años 1950): un monitor residente ejecuta trabajos en secuencia sin intervención del operador, agrupados en lotes, minimizando el tiempo de configuración. No hay interactividad ni multiprogramación: la CPU permanece ociosa durante las operaciones de E/S.","rol":"Rendimiento: maximiza el uso del costoso hardware mediante la agrupación de trabajos, aunque sacrifica el tiempo de respuesta interactivo.","cite":{"key":"tanen","cap":"Cap. 1","sec":"§1.3"},"rel":[1,22,23,24],"bib":"Tanenbaum, A. S., & Bos, H. (2015). *Modern Operating Systems* (4.ª ed.). Pearson. — Cap. 1, §1.3.","annex":["a6"]},{"id":22,"n":22,"es":"Monitor Residente","en":"Resident Monitor","slug":"monitor-residente","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Programa pionero siempre presente en memoria que carga, ejecuta y controla los trabajos de un lote interpretando tarjetas de control (JCL). Es el antecesor directo del kernel: establece la primera frontera entre el sistema y los programas de usuario.","rol":"Control: automatiza la transición entre trabajos y protege las rutinas de E/S del sistema frente al código del usuario.","cite":{"key":"tanen","cap":"Cap. 1","sec":"§1.3"},"rel":[2,21,23,46],"bib":"Tanenbaum, A. S., & Bos, H. (2015). *Modern Operating Systems* (4.ª ed.). Pearson. — Cap. 1, §1.3.","annex":["a2","a6","b2"]},{"id":23,"n":23,"es":"Spooling","en":"Simultaneous Peripheral Operations On-Line","slug":"spooling","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Técnica de solapamiento de E/S que usa disco como búfer intermedio para desacoplar operaciones lentas (por ejemplo, impresión), permitiendo que varios trabajos encolen su salida sin monopolizar el dispositivo. Transforma un recurso exclusivo en una cola administrada por el SO.","rol":"Rendimiento: aumenta la utilización de la CPU y de los periféricos al eliminar esperas por dispositivos dedicados.","cite":{"key":"tanen","cap":"Cap. 1","sec":"§1.3"},"rel":[21,22,24,174],"bib":"Tanenbaum, A. S., & Bos, H. (2015). *Modern Operating Systems* (4.ª ed.). Pearson. — Cap. 1, §1.3.","annex":["a1"]},{"id":24,"n":24,"es":"Multiprogramación","en":"Multiprogramming","slug":"multiprogramacion","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Organización en la que varios procesos residen simultáneamente en memoria y la CPU conmuta entre ellos cuando uno se bloquea en E/S, manteniendo el hardware ocupado. Requiere protección de memoria, planificación y mecanismos de sincronización y gestión de recursos compartidos.","rol":"Rendimiento: eleva el uso de CPU al solapar cómputo y E/S; exige al SO arbitrar memoria y evitar interferencias entre programas.","cite":{"key":"silb","cap":"Cap. 1","sec":"§1.3"},"rel":[21,23,25,26,51,100],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 1, §1.3.","annex":["a1","a2","b1"]},{"id":25,"n":25,"es":"Tiempo Compartido","en":"Time Sharing","slug":"tiempo-compartido","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Modalidad interactiva en la que la CPU se reparte en porciones de tiempo (quanta) entre múltiples usuarios y terminales, produciendo la ilusión de ejecución simultánea y dedicada. Prioriza el tiempo de respuesta sobre el rendimiento bruto del sistema.","rol":"Equidad y respuesta: la expropiación periódica garantiza interactividad y evita que un proceso acapare el procesador.","cite":{"key":"silb","cap":"Cap. 1","sec":"§1.3"},"rel":[20,24,26,102,113],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 1, §1.3.","annex":["a1","a3","b1"]},{"id":26,"n":26,"es":"Quántum de Tiempo","en":"Time Quantum / Time Slice","slug":"quantum-de-tiempo","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Intervalo máximo de CPU que un proceso puede consumir antes de ser expropiado por el planificador. Su valor equilibra la latencia percibida y la sobrecarga de conmutación: quanta pequeños favorecen el tiempo de respuesta; quanta grandes, el rendimiento y la caché.","rol":"Planificación: parámetro central de Round Robin y MLFQ; determina la granularidad de la equidad y el coste de cambio de contexto.","cite":{"key":"silb","cap":"Cap. 5","sec":"§5.3"},"rel":[20,24,25,56,66,67,102,106,113],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 5, §5.3.","annex":["a1","b1"]},{"id":27,"n":27,"es":"Multics","en":"Multiplexed Information and Computing Service","slug":"multics","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Sistema operativo desarrollado entre 1965 y 2000 por MIT, Bell Labs y General Electric, pionero en memoria virtual segmentada, protección por anillos, sistema de archivos jerárquico y multiprocesamiento. Inspiró directamente a UNIX; su complejidad contrastó con la simplicidad del modelo de Thompson y Ritchie.","rol":"Legado conceptual: introdujo las ideas de anillo de protección, espacio de direcciones por proceso y archivos con nombres jerárquicos que hoy son estándar.","cite":{"key":"multics","cap":"Sec. II","sec":"§2–4"},"rel":[8,28,117,138,184],"bib":"Corbató, F. J., & Vyssotsky, V. A. (1965). Introduction and overview of the Multics system. *Proceedings of the AFIPS Fall Joint Computer Conference, 27*, 185–196. — Sec. II, §2–4.","annex":["a1","a2","a3"]},{"id":28,"n":28,"es":"UNIX","en":"UNIX","slug":"unix","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"SO multiusuario y multitarea desarrollado en Bell Labs (1969–1973) por Thompson, Ritchie y colaboradores; escrito en C, portátil, con jerarquía de archivos, pipes y una interfaz reducida de llamadas al sistema. Es la base genealógica de Linux, los BSD, macOS, Android e iOS.","rol":"Modelo de referencia: demostró que un SO podía ser portable, modular y programable, y fijó las abstracciones (archivo, proceso, pipe) que hoy persisten.","cite":{"key":"unix","cap":"Vol. 17","sec":"§2–5"},"rel":[27,29,30,34,46],"bib":"Ritchie, D. M., & Thompson, K. (1974). The UNIX time-sharing system. *Communications of the ACM, 17*(7), 365–375. — Vol. 17, §2–5.","annex":["a1","b1","b3"]},{"id":29,"n":29,"es":"Filosofía UNIX","en":"Unix Philosophy","slug":"filosofia-unix","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Conjunto de principios de diseño: programas pequeños que hacen bien una sola cosa, composición mediante pipes y archivos de texto, interfaz uniforme («todo es un archivo»), separación entre mecanismos y políticas, y silencio ante el éxito. Favorece la reutilización y la automatización.","rol":"Arquitectura de software: orienta el diseño modular del sistema y explica la potencia de la shell y de las herramientas de línea de comandos.","cite":{"key":"unix","cap":"Vol. 17","sec":"§6"},"rel":[28,30,48,266],"bib":"Ritchie, D. M., & Thompson, K. (1974). The UNIX time-sharing system. *Communications of the ACM, 17*(7), 365–375. — Vol. 17, §6.","annex":["b1","b3","b5"]},{"id":30,"n":30,"es":"POSIX","en":"Portable Operating System Interface","slug":"posix","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Familia de estándares IEEE 1003 e ISO/IEC 9945 que define las interfaces de llamadas al sistema, la biblioteca C, el shell y las utilidades para garantizar la portabilidad del software. Linux, macOS y los UNIX comerciales la implementan total o parcialmente.","rol":"Abstracción y portabilidad: fija el contrato entre aplicaciones y SO, permitiendo recompilar el mismo código sobre sistemas distintos.","cite":{"key":"posix","cap":"Base Definitions","sec":"§1–2"},"rel":[28,29,50,68,74],"bib":"IEEE. (2017). *POSIX.1-2017: Standard for Information Technology — Portable Operating System Interface (POSIX)*. IEEE. — Base Definitions, §1–2.","annex":[]},{"id":31,"n":31,"es":"Núcleo Monolítico","en":"Monolithic Kernel","slug":"nucleo-monolitico","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Diseño en el que todos los servicios del SO (planificación, memoria, sistemas de archivos, drivers, red e IPC) se ejecutan en un único espacio de direcciones privilegiado. Ofrece alto rendimiento por ausencia de cruces de frontera, a costa de un menor aislamiento: un fallo en un driver compromete el sistema.","rol":"Rendimiento: las llamadas internas son simples llamadas a función; el precio es una superficie de fallo y ataque mayor.","cite":{"key":"silb","cap":"Cap. 2","sec":"§2.7"},"rel":[2,32,33,36,37,168,252,294],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 2, §2.7.","annex":["a1","a2","a3"]},{"id":32,"n":32,"es":"Micronúcleo (Microkernel)","en":"Microkernel","slug":"micronucleo-microkernel","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Arquitectura que reduce el kernel a las funciones mínimas (IPC, planificación básica, manejo de memoria y protección) y traslada drivers y sistemas de archivos a procesos de usuario que se comunican por mensajes. Maximiza el aislamiento y la verificabilidad a costa de más conmutaciones y menor rendimiento.","rol":"Seguridad y robustez: un fallo en un servidor de usuario no derriba el kernel; facilita la verificación formal y el reinicio de componentes.","cite":{"key":"tanen","cap":"Cap. 1","sec":"§1.4"},"rel":[2,31,33,34,35,50,252],"bib":"Tanenbaum, A. S., & Bos, H. (2015). *Modern Operating Systems* (4.ª ed.). Pearson. — Cap. 1, §1.4.","annex":["a1","a2","b1"]},{"id":33,"n":33,"es":"Núcleo Híbrido","en":"Hybrid Kernel","slug":"nucleo-hibrido","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Compromiso que combina una estructura de micronúcleo con servicios críticos (drivers, sistemas de archivos, pila de red) ejecutados en modo kernel por razones de rendimiento. Ejemplos: Windows NT (Executive sobre un micronúcleo), XNU (Mach + BSD) y el diseño de Fuchsia.","rol":"Rendimiento con modularidad: mantiene interfaces tipo mensaje para algunos servicios, pero conserva en kernel los caminos calientes.","cite":{"key":"winint","cap":"Cap. 2","sec":"§2.1–2.3"},"rel":[2,31,32,37,294],"bib":"Russinovich, M. E., Ionescu, A., & Solomon, D. A. (2017). *Windows Internals* (7.ª ed., Parte 1). Microsoft Press. — Cap. 2, §2.1–2.3.","annex":["a3","b3"]},{"id":34,"n":34,"es":"MINIX","en":"Mini UNIX","slug":"minix","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"SO tipo UNIX desarrollado por Andrew Tanenbaum desde 1987 con fines educativos, de diseño microkernel y código fuente abierto; inspiró la creación de Linux. MINIX 3 (2005) enfatiza la tolerancia a fallos y se ejecuta en el Intel Management Engine.","rol":"Didáctica y tolerancia a fallos: modelo de estudio de microkernels; su reincorporación de drivers como procesos de usuario permite reiniciarlos sin detener el sistema.","cite":{"key":"minix","cap":"Cap. 1–2","sec":"§1.1–2.2"},"rel":[28,32,35,36],"bib":"Tanenbaum, A. S., & Woodhull, A. S. (2006). *Operating Systems: Design and Implementation* (3.ª ed.). Pearson. — Cap. 1–2, §1.1–2.2.","annex":["a1","b1"]},{"id":35,"n":35,"es":"seL4","en":"seL4 Microkernel","slug":"sel4","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Micronúcleo de alto rendimiento con verificación formal de corrección funcional (prueba Isabelle/HOL, 2009) y demostración de integridad binaria. Base para sistemas críticos y de alta seguridad; evidencia que la verificación formal de un kernel es factible a escala industrial.","rol":"Seguridad certificable: garantiza aislamiento entre componentes y ausencia de desbordamientos en el código verificado, requisito en aviónica, automoción y defensa.","cite":{"key":"sel4","cap":"Sec. 1–3","sec":"§1–3"},"rel":[32,34,260,296],"bib":"Klein, G., Elphinstone, K., Heiser, G., Andronick, J., Cock, D., Derrin, P., … Winwood, S. (2009). seL4: Formal verification of an OS kernel. *Proceedings of the 22nd ACM Symposium on Operating Systems Principles*, 207–220. — Sec. 1–3, §1–3.","annex":[]},{"id":36,"n":36,"es":"Linux Kernel","en":"Linux Kernel","slug":"linux-kernel","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Kernel monolítico modular, libre (GPLv2), creado por Linus Torvalds en 1991, con planificador CFS/EEVDF, memoria virtual paginada, VFS, namespaces y cgroups. Es la base de las distribuciones, de Android y de la mayoría de servidores y contenedores en la nube.","rol":"Control y abstracción: implementa drivers, seguridad (LSM), virtualización (KVM) y contenedores (namespaces + cgroups) sobre el mismo núcleo.","cite":{"key":"love","cap":"Cap. 1","sec":"§1.1–1.4"},"rel":[2,31,34,230,237],"bib":"Love, R. (2010). *Linux Kernel Development* (3.ª ed.). Addison-Wesley. — Cap. 1, §1.1–1.4.","annex":["a2","a4","b2"]},{"id":37,"n":37,"es":"Windows NT Kernel","en":"Windows NT Kernel","slug":"windows-nt-kernel","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Núcleo híbrido de Windows (desde 1993) con arquitectura cliente-servidor interna: capa HAL, micronúcleo (ntoskrnl), Executive, subsistemas de entorno (Win32, POSIX) y drivers en modo kernel. Introduce objetos del kernel, IRP y un modelo de seguridad basado en tokens y descriptores.","rol":"Control y compatibilidad: aísla subsistemas de personalidad y centraliza la gestión de objetos, E/S y seguridad en el Executive.","cite":{"key":"winint","cap":"Cap. 2","sec":"§2.4"},"rel":[31,33,255],"bib":"Russinovich, M. E., Ionescu, A., & Solomon, D. A. (2017). *Windows Internals* (7.ª ed., Parte 1). Microsoft Press. — Cap. 2, §2.4.","annex":["a3","b2","b3"]},{"id":38,"n":38,"es":"BIOS","en":"Basic Input/Output System","slug":"bios","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Firmware heredado de arranque que inicializa el hardware (POST), expone servicios en modo real (INT 10h/13h) y localiza el sector de arranque MBR. Limitado a 16 bits, 1 MB de direccionamiento y particiones de hasta 2 TB.","rol":"Control de hardware: primer software ejecutado; establece el entorno mínimo para que el bootloader tome el control.","cite":{"key":"tanen","cap":"Cap. 1","sec":"§1.5"},"rel":[39,40,41,44,247,292],"bib":"Tanenbaum, A. S., & Bos, H. (2015). *Modern Operating Systems* (4.ª ed.). Pearson. — Cap. 1, §1.5.","annex":["a2","a3"]},{"id":39,"n":39,"es":"UEFI","en":"Unified Extensible Firmware Interface","slug":"uefi","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Interfaz de firmware moderna que sustituye a la BIOS: entorno de 32/64 bits, servicios de arranque y de runtime, GPT, drivers EFI y arranque desde discos grandes. Define variables NVRAM, Secure Boot y una máquina virtual de bytecode (EBC).","rol":"Control y seguridad: normaliza el arranque, habilita la verificación de firmas y desacopla el SO del firmware específico.","cite":{"key":"uefi","cap":"Cap. 2","sec":"§2.1–2.5"},"rel":[38,40,41,43,45,247],"bib":"UEFI Forum. (2022). *Unified Extensible Firmware Interface Specification* (v2.10). UEFI Forum, Inc. — Cap. 2, §2.1–2.5.","annex":["a4"]},{"id":40,"n":40,"es":"Secure Boot","en":"UEFI Secure Boot","slug":"secure-boot","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Extensión de UEFI que verifica criptográficamente (RSA/ECDSA) que el bootloader y las imágenes de arranque están firmados por una clave de confianza (db), impidiendo la ejecución de código no autorizado durante el arranque y protegiendo la cadena de confianza.","rol":"Seguridad: previene bootkits y rootkits de arranque; la cadena firmware → bootloader → kernel queda validada antes de ejecutar código.","cite":{"key":"uefi","cap":"Cap. 32","sec":"§32.1–32.3"},"rel":[38,39,41,42,43,247,256],"bib":"UEFI Forum. (2022). *Unified Extensible Firmware Interface Specification* (v2.10). UEFI Forum, Inc. — Cap. 32, §32.1–32.3.","annex":["b1"]},{"id":41,"n":41,"es":"Bootloader","en":"Boot Loader","slug":"bootloader","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Programa de primera etapa que, tras el firmware, carga el kernel en memoria, prepara el entorno (modo protegido, GDT, paginación) y le transfiere el control. Ejemplos: GRUB2, systemd-boot, U-Boot y LILO.","rol":"Control de arranque: resuelve la localización del kernel, carga initrd/initramfs y pasa parámetros de arranque; enlaza firmware y SO.","cite":{"key":"grubm","cap":"Cap. 1","sec":"§1.1–1.3"},"rel":[38,39,40,42,43,44,46],"bib":"Free Software Foundation. (2021). *GNU GRUB Manual* (v2.06). gnu.org. — Cap. 1, §1.1–1.3.","annex":["a2","a3","b2"]},{"id":42,"n":42,"es":"GRUB2","en":"GRand Unified Bootloader 2","slug":"grub2","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Gestor de arranque de GNU con soporte BIOS/UEFI, su propio sistema de archivos, scripting (grub.cfg), menús, arranque multi-SO y módulos cargables. Se configura mediante grub-mkconfig/update-grub y puede leer /boot antes de que exista un kernel.","rol":"Control: permite seleccionar kernel y parámetros, aplica la configuración declarativa y carga initramfs; punto común de fallos de arranque.","cite":{"key":"grubm","cap":"Cap. 5–6","sec":"§5.1–6.2"},"rel":[40,41,43,44,45,46],"bib":"Free Software Foundation. (2021). *GNU GRUB Manual* (v2.06). gnu.org. — Cap. 5–6, §5.1–6.2.","annex":["b3"]},{"id":43,"n":43,"es":"systemd-boot","en":"systemd-boot","slug":"systemd-boot","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Gestor de arranque UEFI minimalista (antes gummiboot) que lee entradas desde /boot/loader/entries/*.conf y opera sobre la ESP; se integra con systemd y kernel-install para gestionar versiones de kernel.","rol":"Control: arranque rápido y simple sobre UEFI; su configuración basada en archivos facilita la automatización y el arranque seguro.","cite":{"key":"sysd","cap":"boot loader","sec":"§loader.conf"},"rel":[39,40,41,42,46],"bib":"Poettering, L., & systemd contributors. (2023). *systemd System and Service Manager* [Documentación]. freedesktop.org. — boot loader, §loader.conf.","annex":["b1","b3"]},{"id":44,"n":44,"es":"MBR","en":"Master Boot Record","slug":"mbr","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Primer sector (512 B) de un disco con esquema de particiones DOS: 446 B de código de arranque, tabla de cuatro particiones primarias (16 B cada una) y firma 0x55AA. Usa direccionamiento LBA de 32 bits, lo que limita el disco a 2 TB y a cuatro particiones primarias.","rol":"Control de arranque: el firmware transfiere el control a su código; define el mapa de particiones que el SO interpreta.","cite":{"key":"tanen","cap":"Cap. 4","sec":"§4.1"},"rel":[38,41,42,45,209],"bib":"Tanenbaum, A. S., & Bos, H. (2015). *Modern Operating Systems* (4.ª ed.). Pearson. — Cap. 4, §4.1.","annex":["a2"]},{"id":45,"n":45,"es":"GPT","en":"GUID Partition Table","slug":"gpt","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Esquema de particionado moderno de UEFI con cabecera primaria y de respaldo, CRC32 de integridad, GUID por partición y hasta 128 entradas; usa LBA de 64 bits y convive con una MBR protectora. Permite discos mayores de 2 TB y gran número de particiones.","rol":"Control y fiabilidad: elimina los límites del MBR y permite detectar corrupción del mapa de particiones mediante sumas de verificación.","cite":{"key":"uefi","cap":"Cap. 5","sec":"§5.3"},"rel":[39,42,44,208,209],"bib":"UEFI Forum. (2022). *Unified Extensible Firmware Interface Specification* (v2.10). UEFI Forum, Inc. — Cap. 5, §5.3.","annex":["b4"]},{"id":46,"n":46,"es":"Init / Systemd","en":"Init / systemd","slug":"init-systemd","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Init es el primer proceso de usuario (PID 1): monta sistemas de archivos, arranca servicios y adopta huérfanos. systemd lo sustituye con unidades declarativas (.service, .socket, .mount), dependencias, arranque paralelo, cgroups y registro centralizado (journal).","rol":"Control: define el orden y las dependencias del arranque, supervisa servicios y reinicia procesos caídos; es el gestor de servicios del sistema.","cite":{"key":"sysd","cap":"systemd(1)","sec":"§Concepts"},"rel":[22,28,41,42,43,47,59,60,237,277],"bib":"Poettering, L., & systemd contributors. (2023). *systemd System and Service Manager* [Documentación]. freedesktop.org. — systemd(1), §Concepts.","annex":["a1","a4","b1"]},{"id":47,"n":47,"es":"init.rc","en":"init.rc (Android init script)","slug":"init-rc","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Archivo de configuración del init de Android, escrito en un lenguaje propio, que declara servicios, acciones activadas por disparadores (boot, property) y contextos SELinux que se aplican al arrancar. En el SysV clásico el equivalente son los scripts /etc/rc*.d e /etc/init.d.","rol":"Control: define el modelo de arranque de Android y las transiciones de estado de los servicios nativos, con permisos aplicados por SELinux.","cite":{"key":"levin","cap":"Vol. 1","sec":"Cap. 3"},"rel":[46,256,257,291],"bib":"Levin, J. (2015). *Android Internals: A Confectioner's Cookbook* (Vol. 1). Technologies. — Vol. 1, Cap. 3.","annex":["a1","b3"]},{"id":48,"n":48,"es":"Espacio de Usuario","en":"User Space","slug":"espacio-de-usuario","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Región de memoria virtual (típicamente la mitad inferior en x86-64, hasta 0x00007fff…) donde se alojan código, datos, pila y bibliotecas de los procesos, sin acceso a operaciones privilegiadas. Está aislada del kernel y entre procesos mediante la MMU.","rol":"Seguridad y aislamiento: contiene todo el software no confiable; sus fallos quedan contenidos y se gestionan como señales del proceso.","cite":{"key":"csapp","cap":"Cap. 9","sec":"§9.7"},"rel":[6,29,49,50,51,118],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 9, §9.7.","annex":["a1","a2","a3"]},{"id":49,"n":49,"es":"Espacio de Kernel","en":"Kernel Space","slug":"espacio-de-kernel","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Mitad superior del espacio de direcciones virtuales, mapeada en todos los procesos pero accesible solo en modo kernel (con excepciones como vDSO o vsyscall). Contiene el código del kernel, sus estructuras de datos, las pilas de kernel y los mapeos directos de memoria física.","rol":"Control: aloja el estado global del sistema; compartir su mapeo evita cambiar de tabla de páginas en cada syscall, a costa de exponer el kernel a accesos indebidos.","cite":{"key":"bovet","cap":"Cap. 2","sec":"§2.4"},"rel":[2,7,48,118],"bib":"Bovet, D. P., & Cesati, M. (2005). *Understanding the Linux Kernel* (3.ª ed.). O'Reilly. — Cap. 2, §2.4.","annex":["a1","a2","a3"]},{"id":50,"n":50,"es":"libc","en":"Standard C Library","slug":"libc","mod":1,"modName":"Fundamentos, arquitectura del kernel y arranque","def_":"Biblioteca estándar de C (glibc, musl, bionic) que implementa POSIX sobre las llamadas al sistema: malloc, printf, fopen, pthread, además del arranque (crt0, _start). Es la capa de traducción entre la API del programador y la ABI del kernel.","rol":"Abstracción: amortigua el coste de las syscalls mediante búferes y ofrece portabilidad entre arquitecturas y sistemas.","cite":{"key":"glibc","cap":"Cap. 1–2","sec":"§1–2"},"rel":[11,30,32,48,65,245],"bib":"Loosemore, S., Stallman, R. M., McGrath, R., Oram, A., & Drepper, U. (2023). *The GNU C Library Reference Manual*. Free Software Foundation. — Cap. 1–2, §1–2.","annex":["a3","b5"]},{"id":51,"n":51,"es":"Proceso","en":"Process","slug":"proceso","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Programa en ejecución con su propio espacio de direcciones, estado de CPU, descriptores de archivo y credenciales. Es la unidad de asignación de recursos, mientras que el hilo es la unidad de planificación; el kernel lo representa con una task_struct (Linux) o un objeto EPROCESS (Windows).","rol":"Abstracción y aislamiento: encapsula el estado de ejecución y permite al SO arbitrar CPU, memoria y E/S entre ejecutables independientes.","cite":{"key":"silb","cap":"Cap. 3","sec":"§3.1–3.3"},"rel":[10,24,48,52,53,54,68,71],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 3, §3.1–3.3.","annex":["a1","b1","a2"]},{"id":52,"n":52,"es":"Imagen de Memoria","en":"Memory Image / Core Image","slug":"imagen-de-memoria","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Distribución del espacio de direcciones de un proceso cargado: segmento de texto (código), datos inicializados, BSS, heap (crece hacia arriba) y pila (crece hacia abajo), más las regiones mapeadas de bibliotecas y del kernel. Su diseño determina la carga del ejecutable y el modelo de fallos de página.","rol":"Control de memoria: el kernel construye la imagen con ELF y mmap, y aplica permisos por región (r-x para texto, rw- para datos, NX en pila).","cite":{"key":"csapp","cap":"Cap. 9","sec":"§9.7–9.8"},"rel":[51,61,62,63,64,65,69,165],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 9, §9.7–9.8.","annex":["a1","a2","a5"]},{"id":53,"n":53,"es":"PCB (Process Control Block)","en":"Task Control Block","slug":"pcb-process-control-block","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Estructura de datos del kernel que describe un proceso: identificador, estado, contador de programa, registros, punteros de pila, información de planificación y prioridad, límites de memoria, tabla de descriptores de archivo y estado de contabilidad. En Linux es task_struct; en Windows, EPROCESS + KTHREAD.","rol":"Control: es la unidad que el planificador manipula; durante un cambio de contexto se guardan y restauran sus campos de CPU.","cite":{"key":"silb","cap":"Cap. 3","sec":"§3.2"},"rel":[17,51,54,66,67],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 3, §3.2.","annex":["a1","a2","b1"]},{"id":54,"n":54,"es":"PID (Process ID)","en":"Process Identifier","slug":"pid-process-id","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Identificador numérico único asignado por el kernel a cada proceso; en Linux es un entero de 32 bits y se consulta con getpid(). Los PID se reutilizan tras el reciclado (pid_max), lo que genera riesgos de condiciones de carrera en archivos y señales.","rol":"Control: permite dirigir señales, aplicar políticas y auditar procesos; es la clave de los namespaces de PID en contenedores.","cite":{"key":"kerrisk","cap":"Cap. 6","sec":"§6.1"},"rel":[51,53,59,60,231],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 6, §6.1.","annex":["b1","a1","a4"]},{"id":55,"n":55,"es":"Estado Listo (Ready)","en":"Ready State","slug":"estado-listo-ready","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Estado de un proceso apto para ejecutar que espera ser seleccionado por el planificador porque la CPU está ocupada con otro. Permanece en la cola de listos con todo su contexto preparado; la transición desde Bloqueado ocurre al completarse la E/S.","rol":"Planificación: la longitud de la cola de listos mide la carga del sistema y determina latencias; el paso Listo→Ejecutando es un despacho.","cite":{"key":"silb","cap":"Cap. 3","sec":"§3.2"},"rel":[56,57,58,100],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 3, §3.2.","annex":["a1","b1"]},{"id":56,"n":56,"es":"Estado Ejecutando (Running)","en":"Running State","slug":"estado-ejecutando-running","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Estado del proceso que ocupa la CPU en este instante (uno por núcleo). Sale de él por expropiación (quantum agotado o proceso de mayor prioridad), bloqueo voluntario (E/S) o terminación.","rol":"Seguimiento: base del cálculo de utilización de CPU y de las métricas de planificación; solo los procesos en este estado consumen tiempo de procesador.","cite":{"key":"silb","cap":"Cap. 3","sec":"§3.2"},"rel":[26,55,57,100],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 3, §3.2.","annex":["a1","b1"]},{"id":57,"n":57,"es":"Estado Bloqueado (Waiting)","en":"Blocked / Waiting State","slug":"estado-bloqueado-waiting","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Estado de un proceso que espera un evento externo —finalización de E/S, llegada de una señal, disponibilidad de un semáforo— y no puede ejecutar aunque hubiera CPU libre. El kernel lo suspende hasta que el evento lo pasa a Listo.","rol":"Control: evita el desperdicio de CPU en espera activa y permite que el SO reprograme otros procesos mientras tanto.","cite":{"key":"silb","cap":"Cap. 3","sec":"§3.2"},"rel":[55,56,82,84,171],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 3, §3.2.","annex":["a1","a6","b1"]},{"id":58,"n":58,"es":"Estado Terminado","en":"Terminated / Exit State","slug":"estado-terminado","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Estado final en el que el proceso ha liberado la mayor parte de sus recursos y conserva solo su código de salida y estadísticas para que el padre lo recoja con wait(). Tras el reaping, el PCB se elimina y el PID queda disponible.","rol":"Ciclo de vida: cierra la contabilidad de recursos y habilita la recolección de estado; sin esta fase se generan zombies.","cite":{"key":"silb","cap":"Cap. 3","sec":"§3.2"},"rel":[55,59,60,70],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 3, §3.2.","annex":["a1","b1"]},{"id":59,"n":59,"es":"Proceso Zombie","en":"Zombie Process","slug":"proceso-zombie","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Proceso que ya terminó pero cuyo PCB permanece en la tabla porque su padre no ha llamado a wait()/waitpid(); conserva PID, código de salida y estadísticas, sin consumir CPU ni memoria de usuario. Su acumulación agota la tabla de procesos.","rol":"Control de recursos: el descuido de wait() produce fugas de descriptores de proceso; los subreapers y PID 1 adoptan y recolectan huérfanos.","cite":{"key":"kerrisk","cap":"Cap. 26","sec":"§26.1"},"rel":[46,54,58,60,70,160],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 26, §26.1.","annex":["a1","b1","a2"]},{"id":60,"n":60,"es":"Proceso Huérfano","en":"Orphan Process","slug":"proceso-huerfano","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Proceso cuyo padre terminó antes que él; es adoptado por PID 1 (o por un subreaper configurado con PR_SET_CHILD_SUBREAPER), que se encarga de recolectar su estado. Los daemons se desprenden intencionalmente para sobrevivir a la sesión.","rol":"Control: garantiza que ningún proceso quede sin un reaper; su adopción evita zombies permanentes en el árbol de procesos.","cite":{"key":"kerrisk","cap":"Cap. 26","sec":"§26.1"},"rel":[46,54,58,59,70,231],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 26, §26.1.","annex":["a1","b1"]},{"id":61,"n":61,"es":"Segmento de Texto","en":"Text Segment","slug":"segmento-de-texto","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Región del ejecutable que contiene las instrucciones máquina; se mapea como solo lectura y ejecutable (r-x). Compartir esta región entre procesos (fork) ahorra memoria física y posibilita el copy-on-write solo para datos.","rol":"Seguridad y rendimiento: la protección r-x impide autoparcheo; W^X y ASLR mitigan la ejecución de código arbitrario, y su compartición reduce la huella de memoria.","cite":{"key":"csapp","cap":"Cap. 9","sec":"§9.7"},"rel":[52,62,63,158],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 9, §9.7.","annex":["a5","a1","a2"]},{"id":62,"n":62,"es":"Segmento de Datos","en":"Data Segment","slug":"segmento-de-datos","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Región que contiene variables globales y estáticas inicializadas con valor distinto de cero; se carga desde el archivo ELF y se mapea como lectura/escritura privada con copy-on-write tras fork.","rol":"Control de memoria: distingue datos persistentes en el binario de los no inicializados (BSS), optimizando el tamaño del ejecutable.","cite":{"key":"csapp","cap":"Cap. 9","sec":"§9.7"},"rel":[52,61,63],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 9, §9.7.","annex":["a5","a1","a2"]},{"id":63,"n":63,"es":"BSS","en":"Block Started by Symbol","slug":"bss","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Sección del ejecutable destinada a variables globales y estáticas no inicializadas (o inicializadas a cero); el binario solo registra su tamaño y el cargador la materializa como páginas anónimas puestas a cero, por lo que no ocupa espacio en disco.","rol":"Rendimiento de carga: reduce el tamaño del ejecutable y aprovecha la asignación de páginas cero perezosa del kernel.","cite":{"key":"csapp","cap":"Cap. 7","sec":"§7.4"},"rel":[52,61,62],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 7, §7.4.","annex":["a2","c1"]},{"id":64,"n":64,"es":"Pila (Stack)","en":"Stack","slug":"pila-stack","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Estructura LIFO por hilo que almacena marcos de llamada con parámetros, direcciones de retorno y variables locales; crece hacia direcciones descendentes y su desbordamiento activa la guard page. En Linux el límite se ajusta con ulimit -s.","rol":"Control y seguridad: soporta llamadas y retornos; stack canaries, ASLR y NX mitigan desbordamientos explotables.","cite":{"key":"patt","cap":"Cap. 2","sec":"§2.8"},"rel":[18,52,65,263,264],"bib":"Patterson, D. A., & Hennessy, J. L. (2014). *Computer Organization and Design: The Hardware/Software Interface* (5.ª ed.). Morgan Kaufmann. — Cap. 2, §2.8.","annex":["a5","a2","b1"]},{"id":65,"n":65,"es":"Montón (Heap)","en":"Heap","slug":"monton-heap","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Región de memoria para asignación dinámica en tiempo de ejecución mediante malloc/new sobre brk o mmap; su gestión (ptmalloc, jemalloc, tcmalloc) debe balancear velocidad y fragmentación. Los errores de uso generan fugas y corrupción.","rol":"Rendimiento y gestión de memoria: el asignador amortiza costes de syscalls; una mala política produce fragmentación y consumo desmedido.","cite":{"key":"csapp","cap":"Cap. 9","sec":"§9.9"},"rel":[50,52,64,159,164,165],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 9, §9.9.","annex":["a5","a2","a3"]},{"id":66,"n":66,"es":"Cambio de Contexto","en":"Context Switch","slug":"cambio-de-contexto","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Operación del kernel que guarda el estado de CPU del proceso o hilo saliente (registros, PC, SP, espacio de direcciones) y restaura el del entrante. Si cambia el espacio de direcciones, se recarga CR3 y se invalidan entradas del TLB, elevando el coste.","rol":"Rendimiento: es la operación que materializa el multiprogramming, pero consume tiempo sin trabajo útil; su coste se mide con vmstat/cs y perf.","cite":{"key":"silb","cap":"Cap. 3","sec":"§3.3"},"rel":[15,17,26,53,67,108,129,163],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 3, §3.3.","annex":["a1","a2","b1"]},{"id":67,"n":67,"es":"Sobrecarga de Conmutación","en":"Context Switch Overhead","slug":"sobrecarga-de-conmutacion","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Coste directo e indirecto del cambio de contexto: guardado/restaurado de registros, invalidación de TLB, pérdida de calidez de caché y predicción de saltos. En x86 moderno oscila entre 1 y 5 µs según la carga y el número de páginas activas.","rol":"Rendimiento: justifica quanta no demasiado pequeños, afinidad de CPU y planificadores que reducen migraciones.","cite":{"key":"ostep","cap":"Cap. 6","sec":"§6.3"},"rel":[26,53,66,108,110],"bib":"Arpaci-Dusseau, R. H., & Arpaci-Dusseau, A. C. (2018). *Operating Systems: Three Easy Pieces* (v1.00). Arpaci-Dusseau Books. — Cap. 6, §6.3.","annex":["a2","b1","c1"]},{"id":68,"n":68,"es":"fork()","en":"fork() system call","slug":"fork","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Llamada que crea un proceso hijo duplicando el invocador: el hijo recibe copia de memoria (con copy-on-write), descriptores y credenciales, y devuelve 0 en el hijo y el PID en el padre. Variantes: vfork() y clone() con CLONE_VM para hilos.","rol":"Control de procesos: es la primitiva de creación; combinada con execve() implementa el modelo de arranque de programas de UNIX.","cite":{"key":"kerrisk","cap":"Cap. 24","sec":"§24.1–24.2"},"rel":[30,51,69,70,204,266],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 24, §24.1–24.2.","annex":["a1","a5","b1","b5"]},{"id":69,"n":69,"es":"execve()","en":"execve() system call","slug":"execve","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Llamada que reemplaza la imagen de memoria de un proceso por un nuevo ejecutable ELF, reiniciando pila, heap y registros; no crea proceso. El PID se conserva, los descriptores abiertos permanecen (salvo FD_CLOEXEC) y se ejecutan el cargador y los ld.so necesarios.","rol":"Control: materializa el paso de «programa» a «proceso ejecutable» y define las reglas de herencia de recursos.","cite":{"key":"kerrisk","cap":"Cap. 27","sec":"§27.1–27.2"},"rel":[52,68,70,186],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 27, §27.1–27.2.","annex":["a5","b1","b5"]},{"id":70,"n":70,"es":"waitpid()","en":"waitpid() system call","slug":"waitpid","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Llamada que bloquea al padre hasta que un hijo termina o cambia de estado, devolviendo PID y estado de salida; opciones WNOHANG y WUNTRACED. Es el mecanismo canónico de recolección (reaping) que evita procesos zombie y permite el control de trabajos.","rol":"Control de recursos: libera la entrada de la tabla de procesos y sincroniza la jerarquía padre-hijo.","cite":{"key":"kerrisk","cap":"Cap. 26","sec":"§26.1–26.2"},"rel":[58,59,60,68,69,186],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 26, §26.1–26.2.","annex":["a1","a5","b1","b5"]},{"id":71,"n":71,"es":"Hilo (Thread)","en":"Thread","slug":"hilo-thread","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Unidad de ejecución dentro de un proceso: comparte espacio de direcciones, código, datos globales y descriptores, pero tiene su propio PC, registros, pila y estado de planificación. En Linux es una tarea ligera creada con clone(CLONE_VM|CLONE_FS|CLONE_FILES|CLONE_THREAD).","rol":"Rendimiento y concurrencia: crear y conmutar hilos es más barato que procesos, pero exige sincronización para proteger estructuras compartidas.","cite":{"key":"silb","cap":"Cap. 4","sec":"§4.1"},"rel":[51,72,73,74,75],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 4, §4.1.","annex":["b1","a1","a2"]},{"id":72,"n":72,"es":"Hilos de Usuario (ULT)","en":"User-Level Threads","slug":"hilos-de-usuario-ult","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Hilos gestionados por una biblioteca en espacio de usuario sin conocimiento del kernel; el cambio entre ellos no requiere modo kernel y es muy rápido, pero una llamada bloqueante bloquea a todo el proceso y no hay paralelismo real entre núcleos.","rol":"Rendimiento: reducen la sobrecarga de conmutación; su limitación motivó los modelos N:M y los hilos nativos.","cite":{"key":"silb","cap":"Cap. 4","sec":"§4.3"},"rel":[71,73,74,76],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 4, §4.3.","annex":["a1","a3","b1"]},{"id":73,"n":73,"es":"Hilos de Kernel (KLT)","en":"Kernel-Level Threads","slug":"hilos-de-kernel-klt","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"Hilos que el kernel conoce y planifica individualmente, permitiendo paralelismo real, expropiación por hilo y bloqueo independiente. Su creación y conmutación son más costosas; Linux implementa el modelo 1:1 (pthreads → tasks).","rol":"Planificación: el planificador de CPU opera sobre ellos, por lo que su número afecta directamente la escalabilidad y el contexto de cambio.","cite":{"key":"silb","cap":"Cap. 4","sec":"§4.3"},"rel":[71,72,74,76],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 4, §4.3.","annex":["a1","b1","b5"]},{"id":74,"n":74,"es":"pthreads","en":"POSIX Threads","slug":"pthreads","mod":2,"modName":"Procesos, hilos, concurrencia y planificación","def_":"API estándar POSIX (pthread_create, pthread_join, pthread_mutex_lock) para hilos, definida en IEEE 1003.1c e implementada en Linux por glibc (NPTL) y musl. Modelo 1:1 sobre clones del kernel con la misma semántica de memoria.","rol":"Concurrencia portable: unifica la programación multihilo entre sistemas POSIX; es la base de la mayoría de bibliotecas de concurrencia.","cite":{"key":"posix","cap":"System Interfaces","sec":"§pthread_*"},"rel":
