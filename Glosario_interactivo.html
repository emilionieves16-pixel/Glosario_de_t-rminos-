ustifica la reorganización de datos en discos mecánicos.","cite":{"key":"silb","cap":"Cap. 11","sec":"§11.1"},"rel":[176,178,179],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 11, §11.1.","annex":["a1","b1"]},{"id":178,"n":178,"es":"Latencia Rotacional","en":"Rotational Latency","slug":"latencia-rotacional","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Tiempo medio que el sector objetivo tarda en pasar bajo el cabezal, determinado por la velocidad de giro (a 7200 rpm, media revolución ≈ 4,17 ms). Sumada al seek time y al tiempo de transferencia, compone la latencia de servicio.","rol":"Métrica: explica por qué las RPM y la densidad de pistas afectan la E/S aleatoria de los HDD.","cite":{"key":"silb","cap":"Cap. 11","sec":"§11.1"},"rel":[176,177,179,180],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 11, §11.1.","annex":[]},{"id":179,"n":179,"es":"Algoritmo SCAN","en":"SCAN Algorithm (Elevator)","slug":"algoritmo-scan","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Algoritmo de planificación de disco que mueve el cabezal en una dirección atendiendo todas las peticiones a su paso y luego invierte el sentido, como un ascensor. Reduce el seek total y es libre de inanición, a costa de mayor varianza en la latencia.","rol":"Rendimiento: amortiza la mecánica del HDD agrupando accesos por pista; inspira los planificadores de bloque modernos para discos rotacionales.","cite":{"key":"silb","cap":"Cap. 11","sec":"§11.2"},"rel":[176,177,178,180],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 11, §11.2.","annex":["a1","a2","a6"]},{"id":180,"n":180,"es":"Algoritmo C-SCAN","en":"C-SCAN (Circular SCAN)","slug":"algoritmo-c-scan","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Variante de SCAN que atiende solo en un sentido y, al llegar al extremo, regresa al inicio sin atender peticiones, ofreciendo un tiempo de espera más uniforme (mejor para cargas con localidad desigual).","rol":"Rendimiento: reduce la varianza de latencia frente a SCAN, a costa de mayor recorrido de cabezal.","cite":{"key":"silb","cap":"Cap. 11","sec":"§11.2"},"rel":[176,178,179],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 11, §11.2.","annex":[]},{"id":181,"n":181,"es":"SSD","en":"Solid State Drive","slug":"ssd","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Dispositivo de estado sólido basado en NAND flash, sin partes móviles: latencias de decenas de microsegundos, acceso aleatorio casi uniforme y necesidad de gestionar borrado en bloques (GC, wear leveling, TRIM). El controlador FTL abstrae esa complejidad.","rol":"Rendimiento: elimina el seek time y habilita E/S paralela; el SO debe emitir TRIM/discard y evitar patrones que amplifiquen la escritura.","cite":{"key":"silb","cap":"Cap. 11","sec":"§11.3"},"rel":[175,176,182,183,203],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 11, §11.3.","annex":["a1"]},{"id":182,"n":182,"es":"Protocolo NVMe","en":"NVMe Protocol","slug":"protocolo-nvme","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Protocolo de alto rendimiento diseñado para SSD sobre PCIe, con colas profundas y comandos ligeros ejecutados en paralelo; sustituye el legado AHCI/SATA. Define colas de envío y completado por núcleo, interrupciones por MSI-X y namespaces.","rol":"Rendimiento: reduce la latencia y multiplica las IOPS al eliminar el cuello de botella de una única cola SATA.","cite":{"key":"nvme","cap":"Vol. 1","sec":"§1–4"},"rel":[169,181,183],"bib":"NVM Express, Inc. (2021). *NVM Express Base Specification* (Rev. 2.0). nvmexpress.org. — Vol. 1, §1–4.","annex":["a1","a3","a4"]},{"id":183,"n":183,"es":"Colas Paralelas NVMe","en":"NVMe Parallel Queues","slug":"colas-paralelas-nvme","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Conjunto de hasta miles de colas de envío/completado (SQ/CQ) que permiten a cada núcleo emitir comandos sin contención, con interrupciones dirigidas por MSI-X. Habilita millones de IOPS con escalabilidad multicore.","rol":"Rendimiento: colas por CPU reducen el bloqueo y la afinidad de caché; el kernel expone este paralelismo mediante blk-mq.","cite":{"key":"nvme","cap":"Vol. 1","sec":"§3"},"rel":[108,181,182],"bib":"NVM Express, Inc. (2021). *NVM Express Base Specification* (Rev. 2.0). nvmexpress.org. — Vol. 1, §3.","annex":["a1","a3","b1"]},{"id":184,"n":184,"es":"Sistema de Archivos","en":"File System","slug":"sistema-de-archivos","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Capa que organiza los datos en archivos y directorios sobre dispositivos de bloque o red, proporcionando asignación de espacio, metadatos, permisos, journaling y consistencia. En Linux se accede por VFS, que unifica las implementaciones (ext4, XFS, Btrfs, NFS).","rol":"Abstracción: convierte sectores en archivos con nombres y atributos; administra espacio, integridad y rendimiento de E/S.","cite":{"key":"silb","cap":"Cap. 13","sec":"§13.1"},"rel":[5,27,174,175,185,186,187,193,195,198,207,208],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 13, §13.1.","annex":["b3"]},{"id":185,"n":185,"es":"Metadatos","en":"Metadata","slug":"metadatos","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Datos que describen los datos: nombres, tamaños, propietarios, permisos, marcas de tiempo, bloques asignados y atributos extendidos. En ext4 residen en inodos y entradas de directorio; su coherencia es lo que el journaling protege.","rol":"Control: el SO valida y mantiene metadatos; su corrupción inutiliza el sistema de archivos aunque los datos estén intactos.","cite":{"key":"silb","cap":"Cap. 13","sec":"§13.1"},"rel":[184,187,188,198],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 13, §13.1.","annex":["b3"]},{"id":186,"n":186,"es":"Descriptor de Archivo (FD)","en":"File Descriptor","slug":"descriptor-de-archivo-fd","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Entero no negativo que indexa la tabla de descriptores del proceso y referencia una descripción de archivo abierto (open file description) con offset, flags y modo. Los FDs 0, 1 y 2 se reservan para stdin, stdout y stderr; se duplican con dup y se cierran con close.","rol":"Control: el kernel arbitra el acceso a archivos y recursos; los límites RLIMIT_NOFILE y las fugas de descriptores afectan la estabilidad del servicio.","cite":{"key":"kerrisk","cap":"Cap. 5","sec":"§5.1"},"rel":[69,70,160,167,184,188],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 5, §5.1.","annex":["b3","a1","a3"]},{"id":187,"n":187,"es":"Inodo","en":"Inode","slug":"inodo","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Estructura del sistema de archivos que describe un archivo con independencia de su nombre: tipo, permisos, propietario, tamaño, marcas de tiempo, contador de enlaces y punteros a bloques. Los nombres viven en los directorios, lo que permite enlaces duros.","rol":"Control: es la identidad real del archivo (número de inodo); el SO lo mantiene en caché y lo protege con journaling.","cite":{"key":"kerrisk","cap":"Cap. 94","sec":"§94.1"},"rel":[184,185,188,189,190,191,194,195,204],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 94, §94.1.","annex":["b3"]},{"id":188,"n":188,"es":"Tabla de Inodos","en":"Inode Table","slug":"tabla-de-inodos","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Área del sistema de archivos que almacena todos los inodos, con asignación fija (ext4) o dinámica (XFS, Btrfs); el superbloque registra su ubicación, tamaño y número de inodos libres. En ext4 cada grupo de bloques tiene su propia tabla.","rol":"Control: limita el número máximo de archivos y determina el coste de localización de metadatos; su agotamiento produce ENOSPC sin falta de espacio.","cite":{"key":"ext4","cap":"Vol. 2","sec":"§2–3"},"rel":[185,186,187,207,208],"bib":"Mathur, A., Cao, M., Bhattacharya, S., Dilger, A., Tomas, A., & Vivier, L. (2007). The new ext4 filesystem: current status and future plans. *Proceedings of the Linux Symposium, 2*, 21–33. — Vol. 2, §2–3.","annex":["b3"]},{"id":189,"n":189,"es":"Punteros Directos","en":"Direct Pointers","slug":"punteros-directos","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Conjunto de 12 punteros del inodo ext2/ext3/ext4 que apuntan directamente a bloques de datos, cubriendo archivos pequeños sin indirección. Ext4 los sustituye parcialmente por extents para reducir metadatos y fragmentación.","rol":"Rendimiento: minimizan accesos para archivos pequeños (mayoría de archivos), evitando recorridos de indirección.","cite":{"key":"kerrisk","cap":"Cap. 94","sec":"§94.2"},"rel":[187,190,191,192,193,201],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 94, §94.2.","annex":["a2","b3"]},{"id":190,"n":190,"es":"Puntero Indirecto Simple","en":"Single Indirect Pointer","slug":"puntero-indirecto-simple","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Puntero del inodo a un bloque de índices que contiene direcciones de bloques de datos, ampliando la capacidad del archivo en un bloque completo de punteros (con 4 KiB y 4 B por puntero, 1024 bloques = 4 MiB).","rol":"Rendimiento: introduce un nivel de indirección para archivos medianos, con un acceso adicional por bloque de datos.","cite":{"key":"kerrisk","cap":"Cap. 94","sec":"§94.2"},"rel":[187,189,191,192],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 94, §94.2.","annex":["a2","b3"]},{"id":191,"n":191,"es":"Puntero Indirecto Doble","en":"Double Indirect Pointer","slug":"puntero-indirecto-doble","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Puntero a un bloque cuyas entradas apuntan a bloques de punteros simples: dos niveles de indirección que cubren tamaños de cientos de MiB con dos accesos adicionales. Compromiso clásico de ext2/ext3 entre flexibilidad y coste.","rol":"Rendimiento: penaliza los accesos aleatorios en archivos grandes; su impacto motivó los extents de ext4 y los B-trees de XFS/Btrfs.","cite":{"key":"kerrisk","cap":"Cap. 94","sec":"§94.2"},"rel":[187,189,190,192,193],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 94, §94.2.","annex":["a2","b3"]},{"id":192,"n":192,"es":"Puntero Indirecto Triple","en":"Triple Indirect Pointer","slug":"puntero-indirecto-triple","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Puntero a un bloque de punteros dobles, con tres niveles de indirección que permiten archivos de hasta varios TiB en ext3/ext4 clásico. Cada nivel añade un acceso a metadatos por bloque referenciado.","rol":"Rendimiento: alto coste de metadatos en archivos enormes; los extents y los árboles B eliminan esta escalera de indirecciones.","cite":{"key":"kerrisk","cap":"Cap. 94","sec":"§94.2"},"rel":[189,190,191,201],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 94, §94.2.","annex":["a2","b3"]},{"id":193,"n":193,"es":"Jerarquía de Directorios","en":"Directory Hierarchy","slug":"jerarquia-de-directorios","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Organización arbórea con raíz / donde los directorios son archivos que asocian nombres a números de inodo. Linux añade el principio «todo es un archivo», puntos de montaje y espacios de nombres por proceso.","rol":"Abstracción: ofrece una vista unificada y navegable de dispositivos heterogéneos mediante VFS y montajes.","cite":{"key":"silb","cap":"Cap. 13","sec":"§13.2"},"rel":[184,189,191,194,195,196,207,209],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 13, §13.2.","annex":["a1","b1","b3"]},{"id":194,"n":194,"es":"Enlace Duro (Hard Link)","en":"Hard Link","slug":"enlace-duro-hard-link","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Nombre adicional para el mismo inodo: ambos comparten datos, permisos y contador de enlaces; al borrar uno, el inodo persiste hasta que el contador llega a cero. No puede cruzar sistemas de archivos ni referir directorios (salvo . y ..).","rol":"Control: el SO gestiona la identidad por inodo; la verificación de permisos es común a todos los nombres.","cite":{"key":"kerrisk","cap":"Cap. 18","sec":"§18.1"},"rel":[187,193,195],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 18, §18.1.","annex":["b3"]},{"id":195,"n":195,"es":"Enlace Simbólico (Symlink)","en":"Symbolic Link","slug":"enlace-simbolico-symlink","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Archivo especial cuyo contenido es una ruta a otro archivo; se resuelve en cada acceso (resolución de rutas, con protección contra bucles mediante límite de enlaces). Puede apuntar a rutas inexistentes y cruzar sistemas de archivos.","rol":"Abstracción: permite indirección flexible y nombres estables; la resolución segura (O_NOFOLLOW, openat2) evita ataques por enlaces.","cite":{"key":"kerrisk","cap":"Cap. 18","sec":"§18.2"},"rel":[184,187,193,194],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 18, §18.2.","annex":["a2","b3","b4"]},{"id":196,"n":196,"es":"Permisos UNIX (rwx)","en":"UNIX Permissions (rwx)","slug":"permisos-unix-rwx","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Modelo de control de acceso discrecional con tres clases (propietario, grupo, otros) y tres bits por clase: lectura, escritura y ejecución (con significado especial en directorios: listar, crear/borrar, atravesar). Se consultan en orden y el root los omite (salvo en ejecución).","rol":"Seguridad: primera línea de defensa del sistema de archivos; modelo DAC complementado por ACL, capabilities y LSM.","cite":{"key":"kerrisk","cap":"Cap. 15","sec":"§15.1–15.2"},"rel":[193,197,255,256,261,267],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 15, §15.1–15.2.","annex":["a3","b3"]},{"id":197,"n":197,"es":"Permisos Octales","en":"Octal Permissions","slug":"permisos-octales","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Notación numérica de los permisos: cada bit vale 4 (r), 2 (w) y 1 (x), y se agrupa en tres dígitos octales (ej. 755 = rwxr-xr-x). Un cuarto dígito representa setuid (4), setgid (2) y sticky bit (1).","rol":"Administración: permite expresar y auditar permisos de forma compacta; los bits especiales alteran la identidad efectiva del proceso.","cite":{"key":"kerrisk","cap":"Cap. 15","sec":"§15.3"},"rel":[196,255,261],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 15, §15.3.","annex":["a1","b1","b3"]},{"id":198,"n":198,"es":"Journaling","en":"Journaling","slug":"journaling","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Técnica de los sistemas de archivos que registra las intenciones de modificación en un diario antes de aplicarlas a las estructuras principales, permitiendo recuperar la coherencia tras un fallo sin un fsck completo. Modos: journal, ordered y writeback.","rol":"Integridad y rendimiento: convierte operaciones no atómicas en transacciones recuperables; reduce drásticamente el tiempo de recuperación.","cite":{"key":"silb","cap":"Cap. 13","sec":"§13.5"},"rel":[126,175,184,185,199,200,201,202,205],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 13, §13.5.","annex":["a3","b3"]},{"id":199,"n":199,"es":"Commit de Diario","en":"Journal Commit","slug":"commit-de-diario","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Punto en el que el diario se sincroniza a disco (fsync/fdatasync o expiración del intervalo de commit), garantizando que las transacciones registradas sobreviven a un corte de energía. Antes del commit, los datos pueden perderse aunque la operación haya retornado.","rol":"Durabilidad: define la ventana de pérdida ante fallos; el tuning del intervalo (commit=, barrier) equilibra rendimiento y seguridad.","cite":{"key":"ext4","cap":"Vol. 2","sec":"§4"},"rel":[175,198,200],"bib":"Mathur, A., Cao, M., Bhattacharya, S., Dilger, A., Tomas, A., & Vivier, L. (2007). The new ext4 filesystem: current status and future plans. *Proceedings of the Linux Symposium, 2*, 21–33. — Vol. 2, §4.","annex":[]},{"id":200,"n":200,"es":"Data Ordered Mode","en":"Data Ordered Mode (ext4)","slug":"data-ordered-mode","mod":4,"modName":"Direccionamiento, E/S y sistemas de archivos","def_":"Modo de journaling predeterminado en ext4 en el que los bloques de datos se escriben antes de confirmar el metadato en el diario, evitando que se referencien bloques con datos antiguos o basura tras un fallo. No garantiza atomicidad total de los datos.","rol":"Integridad: compromiso entre seguridad (data=journal) y rendimiento (data=writeback), protegiendo los metadatos y el contenido referenciado.","cite":{"key":"ext4","cap":"Vol. 2","sec":"§4"},"rel":[198,199,201],"bib":"Mathur, A., Cao, M., Bhattacharya, S., Dilger, A., Tomas, A., & Vivier, L. (2007). The new ext4 filesystem: current status and future plans. *Proceedings of the Linux Symposium, 2*, 21–33. — Vol. 2, §4.","annex":["a3","b3"]},{"id":201,"n":201,"es":"ext4","en":"Fourth Extended Filesystem","slug":"ext4","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Sistema de archivos de Linux (2008) con extents de 48 bits, journaling, asignación diferida (delayed allocation), multibloque, directorios HTree, checksums de metadatos y tamaños de hasta 1 EiB. Es el predeterminado histórico de distribuciones.","rol":"Rendimiento e integridad: mejora a ext3 en asignación y escalabilidad manteniendo compatibilidad y herramientas maduras.","cite":{"key":"ext4","cap":"Vol. 2","sec":"§2–5"},"rel":[189,192,198,200,207],"bib":"Mathur, A., Cao, M., Bhattacharya, S., Dilger, A., Tomas, A., & Vivier, L. (2007). The new ext4 filesystem: current status and future plans. *Proceedings of the Linux Symposium, 2*, 21–33. — Vol. 2, §2–5.","annex":["b3"]},{"id":202,"n":202,"es":"NTFS","en":"New Technology File System","slug":"ntfs","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Sistema de archivos de Windows con B-tree de metadatos (MFT), journaling ($LogFile), compresión, cifrado (EFS), cuotas y ACL. Su equivalente de diario garantiza la coherencia de la MFT tras fallos.","rol":"Integridad y seguridad: integra permisos NTFS con el modelo de tokens de Windows; su implementación en Linux (ntfs3) es funcional pero limitada.","cite":{"key":"ntfs","cap":"Cap. 12","sec":"§12.1–12.4"},"rel":[198,207,255],"bib":"Russinovich, M. E., Ionescu, A., & Solomon, D. A. (2017). *Windows Internals* (7.ª ed., Parte 1). Microsoft Press. — Cap. 12, §12.1–12.4.","annex":["b3","b4"]},{"id":203,"n":203,"es":"F2FS","en":"Flash-Friendly File System","slug":"f2fs","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Sistema de archivos diseñado por Samsung para NAND flash: estructura log-estructurada con seis tipos de nodos y limpieza (GC) consciente del borrado en bloques, minimizando la amplificación de escritura y el desgaste.","rol":"Rendimiento en flash: optimiza la E/S de dispositivos móviles y tarjetas SD, reduciendo escrituras innecesarias y mejorando la latencia.","cite":{"key":"f2fs","cap":"Vol. 13","sec":"§2–4"},"rel":[181,205,206],"bib":"Lee, C., Sim, D., Hwang, J., Cho, S., Lee, H., & Kim, J. (2015). F2FS: A new file system for flash storage. *Proceedings of the 13th USENIX Conference on File and Storage Technologies*, 273–286. — Vol. 13, §2–4.","annex":["b3"]},{"id":204,"n":204,"es":"Copy-on-Write (CoW)","en":"Copy-on-Write","slug":"copy-on-write-cow","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Técnica que comparte datos entre varios propietarios (procesos, archivos, instantáneas) y realiza una copia real solo cuando alguno intenta escribirla. En memoria sustenta fork; en sistemas de archivos (Btrfs, ZFS), instantáneas y clones baratos.","rol":"Rendimiento y consistencia: evita copias innecesarias y permite instantáneas atómicas; requiere gestión de referencias y de fragmentación.","cite":{"key":"ostep","cap":"Cap. 29","sec":"§29.3"},"rel":[68,187,205,206],"bib":"Arpaci-Dusseau, R. H., & Arpaci-Dusseau, A. C. (2018). *Operating Systems: Three Easy Pieces* (v1.00). Arpaci-Dusseau Books. — Cap. 29, §29.3.","annex":["a5","a1","a2"]},{"id":205,"n":205,"es":"ZFS","en":"ZFS (Zettabyte File System)","slug":"zfs","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Sistema de archivos y gestor de volúmenes con checksums de datos y metadatos, copy-on-write transaccional, instantáneas, clones, compresión, deduplicación, RAID-Z y autoreparación. Su diseño integrado garantiza integridad extremo a extremo.","rol":"Integridad: verifica cada bloque al leerlo y lo reconstruye desde paridad o réplicas; su CoW evita inconsistencias tras fallos.","cite":{"key":"zfs","cap":"Cap. 1","sec":"§1–3"},"rel":[198,203,204,206],"bib":"Bonwick, J., & Moore, B. (2007). *ZFS: The Last Word in File Systems*. Sun Microsystems. — Cap. 1, §1–3.","annex":["a5","b3"]},{"id":206,"n":206,"es":"Btrfs","en":"Btrfs (B-tree File System)","slug":"btrfs","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Sistema de archivos CoW de Linux con B-trees, subtítulos y volúmenes (subvolumes), instantáneas, RAID integrado, compresión (zstd/lzo) y verificación de sumas de comprobación. Su gestión de espacio por extents y su GC de datos son sensibles a la fragmentación.","rol":"Integridad y flexibilidad: CoW + checksums ofrecen instantáneas y detección de corrupción, con coste de escritura y de mantenimiento (balance, scrub).","cite":{"key":"btrfs","cap":"Vol. 9","sec":"§2–5"},"rel":[155,203,204,205],"bib":"Rodeh, O., Bacik, J., & Mason, C. (2013). BTRFS: The Linux B-tree filesystem. *ACM Transactions on Storage, 9*(3), 1–32. — Vol. 9, §2–5.","annex":["a2","b3"]},{"id":207,"n":207,"es":"VFS","en":"Virtual File System","slug":"vfs","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Capa de abstracción del kernel que define una interfaz común (superblock, inode, dentry, file) para todos los sistemas de archivos, permitiendo montar ext4, XFS, NFS, proc o tmpfs bajo un mismo árbol. Traduce llamadas genéricas en operaciones específicas.","rol":"Abstracción: permite coexistencia de sistemas heterogéneos y espacios de nombres por proceso (mount namespaces) en contenedores.","cite":{"key":"bovet","cap":"Cap. 12","sec":"§12.1"},"rel":[184,188,193,201,202,208,209,233],"bib":"Bovet, D. P., & Cesati, M. (2005). *Understanding the Linux Kernel* (3.ª ed.). O'Reilly. — Cap. 12, §12.1.","annex":["a1","a4","b1"]},{"id":208,"n":208,"es":"Superbloque","en":"Superblock","slug":"superbloque","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Estructura que describe un sistema de archivos montado: tamaño de bloque, número y ubicación de inodos y bloques libres, estado de limpieza, UUID y parámetros de montaje. Vive en memoria mientras está montado y se replica en disco para tolerar corrupción.","rol":"Control: su coherencia determina la viabilidad del sistema de archivos; herramientas como e2fsck o tune2fs operan sobre él.","cite":{"key":"bovet","cap":"Cap. 12","sec":"§12.2"},"rel":[45,184,188,207,209,253],"bib":"Bovet, D. P., & Cesati, M. (2005). *Understanding the Linux Kernel* (3.ª ed.). O'Reilly. — Cap. 12, §12.2.","annex":["a1","a2","b2"]},{"id":209,"n":209,"es":"Punto de Montaje","en":"Mount Point","slug":"punto-de-montaje","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Directorio del árbol sobre el que se superpone el contenido de un sistema de archivos o dispositivo, ocultando el contenido previo hasta el desmontaje. El montaje puede ser automático (fstab, systemd), manual (mount) y con opciones (ro, noexec, nosuid).","rol":"Abstracción: unifica dispositivos bajo una jerarquía única; opciones de montaje endurecen la seguridad de /tmp y /home.","cite":{"key":"kerrisk","cap":"Cap. 14","sec":"§14.1"},"rel":[44,45,193,207,208,232,242],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 14, §14.1.","annex":["b3"]},{"id":210,"n":210,"es":"Virtualización","en":"Virtualization","slug":"virtualizacion","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Tecnología que crea versiones virtuales de recursos físicos (CPU, memoria, E/S) permitiendo ejecutar varios sistemas operativos sobre un mismo hardware con aislamiento. Se basa en la distinción entre modo privilegiado y no privilegiado y en la interceptación de instrucciones sensibles.","rol":"Control y aislamiento: el hipervisor arbitra recursos entre máquinas virtuales y ofrece consolidación, migración en vivo y aislamiento de fallos.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.1"},"rel":[211,212,220,221,224,225,246,252,293],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.1.","annex":["a4","a2","a3"]},{"id":211,"n":211,"es":"Máquina Virtual","en":"Virtual Machine","slug":"maquina-virtual","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Emulación completa de un computador (CPU virtual, memoria, dispositivos) que ejecuta un SO invitado sin modificaciones. Requiere capturar y simular las instrucciones sensibles; el aislamiento es fuerte pero su coste de E/S es mayor que en contenedores.","rol":"Abstracción: ofrece un entorno hardware homogéneo y aislado, ideal para consolidación, pruebas y portabilidad de cargas.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.1"},"rel":[4,210,212,223,224],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.1.","annex":["a4","a2","b2"]},{"id":212,"n":212,"es":"Hipervisor","en":"Hypervisor / VMM","slug":"hipervisor","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Capa de software que crea y ejecuta máquinas virtuales, asignando CPU, memoria y dispositivos según políticas, e interceptando operaciones sensibles. Puede ser de tipo 1 (bare-metal) o de tipo 2 (sobre un SO anfitrión).","rol":"Control: es el árbitro de recursos entre invitados y el responsable del aislamiento; su calidad determina el overhead de virtualización.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.2"},"rel":[210,211,213,214,220,221,223],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.2.","annex":["a4","a2","b2"]},{"id":213,"n":213,"es":"Hipervisor Tipo 1","en":"Type 1 Hypervisor","slug":"hipervisor-tipo-1","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Hipervisor que se ejecuta directamente sobre el hardware, sin SO anfitrión, con drivers propios de virtualización; ejemplos: Xen, VMware ESXi, Microsoft Hyper-V y KVM (integrado en Linux). Ofrece menor latencia y mayor seguridad.","rol":"Rendimiento y seguridad: menor superficie de ataque y overhead reducido; base de las nubes públicas y privadas.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.2"},"rel":[212,214,215,220,246],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.2.","annex":["a4"]},{"id":214,"n":214,"es":"Hipervisor Tipo 2","en":"Type 2 Hypervisor","slug":"hipervisor-tipo-2","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Hipervisor que corre como aplicación sobre un SO anfitrión (VirtualBox, VMware Workstation, QEMU sin KVM): utilizado para desarrollo y escritorio. Su rendimiento depende del anfitrión y sufre doble capa de planificación y E/S.","rol":"Flexibilidad: fácil de instalar y usar; su overhead lo hace inadecuado para producción de alto rendimiento.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.2"},"rel":[212,213,216,217,223],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.2.","annex":["a1","a4","b1"]},{"id":215,"n":215,"es":"KVM","en":"Kernel-based Virtual Machine","slug":"kvm","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Módulo del kernel Linux que convierte al propio kernel en hipervisor de tipo 1: expone /dev/kvm y permite a QEMU ejecutar vCPU con soporte de VT-x/AMD-V directamente en hardware, usando Linux para planificación, memoria y drivers.","rol":"Rendimiento: evita la emulación de la CPU y aprovecha los mecanismos del kernel; es la base de OpenStack, Proxmox y gran parte de la nube.","cite":{"key":"kivity","cap":"Vol. 1","sec":"§1–3"},"rel":[213,216,218,219,220,293],"bib":"Kivity, A., Kamay, Y., Laor, D., Lublin, U., & Liguori, A. (2007). kvm: the Linux virtual machine monitor. *Proceedings of the Linux Symposium, 1*, 225–230. — Vol. 1, §1–3.","annex":["a1","a2","a4"]},{"id":216,"n":216,"es":"QEMU","en":"Quick Emulator","slug":"qemu","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Emulador y virtualizador de código abierto que emula CPUs y dispositivos completos; combinado con KVM (qemu-kvm) ejecuta código nativo con aceleración, y sin él permite emulación cruzada de arquitecturas (user-mode y system-mode).","rol":"Flexibilidad: soporta múltiples arquitecturas y dispositivos virtuales; su coste de emulación pura es alto.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.3"},"rel":[214,215,217,222],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.3.","annex":["a4"]},{"id":217,"n":217,"es":"VirtualBox","en":"Oracle VM VirtualBox","slug":"virtualbox","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Hipervisor de tipo 2 multiplataforma con interfaz gráfica y de línea de comandos (VBoxManage), extensiones de virtualización, instantáneas y guest additions. Adecuado para escritorio y pruebas, no para servidores de alta densidad.","rol":"Uso práctico: permite laboratorios de SO sin hardware dedicado; su arquitectura añade capas respecto a KVM.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.4"},"rel":[214,216,218],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.4.","annex":["a4"]},{"id":218,"n":218,"es":"Intel VT-x","en":"Intel Virtualization Technology","slug":"intel-vt-x","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Conjunto de extensiones de virtualización de Intel: nuevo anillo -1 (VMX root/non-root), instrucciones VMXON/VMLAUNCH/VMRESUME, VMCS para el estado del invitado y salidas por eventos sensibles. Elimina la necesidad de paravirtualización de la CPU.","rol":"Rendimiento: permite ejecutar el SO invitado en ring 0 virtual con salidas controladas; habilita virtualización asistida por hardware.","cite":{"key":"intel","cap":"Cap. 25","sec":"§25.1–25.3"},"rel":[215,217,219,220,222],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 25, §25.1–25.3.","annex":["a1","a3","a4"]},{"id":219,"n":219,"es":"AMD-V","en":"AMD Virtualization","slug":"amd-v","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Extensiones de virtualización de AMD (SVM): VMCB, instrucción VMRUN, nested paging (NPT) y ASID para evitar invalidaciones de TLB en cada cambio de invitado. Equivalente funcional a VT-x.","rol":"Rendimiento: reduce el coste de cambio de contexto entre hipervisor e invitado; NPT acelera la traducción de memoria anidada.","cite":{"key":"intel","cap":"Cap. 25","sec":"§25.4"},"rel":[215,218,220,222],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 25, §25.4.","annex":["a2","a4","b2"]},{"id":220,"n":220,"es":"Virtualización Asistida","en":"Hardware-Assisted Virtualization","slug":"virtualizacion-asistida","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Uso de extensiones del procesador (VT-x/AMD-V, EPT/NPT, IOMMU/VT-d) para interceptar solo las operaciones necesarias y ejecutar el resto de forma nativa. Sustituye técnicas de traducción binaria y paravirtualización de CPU.","rol":"Rendimiento: reduce el overhead a un dígito en muchos casos; sin ella, la virtualización de x86 exigía emulación o parches al invitado.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.3"},"rel":[210,212,213,215,218,219,221,222,252],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.3.","annex":["a2","a4","c1"]},{"id":221,"n":221,"es":"Paravirtualización","en":"Paravirtualization","slug":"paravirtualizacion","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Modelo en el que el SO invitado, modificado, coopera con el hipervisor mediante una API explícita (hypercalls) en lugar de ejecutar instrucciones sensibles. Ejemplos: Xen PV, drivers virtio, relojes y TLB paravirtuales.","rol":"Rendimiento: reduce salidas y emulación, mejorando E/S; exige kernel adaptado o drivers específicos.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.3"},"rel":[210,212,220,224],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.3.","annex":["a2","a4","c1"]},{"id":222,"n":222,"es":"Tablas Anidadas (EPT/NPT)","en":"Nested Paging (EPT/NPT)","slug":"tablas-anidadas-ept-npt","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Extensión que realiza en hardware la doble traducción invitado→físico-del-invitado→físico-real, mediante EPT (Intel) o NPT (AMD). Elimina la sombra de tablas de páginas (shadow paging) y reduce las salidas del hipervisor en fallos de página.","rol":"Rendimiento: acelera cargas con mucha actividad de memoria; su coste es un page walk más profundo y TLB más exigente.","cite":{"key":"intel","cap":"Cap. 28","sec":"§28.2"},"rel":[129,216,218,219,220],"bib":"Intel Corporation. (2023). *Intel 64 and IA-32 Architectures Software Developer's Manual, Vol. 3A: System Programming Guide*. Intel Press. — Cap. 28, §28.2.","annex":["a2","a4","b2"]},{"id":223,"n":223,"es":"Host OS","en":"Host Operating System","slug":"host-os","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Sistema anfitrión que controla el hardware real y sobre el que se ejecuta el hipervisor de tipo 2 o los procesos de gestión (dom0 en Xen, host en KVM). Aporta drivers, planificación y aislamiento de las VM.","rol":"Control: su planificador y su pila de E/S determinan el rendimiento de los invitados; su seguridad es crítica (escape de VM).","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.2"},"rel":[211,212,214,224],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.2.","annex":["a1","a4","b1"]},{"id":224,"n":224,"es":"Guest OS","en":"Guest Operating System","slug":"guest-os","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Sistema operativo que se ejecuta dentro de una máquina virtual o contenedor creyendo disponer del hardware. Depende del hipervisor para instrucciones privilegiadas y E/S, y puede usar drivers paravirtualizados (virtio) para rendimiento.","rol":"Abstracción: permite ejecutar sistemas heterogéneos sobre un anfitrión; su soporte de virtio y de relojes correctos evita degradación.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.2"},"rel":[210,211,221,223,293],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.2.","annex":["a3","a4","b4"]},{"id":225,"n":225,"es":"Contenedor","en":"Container","slug":"contenedor","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Entorno de ejecución aislado que comparte el kernel del anfitrión y usa namespaces para aislar la vista de procesos, red, montajes y usuarios, más cgroups para limitar recursos y un sistema de archivos en capas. No virtualiza hardware: virtualiza el sistema operativo.","rol":"Aislamiento con bajo overhead: arranca en milisegundos y tiene alta densidad, pero el kernel compartido es una superficie de ataque común.","cite":{"key":"rice","cap":"Cap. 1–2","sec":"§1.2–2.3"},"rel":[210,226,227,228,229,230,233,235,237,240,244,245,246,251,253,286],"bib":"Rice, L. (2020). *Container Security: Fundamental Technology Concepts that Protect Containerized Applications*. O'Reilly. — Cap. 1–2, §1.2–2.3.","annex":["a4","b4","a1"]},{"id":226,"n":226,"es":"Imagen OCI","en":"OCI Image","slug":"imagen-oci","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Artefacto inmutable y versionado compuesto por capas (tar+gzip/zstd) y un manifiesto con digests SHA-256, según la especificación Open Container Initiative. Se distribuye por registros y se materializa en el contenedor mediante un almacén de capas.","rol":"Reproducibilidad: garantiza despliegues idénticos y verificables criptográficamente; las capas compartidas optimizan el almacenamiento.","cite":{"key":"rice","cap":"Cap. 4","sec":"§4.1"},"rel":[225,227,228,245,253],"bib":"Rice, L. (2020). *Container Security: Fundamental Technology Concepts that Protect Containerized Applications*. O'Reilly. — Cap. 4, §4.1.","annex":["a4","b4"]},{"id":227,"n":227,"es":"Docker","en":"Docker","slug":"docker","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Plataforma que popularizó los contenedores Linux: motor (dockerd, containerd, runc), imágenes OCI, Dockerfile, redes y volúmenes. Su API y su ecosistema estandarizaron el empaquetado de aplicaciones.","rol":"Uso práctico: automatiza el ciclo construir→distribuir→ejecutar; su daemon con privilegios de root es un punto sensible de seguridad.","cite":{"key":"docker","cap":"Cap. 1–3","sec":"§1.1–3.2"},"rel":[225,226,228,251],"bib":"Mouat, A. (2015). *Using Docker: Developing and Deploying Software with Containers*. O'Reilly. — Cap. 1–3, §1.1–3.2.","annex":["a3","a4","b4"]},{"id":228,"n":228,"es":"Podman","en":"Podman","slug":"podman","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Motor de contenedores sin daemon (daemonless) y rootless por defecto, compatible con la CLI de Docker y las imágenes OCI; usa conmon y runc/crun para supervisar contenedores y soporta pods al estilo Kubernetes.","rol":"Seguridad: elimina el daemon privilegiado y permite ejecutar como usuario sin root, reduciendo el impacto de un compromiso.","cite":{"key":"rice","cap":"Cap. 6","sec":"§6.2"},"rel":[225,226,227,229,236],"bib":"Rice, L. (2020). *Container Security: Fundamental Technology Concepts that Protect Containerized Applications*. O'Reilly. — Cap. 6, §6.2.","annex":["a3","a4","b4"]},{"id":229,"n":229,"es":"Kernel Compartido","en":"Shared Kernel","slug":"kernel-compartido","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Modelo de contenedores en el que todas las instancias usan el mismo núcleo del anfitrión: no hay traducción de privilegios como en una VM, por lo que una vulnerabilidad del kernel puede afectar a todos los contenedores.","rol":"Rendimiento y riesgo: elimina el overhead de virtualización pero reduce el aislamiento; se mitiga con seccomp, LSM y user namespaces.","cite":{"key":"rice","cap":"Cap. 2","sec":"§2.2"},"rel":[225,228,236,237,256,262],"bib":"Rice, L. (2020). *Container Security: Fundamental Technology Concepts that Protect Containerized Applications*. O'Reilly. — Cap. 2, §2.2.","annex":["a4","a3","b4"]},{"id":230,"n":230,"es":"Linux Namespaces","en":"Linux Namespaces","slug":"linux-namespaces","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Mecanismo del kernel que particiona recursos globales para que cada conjunto de procesos vea su propia instancia: montajes, PID, red, IPC, UTS, usuarios, cgroups y tiempo. Se crean con clone/unshare/setns y son la base del aislamiento de contenedores.","rol":"Seguridad y abstracción: limitan la visibilidad y el alcance de las operaciones; combinados con cgroups forman el modelo de contenedor.","cite":{"key":"kerrisk","cap":"Cap. 57","sec":"§57.1"},"rel":[36,225,231,232,233,234,235,236,240,273,286],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 57, §57.1.","annex":["a4","b4","a1"]},{"id":231,"n":231,"es":"PID Namespace","en":"PID Namespace","slug":"pid-namespace","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Namespace que aísla la numeración de procesos: el primer proceso del namespace tiene PID 1 y no ve los procesos externos; los procesos del anfitrión sí pueden verlos. Afecta a señales, /proc y a la adopción de huérfanos.","rol":"Aislamiento: evita que un contenedor enumere o señalice procesos del host; un PID 1 sin manejo de señales produce fallos de apagado.","cite":{"key":"kerrisk","cap":"Cap. 57","sec":"§57.2"},"rel":[54,60,230,233,274],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 57, §57.2.","annex":["b4","a1","a4"]},{"id":232,"n":232,"es":"Mount Namespace","en":"Mount Namespace","slug":"mount-namespace","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Namespace que otorga a cada conjunto de procesos su propia tabla de montajes: puede montar, desmontar y superponer sistemas de archivos sin afectar al resto. Es lo que permite que un contenedor vea un árbol / diferente (pivot_root, chroot).","rol":"Aislamiento de archivos: hace posible rootfs por contenedor y montajes privados de /proc o /sys; base de OverlayFS en contenedores.","cite":{"key":"kerrisk","cap":"Cap. 57","sec":"§57.3"},"rel":[209,230,240,242,253,271],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 57, §57.3.","annex":["b4","a1","a4"]},{"id":233,"n":233,"es":"Network Namespace","en":"Network Namespace","slug":"network-namespace","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Namespace que aísla interfaces, direcciones, rutas, tablas de filtrado, sockets y puertos; cada contenedor obtiene su propia pila de red y se conecta mediante veth, bridge o macvlan.","rol":"Aislamiento y conflictos: permite usar el mismo puerto en distintos contenedores; requiere configuración explícita de NAT y routing.","cite":{"key":"kerrisk","cap":"Cap. 57","sec":"§57.4"},"rel":[207,225,230,231],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 57, §57.4.","annex":["b4","a2","a4"]},{"id":234,"n":234,"es":"IPC Namespace","en":"IPC Namespace","slug":"ipc-namespace","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Namespace que aísla los mecanismos de comunicación entre procesos: colas de mensajes POSIX/SysV, semáforos, memoria compartida y (desde Linux 5.6) colas POSIX. Impide que procesos de contenedores distintos se comuniquen por esos objetos.","rol":"Aislamiento: evita interferencias y fugas de datos entre contenedores que comparten el mismo kernel.","cite":{"key":"kerrisk","cap":"Cap. 57","sec":"§57.5"},"rel":[230,265,268,269],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 57, §57.5.","annex":["b4","a1","a2"]},{"id":235,"n":235,"es":"UTS Namespace","en":"UTS Namespace","slug":"uts-namespace","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Namespace que aísla el nombre de host y el dominio NIS (uname -n / -d), de modo que cada contenedor puede tener hostname propio aunque comparta la red. El nombre proviene de unix time-sharing system.","rol":"Aislamiento de identidad: permite nombres de nodo por contenedor, útil en servicios que derivan identidad del hostname.","cite":{"key":"kerrisk","cap":"Cap. 57","sec":"§57.6"},"rel":[225,230],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 57, §57.6.","annex":["b4","a3","a4"]},{"id":236,"n":236,"es":"User Namespace","en":"User Namespace","slug":"user-namespace","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Namespace que mapea los UID/GID de un contenedor a un rango no privilegiado del anfitrión mediante uid_map/gid_map, permitiendo ejecutar procesos «root» dentro del contenedor sin ser root real fuera (rootless).","rol":"Seguridad: reduce drásticamente el impacto de una escalada dentro del contenedor; habilita la ejecución sin privilegios (Podman, rootless Docker).","cite":{"key":"kerrisk","cap":"Cap. 57","sec":"§57.7"},"rel":[228,229,230,259,260,261],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 57, §57.7.","annex":["b4","a1","a3"]},{"id":237,"n":237,"es":"cgroups v2","en":"Control Groups v2","slug":"cgroups-v2","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Jerarquía unificada del kernel que agrupa procesos y aplica controladores de recursos: CPU (peso, límites), memoria, E/S (io.max), pids.max y congelación. Su interfaz es el sistema de archivos cgroup2, con archivos como cpu.max y memory.max.","rol":"Arbitraje de recursos: impone cuotas y garantías a contenedores y servicios, y proporciona métricas de consumo (memory.current, memory.events).","cite":{"key":"cgroup","cap":"Cap. 1","sec":"§1.1–1.4"},"rel":[36,46,225,229,238,239,289],"bib":"Heo, T. (2015). *Control Group v2* [Documentación del kernel de Linux]. kernel.org. — Cap. 1, §1.1–1.4.","annex":["a4","b4","a1"]},{"id":238,"n":238,"es":"Cuotas de CPU (cpu.max)","en":"CPU Quotas (cpu.max)","slug":"cuotas-de-cpu-cpu-max","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Archivo de cgroups v2 con dos valores —cuota y periodo en microsegundos— que fija el tiempo máximo de CPU por periodo; por ejemplo, «50000 100000» limita a medio núcleo. Complementa cpu.weight (reparto proporcional).","rol":"Rendimiento y aislamiento: evita el «vecino ruidoso» y garantiza latencia entre cargas colocalizadas, aunque un límite demasiado bajo induce throttling.","cite":{"key":"cgroup","cap":"Cap. 2","sec":"§2.2"},"rel":[100,110,237,246],"bib":"Heo, T. (2015). *Control Group v2* [Documentación del kernel de Linux]. kernel.org. — Cap. 2, §2.2.","annex":["b4","a4","b3"]},{"id":239,"n":239,"es":"Límites de RAM (memory.max)","en":"Memory Limits (memory.max)","slug":"limites-de-ram-memory-max","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Archivo de cgroups v2 que fija el uso máximo de memoria de un grupo; al alcanzarlo, el kernel reclama páginas, recurre a swap del grupo (memory.swap.max) o invoca el OOM killer del cgroup. memory.high establece un umbral de throttling previo.","rol":"Control: contiene el consumo de aplicaciones y aísla los efectos del OOM; su configuración incorrecta provoca reinicios inesperados.","cite":{"key":"cgroup","cap":"Cap. 5","sec":"§5.1"},"rel":[139,159,237],"bib":"Heo, T. (2015). *Control Group v2* [Documentación del kernel de Linux]. kernel.org. — Cap. 5, §5.1.","annex":["b4","a2","a4"]},{"id":240,"n":240,"es":"Chroot Jail","en":"chroot Jail","slug":"chroot-jail","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Cambio de la raíz aparente de un proceso mediante chroot(2), con lo que no puede acceder a rutas fuera del nuevo árbol. No es un mecanismo de seguridad robusto: un proceso con privilegios puede escapar y los descriptores abiertos permanecen accesibles.","rol":"Control: útil para confinar servicios simples y sistemas de rescate; requiere pivot_root, namespaces y capabilities reducidas para ser seguro.","cite":{"key":"kerrisk","cap":"Cap. 18","sec":"§18.5"},"rel":[225,230,232,261],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 18, §18.5.","annex":["a1","a3","a4"]},{"id":241,"n":241,"es":"Sistema Operativo Inmutable","en":"Immutable OS","slug":"sistema-operativo-inmutable","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Diseño en el que el sistema de archivos raíz es de solo lectura y se reemplaza atómicamente en cada actualización (imágenes A/B), mientras los datos persisten en volúmenes separados. Reduce la deriva de configuración y facilita la reproducibilidad.","rol":"Seguridad y operación: el estado conocido se restaura ante fallos; las actualizaciones son transaccionales y reversibles, con menor superficie de error.","cite":{"key":"kernel","cap":"admin-guide","sec":"§ro-rootfs"},"rel":[242,243,244,254],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §ro-rootfs.","annex":["a1","a2","b3"]},{"id":242,"n":242,"es":"Montaje de Solo Lectura (ro)","en":"Read-Only Mount (ro)","slug":"montaje-de-solo-lectura-ro","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Opción de montaje que impide cualquier modificación del sistema de archivos montado; escribir genera EROFS. Se aplica a la raíz de sistemas inmutables, a /usr, a imágenes de contenedor y a medios de solo lectura.","rol":"Seguridad e integridad: reduce la superficie de ataque y garantiza que el estado base no se altere; obliga a separar datos mutables en otros volúmenes.","cite":{"key":"kerrisk","cap":"Cap. 14","sec":"§14.2"},"rel":[209,232,241],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 14, §14.2.","annex":["a1","a4","b1"]},{"id":243,"n":243,"es":"Talos Linux","en":"Talos Linux","slug":"talos-linux","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Distribución de Kubernetes inmutable y mínima, sin shell ni SSH, gestionada únicamente por API (talosctl), con raíz de solo lectura, sistema de archivos efímero y actualizaciones atómicas. Enfocada en seguridad y reproducibilidad.","rol":"Seguridad operativa: elimina el acceso interactivo y las herramientas locales, reduciendo el pivoteo tras un compromiso.","cite":{"key":"kernel","cap":"admin-guide","sec":"§talos"},"rel":[241,244,251,254],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §talos.","annex":["b3"]},{"id":244,"n":244,"es":"Flatcar Linux","en":"Flatcar Container Linux","slug":"flatcar-linux","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"SO inmutable derivado de CoreOS, con actualizaciones automáticas A/B, raíz de solo lectura, configuración declarativa (Ignition/Butane) y un conjunto mínimo de servicios, orientado a ejecutar contenedores.","rol":"Operación: aplica el modelo de ganado (reinmutable) en lugar de mascota: los nodos se reemplazan y configuran de forma reproducible.","cite":{"key":"kernel","cap":"admin-guide","sec":"§flatcar"},"rel":[225,241,243,251,254],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §flatcar.","annex":["a4","b4"]},{"id":245,"n":245,"es":"Alpine Linux","en":"Alpine Linux","slug":"alpine-linux","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Distribución mínima basada en musl libc y BusyBox, con imagen base de ~5 MB, gestión con apk y opción de usar OpenRC o busybox init; popular como base de contenedores.","rol":"Rendimiento y superficie: reduce tamaño y vulnerabilidades potenciales, a costa de diferencias de compatibilidad con glibc.","cite":{"key":"docker","cap":"Cap. 4","sec":"§4.2"},"rel":[50,225,226],"bib":"Mouat, A. (2015). *Using Docker: Developing and Deploying Software with Containers*. O'Reilly. — Cap. 4, §4.2.","annex":["a4","b4"]},{"id":246,"n":246,"es":"Overhead de Virtualización","en":"Virtualization Overhead","slug":"overhead-de-virtualizacion","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Coste adicional de ejecutar cargas en un entorno virtualizado: salidas del hipervisor (VM exits), traducción de memoria anidada, E/S emulada o paravirtualizada y doble planificación. En contenedores se reduce a los mecanismos de namespaces y cgroups.","rol":"Métrica de decisión: determina la elección entre VM (aislamiento) y contenedor (densidad), y el uso de virtio, EPT y SR-IOV para mitigarlo.","cite":{"key":"silb","cap":"Cap. 16","sec":"§16.5"},"rel":[210,213,225,238,248],"bib":"Silberschatz, A., Galvin, P. B., & Gagne, G. (2018). *Operating System Concepts* (10.ª ed.). Wiley. — Cap. 16, §16.5.","annex":["a4","a1","a2"]},{"id":247,"n":247,"es":"Cold Boot","en":"Cold Boot","slug":"cold-boot","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Arranque de un sistema desde un estado completamente apagado (o tras una desconexión de energía), a diferencia de warm boot o reinicio lógico. Incluye POST, firmware, bootloader y kernel, y presenta una línea base de estado confiable.","rol":"Seguridad y medición: el arranque en frío es requisito de atestación (Secure Boot/TPM) y su tiempo es una métrica de disponibilidad.","cite":{"key":"uefi","cap":"Cap. 3","sec":"§3.1"},"rel":[38,39,40,248],"bib":"UEFI Forum. (2022). *Unified Extensible Firmware Interface Specification* (v2.10). UEFI Forum, Inc. — Cap. 3, §3.1.","annex":["a1"]},{"id":248,"n":248,"es":"Benchmarking","en":"Benchmarking","slug":"benchmarking","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Medición sistemática del rendimiento mediante cargas de trabajo reproducibles y métricas definidas (latencia, throughput, percentiles, uso de CPU), con control de variables y repeticiones para reducir el ruido estadístico.","rol":"Evaluación: permite comparar configuraciones y detectar regresiones; un benchmark mal diseñado (cachés, JIT, coordinación omitida) produce conclusiones falsas.","cite":{"key":"bench","cap":"Cap. 2","sec":"§2.1–2.4"},"rel":[110,113,246,247,249,250,289],"bib":"Gregg, B. (2013). *Systems Performance: Enterprise and the Cloud*. Prentice Hall. — Cap. 2, §2.1–2.4.","annex":[]},{"id":249,"n":249,"es":"wrk","en":"wrk","slug":"wrk","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Herramienta de benchmarking HTTP multihilo basada en epoll, con soporte de scripting Lua, conexiones persistentes y generación de latencias por percentiles (p50, p99). Ideal para medir servidores de alto throughput.","rol":"Medición: cuantifica latencia y peticiones por segundo; requiere calibración del número de conexiones para evitar ser el cuello de botella.","cite":{"key":"bench","cap":"Cap. 12","sec":"§12.2"},"rel":[113,248,250],"bib":"Gregg, B. (2013). *Systems Performance: Enterprise and the Cloud*. Prentice Hall. — Cap. 12, §12.2.","annex":["b1","b5"]},{"id":250,"n":250,"es":"pacheBench (ab)","en":"ApacheBench (ab)","slug":"pachebench-ab","mod":5,"modName":"Almacenamiento, virtualización y contenedores","def_":"Utilidad de Apache HTTP Server para generar cargas HTTP simple (ab -n -c), con estadísticas de tiempo por petición, tasa de fallos y distribución de latencias. Limitada en escenarios modernos por su modelo de concurrencia.","rol":"Medición: rápida para comparar servidores básicos; su baja fidelidad con keep-alive y TLS la restringe a pruebas gruesas.","cite":{"key":"bench","cap":"Cap. 12","sec":"§12.1"},"rel":[248,249],"bib":"Gregg, B. (2013). *Systems Performance: Enterprise and the Cloud*. Prentice Hall. — Cap. 12, §12.1.","annex":["a3","b1","b5"]},{"id":251,"n":251,"es":"Orquestación","en":"Orchestration","slug":"orquestacion","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Automatización de la gestión de contenedores a escala: despliegue, escalado, balanceo, auto-reparación, descubrimiento de servicios y actualizaciones progresivas. Kubernetes es el estándar de facto; alternativas: Nomad, Docker Swarm.","rol":"Control de sistemas distribuidos: mantiene el estado deseado frente a fallos; su planificador asigna pods a nodos según recursos y afinidades.","cite":{"key":"k8s","cap":"Cap. 1","sec":"§1.1–1.4"},"rel":[225,227,243,244,254],"bib":"Burns, B., Beda, J., & Hightower, K. (2019). *Kubernetes: Up and Running* (2.ª ed.). O'Reilly. — Cap. 1, §1.1–1.4.","annex":["a4","a1","b1"]},{"id":252,"n":252,"es":"Kernel Monolítico vs Emulado","en":"Monolithic vs Emulated Kernel","slug":"kernel-monolitico-vs-emulado","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Contraste entre un kernel monolítico (servicios en un único espacio privilegiado, comunicación por llamadas a función) y un kernel emulado/paravirtualizado en un VMM (instrucciones sensibles interceptadas y emuladas). El primero maximiza rendimiento; el segundo, aislamiento y portabilidad.","rol":"Arquitectura: la elección condiciona el coste de las operaciones privilegiadas, la superficie de fallo y la compatibilidad de drivers.","cite":{"key":"tanen","cap":"Cap. 1","sec":"§1.4"},"rel":[31,32,210,220],"bib":"Tanenbaum, A. S., & Bos, H. (2015). *Modern Operating Systems* (4.ª ed.). Pearson. — Cap. 1, §1.4.","annex":["a3","a4"]},{"id":253,"n":253,"es":"OverlayFS","en":"OverlayFS","slug":"overlayfs","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Sistema de archivos de unión que combina una capa inferior de solo lectura y una superior de escritura, con whiteouts para ocultar archivos y copy-up al modificar. Es el mecanismo estándar de las capas de contenedor (overlay2) en Linux.","rol":"Rendimiento y almacenamiento: comparte capas inmutables entre contenedores y escribe solo lo modificado; accesos a archivos grandes implican copia completa.","cite":{"key":"kernel","cap":"filesystems","sec":"§overlayfs"},"rel":[208,225,226,232],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — filesystems, §overlayfs.","annex":["a4","b3","b4"]},{"id":254,"n":254,"es":"Stateless OS","en":"Stateless Operating System","slug":"stateless-os","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Diseño en el que el nodo no conserva estado local relevante: la configuración proviene de una fuente declarativa (Ignition, cloud-init) y los datos viven en servicios externos, de modo que cualquier instancia puede reconstruirse idénticamente.","rol":"Operación y escalabilidad: habilita reemplazo automático de nodos, reproducibilidad y recuperación ante desastres; exige almacenamiento y configuración externos fiables.","cite":{"key":"kernel","cap":"admin-guide","sec":"§stateless"},"rel":[241,243,244,251],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §stateless.","annex":["a1","a2","a3"]},{"id":255,"n":255,"es":"DAC","en":"Discretionary Access Control","slug":"dac","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Modelo de control de acceso en el que el propietario del recurso decide quién puede acceder (permisos rwx, ACL). Es discrecional porque la política queda en manos de usuarios y no de una política global del sistema.","rol":"Seguridad: simple y flexible, pero insuficiente frente a malware que hereda los privilegios del usuario; se complementa con MAC.","cite":{"key":"selinux","cap":"Cap. 1","sec":"§1.1–1.3"},"rel":[37,196,197,202,256,257,258,294],"bib":"Mayer, F., Caplan, D., & MacMillan, K. (2006). *SELinux by Example: Using Security Enhanced Linux*. Prentice Hall. — Cap. 1, §1.1–1.3.","annex":["a3","b3"]},{"id":256,"n":256,"es":"MAC","en":"Mandatory Access Control","slug":"mac","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Modelo en el que una política global, definida por la administración, decide los accesos con independencia de la voluntad del propietario: cada sujeto y objeto tiene una etiqueta y el sistema impone las reglas (dominio-tipo, Bell-LaPadula, Biba).","rol":"Seguridad: contiene el daño de procesos comprometidos y separa privilegios por etiquetas; su gestión exige políticas cuidadosamente escritas.","cite":{"key":"selinux","cap":"Cap. 2","sec":"§2.1"},"rel":[40,47,109,196,229,255,257,258,259,260],"bib":"Mayer, F., Caplan, D., & MacMillan, K. (2006). *SELinux by Example: Using Security Enhanced Linux*. Prentice Hall. — Cap. 2, §2.1.","annex":["a1","a3","b1"]},{"id":257,"n":257,"es":"SELinux","en":"Security-Enhanced Linux","slug":"selinux","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Módulo LSM de la NSA (integrado en el kernel Linux) que implementa MAC mediante etiquetas de contexto (usuario:rol:tipo:nivel) y una política compilada que autoriza operaciones entre dominios y tipos. Modos: enforcing, permissive y disabled.","rol":"Seguridad: confina servicios (httpd_t, sshd_t) incluso si se ejecutan como root; los avisos AVC y audit2allow guían la depuración.","cite":{"key":"selinux","cap":"Cap. 2–4","sec":"§2.2–4.3"},"rel":[47,255,256,258,259,270],"bib":"Mayer, F., Caplan, D., & MacMillan, K. (2006). *SELinux by Example: Using Security Enhanced Linux*. Prentice Hall. — Cap. 2–4, §2.2–4.3.","annex":["a3"]},{"id":258,"n":258,"es":"AppArmor","en":"AppArmor","slug":"apparmor","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Módulo LSM de Canonical que aplica MAC basado en rutas de archivo mediante perfiles en texto (/etc/apparmor.d), con modos enforce/complain y perfiles por programa. Es más simple de auditar que SELinux pero menos expresivo.","rol":"Seguridad: restringe las capacidades y accesos de binarios concretos; su modelo de rutas puede verse afectado por enlaces y montajes.","cite":{"key":"apparmor","cap":"Vol. 2","sec":"§2–4"},"rel":[255,256,257,259],"bib":"Canonical Ltd. (2023). *AppArmor: Linux kernel security module* [Documentación]. Ubuntu. — Vol. 2, §2–4.","annex":["a3","b3"]},{"id":259,"n":259,"es":"Contexto de Seguridad","en":"Security Context","slug":"contexto-de-seguridad","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Conjunto de etiquetas que identifican a un sujeto u objeto bajo MAC: en SELinux, usuario, rol, tipo y nivel (por ejemplo system_u:system_r:httpd_t:s0); en Kubernetes, el securityContext define UID, capabilities, perfiles seccomp y SELinux del pod.","rol":"Control: es la información que evalúa el LSM en cada acceso; mal etiquetado produce denegaciones o brechas de confinamiento.","cite":{"key":"selinux","cap":"Cap. 2","sec":"§2.3"},"rel":[236,256,257,258],"bib":"Mayer, F., Caplan, D., & MacMillan, K. (2006). *SELinux by Example: Using Security Enhanced Linux*. Prentice Hall. — Cap. 2, §2.3.","annex":["a3"]},{"id":260,"n":260,"es":"Principio de Menor Privilegio","en":"Principle of Least Privilege","slug":"principio-de-menor-privilegio","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Principio de seguridad (Saltzer & Schroeder, 1975) según el cual cada sujeto debe operar con el conjunto mínimo de privilegios necesario para su tarea y solo durante el tiempo requerido. Se aplica con capabilities, seccomp, usuarios sin privilegios y MAC.","rol":"Diseño seguro: limita el impacto de errores y compromisos; es el fundamento de rootless, sandboxing y separación de dominios.","cite":{"key":"saltzer","cap":"Vol. 63","sec":"§IV.A"},"rel":[35,236,256,261,262],"bib":"Saltzer, J. H., & Schroeder, M. D. (1975). The protection of information in computer systems. *Proceedings of the IEEE, 63*(9), 1278–1308. — Vol. 63, §IV.A.","annex":["a3"]},{"id":261,"n":261,"es":"Linux Capabilities","en":"Linux Capabilities","slug":"linux-capabilities","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"División del privilegio de root en unidades independientes (CAP_NET_ADMIN, CAP_SYS_ADMIN, CAP_CHOWN…), asignables por proceso o ejecutable (setcap/getcap) y descartables (capsh --drop). Permiten delegar poderes sin conceder root completo.","rol":"Seguridad: reduce el daño de un servicio comprometido; se combinan con user namespaces y se filtran con seccomp.","cite":{"key":"kerrisk","cap":"Cap. 39","sec":"§39.1"},"rel":[80,196,197,236,240,260,262],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 39, §39.1.","annex":["a1","a3","a4"]},{"id":262,"n":262,"es":"Seccomp","en":"seccomp / Seccomp-BPF","slug":"seccomp","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Mecanismo del kernel que filtra las llamadas al sistema de un proceso mediante un programa BPF (SECCOMP_SET_MODE_FILTER): puede permitir, devolver error o matar el proceso. Docker y systemd lo aplican por defecto con perfiles restrictivos.","rol":"Seguridad: reduce la superficie de ataque del kernel eliminando syscalls innecesarias; un filtro demasiado estricto rompe aplicaciones legítimas.","cite":{"key":"seccomp","cap":"Sección 2","sec":"seccomp(2)"},"rel":[11,229,260,261,276],"bib":"Linux Kernel Organization. (2024). *seccomp(2) — Linux manual page*. man7.org. — Sección 2, seccomp(2).","annex":["a3","b4","a1"]},{"id":263,"n":263,"es":"Buffer Overflow","en":"Buffer Overflow","slug":"buffer-overflow","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Escritura fuera de los límites de un búfer que corrompe memoria adyacente (variables, dirección de retorno), pudiendo desviar el flujo de ejecución. Es la vulnerabilidad clásica de C y de código sin comprobación de longitudes.","rol":"Seguridad: explotable si la memoria es ejecutable; se mitiga con NX, ASLR, canarios y compiladores endurecidos, pero sigue presente en código legado.","cite":{"key":"csapp","cap":"Cap. 3","sec":"§3.10"},"rel":[9,18,64,157,158,264],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 3, §3.10.","annex":["a2","b2","b4"]},{"id":264,"n":264,"es":"Stack Canaries","en":"Stack Canaries","slug":"stack-canaries","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Valor centinela colocado entre los datos locales y la dirección de retorno; el epílogo de la función lo verifica y aborta si cambió (__stack_chk_fail). Detecta desbordamientos lineales antes de que se usen para secuestrar el control.","rol":"Seguridad: mitiga el buffer overflow clásico con coste mínimo; no protege desbordamientos que no alcanzan el canario ni fugas de puntero.","cite":{"key":"csapp","cap":"Cap. 3","sec":"§3.10"},"rel":[10,64,157,263],"bib":"Bryant, R. E., & O'Hallaron, D. R. (2016). *Computer Systems: A Programmer's Perspective* (3.ª ed.). Pearson. — Cap. 3, §3.10.","annex":["a2","b2"]},{"id":265,"n":265,"es":"IPC","en":"Inter-Process Communication","slug":"ipc","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Conjunto de mecanismos del SO para que procesos aislados intercambien datos y se sincronicen: pipes, FIFOs, memoria compartida, colas de mensajes, semáforos, señales, sockets y Binder. Su elección depende de semántica, rendimiento y ámbito (local, red, sistema).","rol":"Abstracción y coordinación: rompe el aislamiento de forma controlada; el kernel media, copia datos y aplica permisos y límites.","cite":{"key":"kerrisk","cap":"Cap. 43","sec":"§43.1"},"rel":[234,266,267,268,269,270],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 43, §43.1.","annex":["a1","a2","a6"]},{"id":266,"n":266,"es":"Pipes Anónimos","en":"Anonymous Pipes","slug":"pipes-anonimos","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Canal unidireccional en memoria con dos descriptores (lectura/escritura), creado por pipe(2) y heredado por fork; su capacidad está limitada (64 KiB por defecto) y aplica contrapresión cuando el búfer se llena. Es la base de la composición en la shell (ls | grep).","rol":"Rendimiento: comunicación por copia en kernel sin syscalls por byte; su semántica simple los hace idóneos para productor-consumidor emparentado.","cite":{"key":"kerrisk","cap":"Cap. 44","sec":"§44.1"},"rel":[29,68,265,267],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 44, §44.1.","annex":["a1","a2","a3"]},{"id":267,"n":267,"es":"FIFOs (Pipes con Nombre)","en":"Named Pipes / FIFOs","slug":"fifos-pipes-con-nombre","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Archivo especial en el sistema de archivos (mkfifo) que actúa como pipe persistente entre procesos no emparentados, con semántica de bloqueo hasta que ambos extremos se abren y respeto de permisos del sistema de archivos.","rol":"Comunicación: permite IPC entre servicios independientes y tiene visibilidad administrativa, a diferencia del pipe anónimo.","cite":{"key":"kerrisk","cap":"Cap. 44","sec":"§44.2"},"rel":[196,265,266],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 44, §44.2.","annex":["a1","b1","b3"]},{"id":268,"n":268,"es":"Memoria Compartida","en":"Shared Memory","slug":"memoria-compartida","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Región de memoria mapeada en varios procesos (shmget/ shmat, shm_open+mmap o memfd) que permite acceso directo sin copias en kernel; requiere sincronización explícita (semáforos, mutex en la región). Es el IPC de mayor rendimiento.","rol":"Rendimiento: elimina copias y syscalls por acceso; su peligro es la corrupción mutua y la coherencia en arquitecturas multicore.","cite":{"key":"kerrisk","cap":"Cap. 48","sec":"§48.1"},"rel":[75,165,234,265,272],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 48, §48.1.","annex":["a1","a2","a3"]},{"id":269,"n":269,"es":"Colas de Mensajes","en":"Message Queues","slug":"colas-de-mensajes","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Mecanismo IPC que transporta mensajes discretos y tipados con prioridades (POSIX mq_open/mq_send o SysV msgget/msgsnd), desacoplando emisor y receptor y preservando límites de mensaje. El kernel aplica límites de tamaño y de cola (msgmax, msgmnb).","rol":"Coordinación: permite comunicación asíncrona sin bloqueo y con orden por prioridad; introduce copia en kernel y límites administrativos.","cite":{"key":"kerrisk","cap":"Cap. 46","sec":"§46.1"},"rel":[234,265,270],"bib":"Kerrisk, M. (2010). *The Linux Programming Interface*. No Starch Press. — Cap. 46, §46.1.","annex":["a1","b1","b4"]},{"id":270,"n":270,"es":"Binder IPC","en":"Binder IPC Driver","slug":"binder-ipc","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Driver de Android (/dev/binder) que implementa IPC síncrono y orientado a objetos: un proceso publica un objeto Binder y otro obtiene un handle con el que invocar transacciones, con copia única de datos y gestión de hilos mediante el pool de hilos del proceso servidor.","rol":"Rendimiento y seguridad: sustituye a sockets/pipes con menor coste y permite pasar FDs y aplicar SELinux por contexto; base de todas las llamadas de framework en Android.","cite":{"key":"levin","cap":"Vol. 1","sec":"Cap. 4"},"rel":[257,265,269,271,273,290],"bib":"Levin, J. (2015). *Android Internals: A Confectioner's Cookbook* (Vol. 1). Technologies. — Vol. 1, Cap. 4.","annex":["a1","b1","b5"]},{"id":271,"n":271,"es":"binderfs","en":"binderfs","slug":"binderfs","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Sistema de archivos virtual (Linux 5.0+) que permite múltiples instancias de Binder (una por contenedor o contexto) mediante montajes independientes, superando la limitación del nodo global /dev/binder.","rol":"Aislamiento: permite ejecutar múltiples contenedores Android (Waydroid) en un mismo kernel sin colisiones de Binder.","cite":{"key":"kernel","cap":"filesystems","sec":"§binderfs"},"rel":[232,270,272,273,290],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — filesystems, §binderfs.","annex":["a4","b3","b4"]},{"id":272,"n":272,"es":"shmem","en":"shmem (tmpfs)","slug":"shmem","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Mecanismo del kernel que proporciona páginas anónimas compartibles, usado por tmpfs (archivos en RAM), memoria compartida POSIX (shm_open) y SysV (shmget). Las páginas residen en RAM y pueden enviarse a swap.","rol":"Rendimiento: memoria de baja latencia sin E/S de disco, pero consume RAM y swap; su tamaño se controla con la opción size= de tmpfs","cite":{"key":"kernel","cap":"admin-guide","sec":"§shmem"},"rel":[75,139,268,271],"bib":"Linux Kernel Organization. (2024). *The Linux Kernel documentation*. docs.kernel.org. — admin-guide, §shmem.","annex":["a2","b2","b3"]},{"id":273,"n":273,"es":"/dev/binder","en":"/dev/binder","slug":"dev-binder","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Nodo de dispositivo que expone el driver Binder; las transacciones se envían mediante ioctl a un handle, y el servidor responde escribiendo en el mismo mapeo mmap. Desde binderfs se monta por instancia (/dev/binder, /dev/vndbinder, /dev/hwbinder).","rol":"Control: canal único de IPC del framework de Android; sus permisos y su contexto SELinux determinan la superficie de ataque.","cite":{"key":"levin","cap":"Vol. 1","sec":"Cap. 4"},"rel":[165,230,270,271],"bib":"Levin, J. (2015). *Android Internals: A Confectioner's Cookbook* (Vol. 1). Technologies. — Vol. 1, Cap. 4.","annex":["b3"]},{"id":274,"n":274,"es":"/proc","en":"procfs","slug":"proc","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Sistema de archivos virtual que expone el estado del kernel y de los procesos: /proc/[pid]/status, maps, smaps, fd, sched, y /proc/sys para parámetros ajustables. Su lectura genera contenido dinámico en cada acceso.","rol":"Observabilidad: fuente primaria de pmap, ps, top y vmstat; su exposición en contenedores puede filtrar información del host.","cite":{"key":"bovet","cap":"Cap. 2","sec":"§2.3"},"rel":[160,162,163,231,275,276],"bib":"Bovet, D. P., & Cesati, M. (2005). *Understanding the Linux Kernel* (3.ª ed.). O'Reilly. — Cap. 2, §2.3.","annex":["b3","a1","a4"]},{"id":275,"n":275,"es":"/sys","en":"sysfs","slug":"sys","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Sistema de archivos virtual que representa el modelo de dispositivos del kernel: buses, clases, dispositivos, drivers y atributos de energía. Cada directorio corresponde a un kobject y muchos archivos son ajustables (por ejemplo, /sys/block/sda/queue/scheduler).","rol":"Control y observabilidad: permite inspeccionar y modificar parámetros de hardware sin herramientas específicas; base de udev y de la administración moderna.","cite":{"key":"ldd","cap":"Cap. 14","sec":"§14.3"},"rel":[274,276,277,286],"bib":"Corbet, J., Rubini, A., & Kroah-Hartman, G. (2005). *Linux Device Drivers* (3.ª ed.). O'Reilly. — Cap. 14, §14.3.","annex":["b3"]},{"id":276,"n":276,"es":"strace","en":"strace","slug":"strace","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Herramienta basada en ptrace que traza las llamadas al sistema, señales y errores (errno) de un proceso, con filtros (-e trace=), tiempos (-T) y adjunción a procesos en ejecución (-p). Muestra el contrato real entre programa y kernel.","rol":"Depuración: localiza fallos de permisos, ENOENT, bloqueos y syscalls inesperadas; su coste de contexto la hace invasiva en producción.","cite":{"key":"man7","cap":"Sección 1","sec":"strace(1)"},"rel":[11,262,274,275,277],"bib":"Kerrisk, M. (Ed.). (2024). *Linux man-pages project* [Manual del programador]. kernel.org. — Sección 1, strace(1).","annex":["b3","a1","a3"]},{"id":277,"n":277,"es":"udev","en":"udev","slug":"udev","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Gestor de dispositivos del espacio de usuario que, ante eventos del kernel (netlink uevents), crea nodos en /dev, aplica reglas de nombrado, permisos y enlaces, y ejecuta acciones al conectar/desconectar hardware. En sistemas modernos lo implementa systemd-udevd.","rol":"Control de hardware: materializa el modelo de /sys en dispositivos utilizables; sus reglas determinan permisos y estabilidad de nombres (/dev/disk/by-uuid).","cite":{"key":"ldd","cap":"Cap. 14","sec":"§14.4"},"rel":[46,275,276,287],"bib":"Corbet, J., Rubini, A., & Kroah-Hartman, G. (2005). *Linux Device Drivers* (3.ª ed.). O'Reilly. — Cap. 14, §14.4.","annex":["b3"]},{"id":278,"n":278,"es":"Subsistema Gráfico Linux","en":"Linux Graphics Subsystem","slug":"subsistema-grafico-linux","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Pila completa que conecta aplicaciones y compositores con la GPU: bibliotecas cliente (Mesa, EGL), protocolo de ventanas (Wayland/X11), compositor, kernel (DRM/KMS) y controladores de GPU. Cada capa traduce una abstracción en operaciones de renderizado y presentación.","rol":"Abstracción: separa la lógica de aplicación del hardware gráfico; su diseño afecta latencia de entrada, seguridad (aislamiento) y consumo.","cite":{"key":"wayland","cap":"Cap. 1","sec":"§1–2"},"rel":[279,280,284,285,287],"bib":"Ser, S. (2021). *The Wayland Protocol*. wayland.freedesktop.org. — Cap. 1, §1–2.","annex":[]},{"id":279,"n":279,"es":"Servidor X11","en":"X11 Server (Xorg)","slug":"servidor-x11","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Arquitectura cliente-servidor gráfica de 1986 en la que el servidor X gestiona pantalla, entrada y ventanas, y los clientes dibujan mediante el protocolo X o GLX. Su modelo distribuido y su extensibilidad son su fortaleza, pero también su superficie de ataque y latencia.","rol":"Control de hardware: centraliza el acceso a la GPU y a los dispositivos de entrada; los clientes no acceden directamente al hardware.","cite":{"key":"x11","cap":"Vol. 5","sec":"§2–4"},"rel":[278,280,284],"bib":"Scheifler, R. W., & Gettys, J. (1986). The X Window System. *ACM Transactions on Graphics, 5*(2), 79–109. — Vol. 5, §2–4.","annex":[]},{"id":280,"n":280,"es":"Compositor Wayland","en":"Wayland Compositor","slug":"compositor-wayland","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Servidor gráfico moderno en el que el compositor es el gestor de ventanas y el servidor de protocolo: los clientes entregan búferes (dmabuf/shm), y el compositor los compone y presenta en la pantalla. Sustituye a X11 eliminando el intermediario y mejorando el aislamiento y la latencia.","rol":"Control: arbitra la pantalla y la entrada; define políticas de seguridad por superficie y controla el tearing y la sincronización.","cite":{"key":"wayland","cap":"Cap. 2–4","sec":"§2–4"},"rel":[278,279,281,282,283,285,290],"bib":"Ser, S. (2021). *The Wayland Protocol*. wayland.freedesktop.org. — Cap. 2–4, §2–4.","annex":["a3"]},{"id":281,"n":281,"es":"Weston","en":"Weston","slug":"weston","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Compositor Wayland de referencia de freedesktop.org, minimalista y modular, usado como implementación canónica y base para pruebas de protocolo; soporta kiosco, escritorios y backends DRM/headless/X11.","rol":"Referencia: valida el protocolo y sirve de laboratorio para desarrolladores de compositores y de clientes.","cite":{"key":"wayland","cap":"Cap. 5","sec":"§5.1"},"rel":[280,282,283],"bib":"Ser, S. (2021). *The Wayland Protocol*. wayland.freedesktop.org. — Cap. 5, §5.1.","annex":[]},{"id":282,"n":282,"es":"Sway","en":"Sway","slug":"sway","mod":6,"modName":"Seguridad, IPC y sistemas especializados","def_":"Compositor Wayland con gestor de ventanas en mosaico (tiling), compatible con la configuración de i3 (i3bar, i3blocks), orientado a teclado y bajo consumo. Implementa protocolos wlroots y es una alternativa ligera a los escritorios completos.","rol":"Uso práctico: dem
